# debugRelay 默认配置文件
# 位置: 脚本同级 (debug_relay.config.yaml)
# 加载顺序: --config 参数 > 脚本同级默认 > CLI 显式覆盖
# 支持 JSON / YAML, 后缀决定解析器

whitelist:
  enabled: true
  ips:
    - 127.0.0.1
    - 192.168.41.158
    - 192.168.46.68
    - 172.16.40.96

# 源码目录（Sources 面板，不依赖设备，以本机代码为准；--src 可覆盖）
source_dir: "D:/Codlib/douque/xzmx/ClientEngineGame/trunk/assets"

# 当前 Cocos 项目根（Build/编译状态 tab 用；默认取 source_dir 的父目录）
project_dir: "D:/Codlib/douque/xzmx/git/xzmk"

# 行为树可视化配置（行为树 tab）
# layers: 四层行为树目录（绝对路径）
#   base_btree / base_popup   引擎插件基础层（CocosCreator2.0/Plugins）
#   override_btree / override_popup  客户端覆写层（trunk/assets/resources/config）
# template_root: 节点->TS 解析根（@action 装饰器所在，Template/game）
btree:
  layers:
    base_btree: "D:/CocosCreator2.0/Plugins/btree"
    base_popup: "D:/CocosCreator2.0/Plugins/btree/popup"
    override_btree: "D:/Codlib/douque/xzmx/ClientEngineGame/trunk/assets/resources/config/btree"
    override_popup: "D:/Codlib/douque/xzmx/ClientEngineGame/trunk/assets/resources/config/popup"
  template_root: "D:/CocosCreator2.0/Template/game"
  write_ips:            # 写操作(编辑/拷贝/回滚) IP 白名单
    - 127.0.0.1
    - 192.168.41.158
