[package]
name = "webreader-server"
version = "0.1.0"
edition = "2021"
description = "WebReader standalone HTTP service (separated from RoleManager, managed by InfoServer)"

[[bin]]
name = "webreader-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
sha1 = "0.10"
regex = "1"
rayon = "1"
