<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/icon/tabIcon.ico" type="image/x-icon">
    <title>Windows服务管理工具 By Liz</title>
    <style>
        html {
            scrollbar-gutter: stable; /* 预留滚动条槽: 无条也留位, 展开出现条时不挤内容左移 */
        }

        /* ===== 字体 (2026-09-21) =====
           界面字体 (标题/标签/按钮/列表): 黑体系 —— 替掉 Arial; Arial 不含中文, 中文会掉进
           宋体 (SimSun) 发虚发糊, 这是之前"不好看"的主因。
           配置正文 (textarea): 显式等宽 —— Windows 的 monospace 会落到 Courier New (细而旧),
           换成 Consolas; 中文回退雅黑/黑体。ini/json/lua 的缩进 + 易辨识字形 (l/1/I、O/0) 是刚需,
           所以正文不跟界面走衬线体 (Times New Roman 是比例衬线, 会把缩进与列对齐打散)。 */
        :root {
            --ui-font: "Microsoft YaHei", "微软雅黑", "SimHei", "黑体", "Segoe UI", Arial, sans-serif;
            --code-font: Consolas, "Cascadia Mono", "Courier New", "Microsoft YaHei", "微软雅黑", monospace;
        }

        body {
            font-family: var(--ui-font);
            margin: 0;
            padding: 0; /* 移除body的padding，由container控制 */
            background-color: transparent; /* 背景透明以露出底层背景图 */
            display: flex; /* 使用flex布局 */
            min-height: 100vh; /* 确保页面至少和视口一样高 */
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 100%;
            margin: 0;
            min-height: 100vh;
        }

        .sidebar-wrapper {
            display: flex;
            align-items: center;
            height: 100vh;
            position: sticky;
            top: 0;
            z-index: 1001;
            flex-shrink: 0;
        }

        .sidebar {
            width: 0;
            flex: 0 0 0;
            background: rgba(255, 255, 255, 0.25); /* 降低背景不透明度 */
            backdrop-filter: blur(15px); /* 增强玻璃模糊效果 */
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        body.dark-theme .sidebar {
            background: rgba(20, 20, 20, 0.3);
            border-right-color: rgba(255, 255, 255, 0.05);
        }

        .sidebar.expanded {
            width: min(300px, 33vw);
            flex: 0 0 min(300px, 33vw);
        }

        .sidebar-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: rgba(0, 123, 255, 0.4); /* 降低不透明度 */
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            width: 300px;
            backdrop-filter: blur(5px);
        }

        body.dark-theme .sidebar-header {
            background: rgba(0, 86, 179, 0.4);
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1.2em;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .toggle-button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 20px 6px;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 0.9em;
            box-shadow: 4px 0 8px rgba(0,123,255,0.3);
            transition: all 0.2s ease;
            margin-left: -1px;
            z-index: 1002;
        }

        .toggle-button:hover {
            background-color: #0056b3;
            padding-right: 10px;
        }

        .sidebar-content {
            width: 300px;
            max-height: calc(100vh - 60px);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
        }

        #friendlinks-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #friendlinks-list li {
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }

        #friendlinks-list li:hover {
            transform: translateX(5px);
        }

        #friendlinks-list a {
            text-decoration: none;
            color: #333;
            display: flex;
            flex-direction: row; /* 强制水平排列 */
            align-items: center; /* 垂直居中对齐 */
            padding: 10px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.4); /* 半透明 */
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            height: 60px; /* 增加高度以适应较大图标 */
            box-sizing: border-box;
            width: 100%;
        }

        body.dark-theme #friendlinks-list a {
            background: rgba(45, 45, 45, 0.4);
            color: #e0e0e0;
            border-color: rgba(255, 255, 255, 0.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        #friendlinks-list a:hover {
            background: #f0f7ff;
            border-color: #007bff;
            color: #007bff;
            box-shadow: 0 4px 12px rgba(0,123,255,0.15);
        }

        body.dark-theme #friendlinks-list a:hover {
            background: #3a3a3a;
            border-color: #007bff;
            color: #007bff;
        }

        .friendlink-icon {
            width: 40px; /* 增大图标以匹配图片 */
            height: 40px;
            margin-right: 15px;
            border-radius: 8px;
            object-fit: cover;
            background: #fff;
            padding: 0;
            flex-shrink: 0;
            display: block;
            border: 1px solid #eee;
        }

        .friendlink-name {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1;
            flex-grow: 1;
        }

        /* 页面背景图容器 */
        .page-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; /* 最底层 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.9; /* 显著提高透明度，使背景图清晰可见 */
            transition: background-image 1s ease-in-out;
        }

        /* 背景遮罩，确保内容可读性 */
        .page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 背景图之上，内容之下 */
            background: linear-gradient(135deg, rgba(245, 245, 245, 0.2) 0%, rgba(245, 245, 245, 0.1) 100%);
            pointer-events: none;
        }

        body.dark-theme .page-overlay {
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.4) 0%, rgba(18, 18, 18, 0.2) 100%);
        }

        .main-content {
            flex-grow: 1;
            padding: 20px;
            position: relative;
            max-width: 1200px; /* 限制主内容的最大宽度 */
            margin: 0 auto; /* 居中显示 */
            width: 100%; /* 确保在小屏幕下占满全宽 */
        }
        
        .breadcrumb {
            margin-bottom: 20px;
            font-size: 14px;
            color: #6c757d;
        }
        
        .breadcrumb a {
            color: #007bff;
            text-decoration: none;
        }
        
        .breadcrumb a:hover {
            text-decoration: underline;
        }
        
        .breadcrumb .current-page-title {
            font-weight: bold;
            color: #343a40;
        }
        
        /* 夜间模式下的面包屑样式 */
        body.dark-theme .breadcrumb {
            color: #b0b0b0;
        }
        
        body.dark-theme .breadcrumb a {
            color: #6cb7ff;
        }
        
        body.dark-theme .breadcrumb a:hover {
            color: #3a98ff;
        }
        
        body.dark-theme .breadcrumb .current-page-title {
            color: #f0f0f0;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        h2 {
            color: #666;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.15); /* 显著降低背景不透明度，增强穿透感 */
            backdrop-filter: blur(15px); /* 增强模糊感 */
            -webkit-backdrop-filter: blur(15px);
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.dark-theme .card {
            background: rgba(20, 20, 20, 0.2); /* 暗色模式下也更透明 */
            border-color: rgba(255, 255, 255, 0.05);
        }

        .service-grid {
            display: block;
            width: 100%;
        }
        
        .game-panel {
            background: rgba(255, 255, 255, 0.08); /* 极高透明度 */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body.dark-theme .game-panel {
            background: rgba(20, 20, 20, 0.15);
            border-color: rgba(255, 255, 255, 0.05);
        }
        
        .panel-header {
            background-color: rgba(255, 255, 255, 0.1); /* 几乎全透明 */
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s;
        }

        .panel-header:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        body.dark-theme .panel-header {
            background-color: rgba(255, 255, 255, 0.02);
        }

        body.dark-theme .panel-header:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .panel-header h3 {
            margin: 0;
            color: #333;
        }
        
        .toggle-icon {
            font-size: 12px;
            color: #666;
        }
        
        .panel-content {
            max-height: 0;
            overflow: hidden;
            transition: none; /* 收起即时, 不播动画 (避免 max-height 反向动画的停顿+snap) */
        }

        .panel-content.expanded {
            max-height: 10000px; /* 增加最大高度以适应更多内容 */
            transition: max-height 0.3s ease-out; /* 仅展开播动画 */
            /* 服务卡片流: 每行放若干个, 窄屏自动降列 */
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
            padding: 12px;
            align-content: start;
        }
        
        .panel-content .service-item {
            padding: 12px;
        }

        .game-stats {
            font-size: 14px;
            color: #666;
        }

        .game-stats span {
            margin-left: 15px;
        }
        
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-running {
            background-color: rgba(212, 237, 218, 0.6);
            color: #155724;
        }
        
        .status-stopped {
            background-color: rgba(248, 215, 218, 0.6);
            color: #721c24;
        }
        
        .status-starting {
            background-color: rgba(255, 243, 205, 0.6);
            color: #856404;
        }
        
        .status-failed {
            background-color: rgba(248, 215, 218, 0.6);
            color: #721c24;
        }
        
        .status-undeployed {
            background-color: rgba(209, 236, 241, 0.6);
            color: #0c5460;
        }
        
        button {
            background-color: rgba(0, 123, 255, 0.7); /* 半透明蓝色 */
            color: white;
            border: none;
            padding: 8px 16px;
            margin-right: 5px;
            cursor: pointer;
            border-radius: 4px;
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
        }
        
        button:hover {
            background-color: rgba(0, 86, 179, 0.9);
            transform: translateY(-1px);
        }
        
        button:disabled {
            background-color: rgba(108, 117, 125, 0.5);
            cursor: not-allowed;
        }
        
        button.stop {
            background-color: rgba(220, 53, 69, 0.7);
        }
        
        button.stop:hover {
            background-color: rgba(189, 33, 48, 0.9);
        }
        
        button.restart {
            background-color: rgba(255, 193, 7, 0.7);
            color: #212529;
        }
        
        button.restart:hover {
            background-color: rgba(224, 168, 0, 0.9);
        }
        
        button.delete {
            background-color: rgba(217, 83, 79, 0.7);
            color: white;
            border: none;
            padding: 5px 10px;
            margin-left: 5px;
            cursor: pointer;
        }
        button.delete:hover {
            background-color: rgba(201, 48, 44, 0.9);
        }
        
        button.deploy {
            background-color: rgba(23, 162, 184, 0.7);
        }
        
        button.deploy:hover {
            background-color: rgba(19, 132, 150, 0.9);
        }

        button.update {
            background-color: rgba(52, 58, 64, 0.7); /* 半透明深灰色 */
        }

        button.update:hover {
            background-color: rgba(35, 39, 43, 0.9);
        }
        
        /* 服务卡片: 左信息 (title + type/file/port/modify/update), 右按钮纵向排列 */
        .service-item {
            display: flex;
            align-items: stretch;
            gap: 10px;
            min-width: 0;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }
        
        .service-info {
            flex: 1;
            min-width: 0;
        }

        .service-info h4 {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .svc-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .svc-head .status {
            flex: 0 0 auto;
        }

        .svc-meta p {
            display: flex;
            gap: 6px;
            margin: 2px 0;
            min-width: 0;
            font-size: 12px;
            line-height: 1.5;
        }

        .svc-k {
            flex: 0 0 48px;
            color: #999;
        }

        .svc-v {
            flex: 1;
            min-width: 0;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .service-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 0 0 auto;
            align-self: stretch;
        }

        .service-actions button {
            width: 100%;
            margin: 0;
            padding: 5px 10px;
            font-size: 12px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .sequence-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #007bff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        body.dark-theme .sequence-item {
            background-color: rgba(255, 255, 255, 0.02);
        }
        
        .sequence-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .sequence-name {
            font-weight: bold;
            font-size: 16px;
        }
        
        .sequence-services {
            font-size: 14px;
            color: #666;
            margin-left: 20px;
        }
        
        .create-sequence-btn {
            background-color: #28a745;
        }
        
        .create-sequence-btn:hover {
            background-color: #218838;
        }
        
        .execute-sequence-btn {
            background-color: #ffc107;
            color: #212529;
        }
        
        .execute-sequence-btn:hover {
            background-color: #e0a800;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        
        .loading-content {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .sequence-controls {
            margin-bottom: 15px;
        }

        .sequence-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .sequence-item {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #f9f9f9;
        }

        .sequence-item h4 {
            margin-top: 0;
            color: #333;
        }

        .loading, .no-sequences, .error {
            padding: 20px;
            text-align: center;
            color: #666;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .sequence-container {
            background: rgba(255, 255, 255, 0.08); /* 提升穿透感 */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .sequence-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .sequence-list {
            margin-bottom: 15px;
        }
        
        .sequence-item {
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .sequence-item:hover {
            background-color: rgba(240, 247, 255, 0.3);
        }
        
        .button {
            display: inline-block;
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #2196F3;
            color: white;
            border: none;

            text-decoration: none;
        }
        
        .button:hover {
            background-color: #0b7dda;
        }
        
        .create-sequence-btn {
            background-color: #28a745;
        }
        
        .create-sequence-btn:hover {
            background-color: #218838;
        }
        
        .loading, .no-sequences, .error {
            padding: 20px;
            text-align: center;
            color: #666;
        }
        .error {
            color: #f44336;
        }

        .button {
            display: inline-block;

            color: white;
            border: none;
            border-radius: 4px;

        }

        .button:hover {
            background-color: #0b7dda;
        }
        
        @media (max-width: 768px) {
            .panel-content.expanded {
                grid-template-columns: 1fr;
            }

            .service-item {
                flex-direction: column;
                align-items: stretch;
            }

            .service-actions {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .service-actions button {
                width: auto;
            }
        }

        /* 工具栏样式 */
        .toolbar {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        
        /* 夜间模式按钮样式 */
        .theme-toggle {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0;
        }
        
        .theme-toggle:hover {
            background-color: #0056b3;
        }
        
        .theme-toggle:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -30px;
            right: 0;
            background-color: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1001;
        }
        
        /* 夜间模式样式 */
        body.dark-theme {
            background-color: transparent; /* 保持透明以露出背景图 */
            color: #e0e0e0;
        }
        
        body.dark-theme .card,
        body.dark-theme .game-panel,
        body.dark-theme .loading-content,
        body.dark-theme .sequence-container {
            background: rgba(30, 30, 30, 0.4);
            color: #e0e0e0;
        }
        
        body.dark-theme h1,
        body.dark-theme h2,
        body.dark-theme h3,
        body.dark-theme h4 {
            color: #f0f0f0;
        }
        
        body.dark-theme .panel-header {
            background-color: rgba(30, 30, 30, 0.2);
            border-bottom-color: rgba(255, 255, 255, 0.05);
        }
        
        body.dark-theme .service-item {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        body.dark-theme .svc-k {
            color: #888;
        }

        body.dark-theme .svc-v {
            color: #e0e0e0;
        }
        
        body.dark-theme .game-stats {
            color: #b0b0b0;
        }
        
        body.dark-theme .toggle-icon {
            color: #b0b0b0;
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0 || !currentUpdateService) return;

            let exeFile = null;
            let pdbFile = null;

            // 遍历选中的文件，找到 .exe 和 .pdb
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileNameLower = file.name.toLowerCase();
                if (fileNameLower.endsWith('.exe')) {
                    exeFile = file;
                } else if (fileNameLower.endsWith('.pdb')) {
                    pdbFile = file;
                }
            }

            // 验证文件选择
            if (!exeFile) {
                alert('请选择一个 .exe 文件进行更新。');
                event.target.value = '';
                return;
            }
            if (!pdbFile) {
                alert('请选择一个 .pdb 文件进行更新。');
                event.target.value = '';
                return;
            }

            // 验证文件名是否匹配 (基本名称)
            const exeBaseName = exeFile.name.toLowerCase().replace(/\.exe$/, '');
            const pdbBaseName = pdbFile.name.toLowerCase().replace(/\.pdb$/, '');

            if (exeBaseName !== pdbBaseName) {
                alert(`选中的 .exe 文件 (${exeFile.name}) 和 .pdb 文件 (${pdbFile.name}) 的文件名不匹配！`);
                event.target.value = '';
                return;
            }

            // 验证 .exe 文件名是否与当前服务配置的 .exe 名称一致
            if (exeFile.name.toLowerCase() !== currentUpdateService.exe.toLowerCase()) {
                alert(`选中的 .exe 文件名 ${exeFile.name} 与配置的 ${currentUpdateService.exe} 不匹配！`);
                event.target.value = '';
                return;
            }

            if (!confirm(`确定要更新服务 ${currentUpdateService.name} (${currentUpdateService.type}) 的文件吗？\n将替换 ${exeFile.name} 和 ${pdbFile.name}。\n服务将被停止，替换文件后重新启动。`)) {
                event.target.value = '';
                return;
            }

            const formData = new FormData();
            formData.append('file_exe', exeFile);
            formData.append('file_pdb', pdbFile); // 添加 PDB 文件
            formData.append('name', currentUpdateService.name);
            formData.append('type', currentUpdateService.type);
            formData.append('exe', currentUpdateService.exe);

            // 显示加载遮罩
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingMessage = document.getElementById('loading-message');
            loadingOverlay.style.display = 'flex';
            loadingMessage.textContent = `正在更新服务 ${currentUpdateService.name}...`;

            fetch('/api/services/update', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                loadingOverlay.style.display = 'none';
                if (data.success) {
                    alert('服务更新成功！');
                    updateServiceStatus();
                } else {
                    alert('服务更新失败: ' + data.message);
                }
            })
            .catch(error => {
                loadingOverlay.style.display = 'none';
                console.error('Error:', error);
                alert('更新服务时发生错误');
            })
            .finally(() => {
                event.target.value = ''; // 清空选择
                currentUpdateService = null;
            });
        }

        // SVN 更新相关逻辑
        const svnUpdateButton = document.getElementById('svn-update-btn');
        const svnStatusText = document.getElementById('svn-status-text');

        async function checkSvnStatus() {
            try {
                const response = await fetch('/api/svn/status');
                const data = await response.json();

                if (data.success) {
                    if (data.is_latest) {
                        svnStatusText.textContent = '已经是最新版本';
                        svnUpdateButton.disabled = true;
                        svnUpdateButton.style.backgroundColor = '#6c757d'; // 灰色
                        svnUpdateButton.style.cursor = 'not-allowed';
                    } else {
                        svnStatusText.textContent = '更新到最新版本';
                        svnUpdateButton.disabled = false;
                        svnUpdateButton.style.backgroundColor = '#28a745'; // 绿色
                        svnUpdateButton.style.cursor = 'pointer';
                    }
                } else {
                    svnStatusText.textContent = `SVN状态检查失败: ${data.message}`;
                    svnUpdateButton.disabled = true;
                    svnUpdateButton.style.backgroundColor = '#dc3545'; // 红色
                    svnUpdateButton.style.cursor = 'not-allowed';
                }
            } catch (error) {
                console.error('获取SVN状态失败:', error);
                svnStatusText.textContent = 'SVN状态检查失败';
                svnUpdateButton.disabled = true;
                svnUpdateButton.style.backgroundColor = '#dc3545'; // 红色
                svnUpdateButton.style.cursor = 'not-allowed';
            }
        }

        async function updateSvn() {
            if (svnUpdateButton.disabled) return;

            if (!confirm('确定要执行SVN更新吗？')) {
                return;
            }

            svnStatusText.textContent = '正在更新SVN...';
            svnUpdateButton.disabled = true;
            svnUpdateButton.style.backgroundColor = '#ffc107'; // 黄色
            svnUpdateButton.style.cursor = 'not-allowed';

            try {
                // 1. 触发 host 异步编排 (停 servicesvr → svn up → 启)
                const response = await fetch('/api/svn/update', {
                    method: 'POST'
                });
                const data = await response.json();
                if (!data.success) {
                    alert('触发SVN更新失败: ' + data.message);
                    return;
                }
                svnStatusText.textContent = 'SVN 更新中 (host 编排: 停服务→svn up→启)...';

                // 2. 轮询 update_log (每 2s, 最多 45 次 = 90s), 等 running=false
                let log = null;
                for (let i = 0; i < 45; i++) {
                    await new Promise(r => setTimeout(r, 2000));
                    try {
                        const lr = await fetch('/api/svn/update_log');
                        log = await lr.json();
                    } catch (e) {
                        // legacy/rust 可能正被停启, 连接失败则重试
                        continue;
                    }
                    if (log && log.running === false && log.last) break;
                    svnStatusText.textContent = `SVN 更新中... (${(i + 1) * 2}s)`;
                }

                // 3. 显示结果 (svn stdout/stderr + 服务状态)
                if (log && log.last) {
                    const svn = log.last.svn;
                    const started = (log.last.started || []).map(s => `${s.name}=${s.status}`).join(', ');
                    if (svn) {
                        // svn 步骤已执行 (正常流程)
                        const summary = `SVN 更新${svn.ok ? '成功' : '失败'} (returncode=${svn.returncode})\n` +
                            `工作副本根: ${svn.working_copy_root || '-'}\n` +
                            `svn stdout:\n${svn.stdout || '(空)'}\n` +
                            (svn.stderr ? `svn stderr:\n${svn.stderr}\n` : '') +
                            `服务: ${started}`;
                        console.error('[SVN Update]', summary);
                        alert(summary);
                    } else {
                        // svn 步骤未执行 (dirty check 失败 / 停服务失败 / svn info 失败等)
                        const stage = log.last.stage || 'unknown';
                        const errMsg = log.last.error || log.last.dirty_check || '无详细信息';
                        const summary = `SVN 更新失败 (阶段: ${stage})\n` +
                            `工作副本根: ${log.last.working_copy_root || '-'}\n` +
                            `错误: ${errMsg}`;
                        console.error('[SVN Update]', summary);
                        alert(summary);
                    }
                } else {
                    const msg = 'SVN 更新超时, 查 /api/svn/update_log 或 svn_update.log';
                    console.error('[SVN Update]', msg);
                    alert(msg);
                }
            } catch (error) {
                console.error('执行SVN更新失败:', error);
                alert('执行SVN更新失败: ' + error.message);
            } finally {
                checkSvnStatus(); // 更新完成后重新检查状态
            }
        }

                            domain = urlObj.hostname;
                        } catch(e) {}

                        // 备选方案列表

                            defaultIcon
                        ];

                        linkElement.href = link.url;

                        const iconImg = linkElement.querySelector('.friendlink-icon');
                        const nameSpan = linkElement.querySelector('.friendlink-name');

                        // 设置 onerror 链式处理
                        iconImg.onerror = function() {
                            if (currentFallbackIdx < fallbacks.length) {
                                this.src = fallbacks[currentFallbackIdx++];
                            } else {
                                this.src = defaultIcon;
                                this.onerror = null;
                            }

                        // 异步获取元数据（标题和图标）

                                }
                            } catch (error) {
                                if (!displayName) nameSpan.textContent = link.url;
                                iconImg.src = fallbacks[currentFallbackIdx++];
                            }
                        })();

                        listItem.appendChild(linkElement);
                        friendlinksList.appendChild(listItem);

        // Unix 秒 → 本地 YYYY-MM-DD HH:MM:SS (空值显示 —)
        function fmtTs(ts) {
            if (ts === null || ts === undefined || ts === '') return '—';
            const d = new Date(Number(ts) * 1000);
            if (isNaN(d.getTime())) return '—';
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        function statusClassFor(status) {
            if (status === '运行中') return 'status-running';
            if (status === '启动中') return 'status-starting';
            if (status === '启动失败') return 'status-failed';
            if (status === '未部署') return 'status-undeployed';
            return 'status-stopped';
        }

                return `
                    <button class="config-edit-btn" onclick="openConfigEditor('${serviceId}', '${info.name}', ${info.self ? 'true' : 'false'})">配置编辑</button>
                    <button class="restart" onclick="restartService('${info.name}', '${info.type}', '${info.exe}')">重启自身</button>
                `;
            }
            if (!isDeployed) {
                return `<button class="deploy" onclick="deployService('${info.name}', '${info.type}', '${info.exe}')">部署服务</button>`;
            }
            const starting = info.status === '启动中';
            return `
                <button class="config-edit-btn" onclick="openConfigEditor('${serviceId}', '${info.name}', ${info.self ? 'true' : 'false'})">配置编辑</button>
                <button class="update" onclick="triggerUpdateFile('${info.name}', '${info.type}', '${info.exe}')">更新</button>
                <button data-role="start" onclick="startService('${info.name}', '${info.type}', '${info.exe}')" ${isRunning ? 'disabled' : ''}>启动</button>
                <button class="stop" data-role="stop" onclick="stopService('${info.name}', '${info.type}', '${info.exe}')" ${!isRunning ? 'disabled' : ''}>停止</button>
                <button class="restart" data-role="restart" onclick="restartService('${info.name}', '${info.type}', '${info.exe}')" ${starting ? 'disabled' : ''}>重启</button>
                <button class="delete" onclick="deleteService('${info.name}', '${info.type}')">删除部署</button>
            `;
        }

        // 就地 patch 状态 (每 3s 调, 不 wipe DOM, 保留 transition 连续性 = 60fps 丝滑)
        function patchServiceStatus(data) {
            const serviceGrid = document.getElementById('service-grid');
            serviceGrid.querySelectorAll('.service-item[data-sid]').forEach(item => {
                const info = data[item.dataset.sid];
                if (!info) return;
                const isRunning = info.status === '运行中' || info.status === '启动中';
                const isDeployed = info.status !== '未部署';
                const badge = item.querySelector('.status');
                if (badge) {
                    badge.className = 'status ' + statusClassFor(info.status);
                    badge.textContent = info.status;
                }
                const em = item.querySelector('.svc-exe-mtime');
                if (em) em.textContent = fmtTs(info.exe_mtime);
                const up = item.querySelector('.svc-updated');
                if (up) up.textContent = fmtTs(info.updated_at);
                const wasDeployed = item.dataset.deployed === '1';
                if (wasDeployed !== isDeployed) {
                    item.dataset.deployed = isDeployed ? '1' : '0';
                    const actions = item.querySelector('.service-actions');
                    if (actions) actions.innerHTML = buildActionButtons(item.dataset.sid, info, isDeployed, isRunning);
                } else if (wasDeployed) {
                    const s = item.querySelector('[data-role="start"]');
                    const p = item.querySelector('[data-role="stop"]');
                    const r = item.querySelector('[data-role="restart"]');
                    if (s) s.disabled = isRunning;
                    if (p) p.disabled = !isRunning;
                    if (r) r.disabled = info.status === '启动中';
                }
            });
            // 更新各游戏面板运行中计数
            serviceGrid.querySelectorAll('.game-panel').forEach(panel => {
                const items = panel.querySelectorAll('.service-item');
                let running = 0;
                items.forEach(it => {
                    const b = it.querySelector('.status');
                    if (b && b.textContent === '运行中') running++;
                });
                const stats = panel.querySelector('.game-stats');
                if (stats) stats.innerHTML = `<span>总服务数: ${items.length}</span><span>运行中: ${running}</span>`;
            });
        }

        // 分发: 服务集合变化才全量重建, 否则就地 patch (避免每 3s wipe 打断 transition)
        function updateServiceStatus() {
            fetch('/api/services/status')
                .then(response => response.json())
                .then(data => {
                    const fingerprint = Object.keys(data).sort().join('|');
                    if (fingerprint !== lastServiceFingerprint) {
                        lastServiceFingerprint = fingerprint;
                        buildServiceGrid(data);
                    } else {
                        patchServiceStatus(data);
                    }
                });
        }
        // 启动服务
        function startService(name, type, exe) {
            fetch('/api/services/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, type: type, exe: exe })
            })
            .then(response => response.json())
            .then(data => {
                // 移除alert提示
                updateServiceStatus();
            });
        }
        
        // 启动所有服务
        function startAllServices() {
            if (!confirm('确定要启动所有服务吗？')) return;
            fetch('/api/services/start-all', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    updateServiceStatus();
                });
        }

        // 更新所有服务状态
        function updateAllServices() {
            updateServiceStatus();
            checkSvnStatus();
            alert('状态已更新');
        }

        // 停止服务
        function stopService(name, type, exe) {
            // 移除confirm确认框
            fetch('/api/services/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, type: type, exe: exe })
            })
            .then(response => response.json())
            .then(data => {
                // 移除alert提示
                updateServiceStatus();
            });
        }
        
        // 重启服务中的stop调用也需要修改
        function restartService(name, type, exe) {
            // 先停止服务，然后再启动服务
            fetch('/api/services/stop', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, type: type, exe: exe })
            })
            .then(() => {
                // 等待1秒后启动服务
                setTimeout(() => {
                    startService(name, type, exe);
                }, 1000);
            });
        }

        function deleteService(name, type) {
            if (confirm('确定要删除这个服务的部署吗？配置信息将被保留。')) {
                fetch('/api/services/delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({name: name, type: type})
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // 刷新服务列表
                        updateServiceStatus();
                    } else {
                        alert('删除失败: ' + data.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('删除服务时发生错误');
                });
            }
        }
        function deployService(name, type, exe) {
            fetch('/api/services/deploy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, type: type, exe: exe })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 更新服务列表
                    updateServiceStatus();
                } else {
                    alert('部署失败: ' + data.message);
                }
            });
        }
        
        // 初始加载和定期更新服务状态
        updateServiceStatus();
        setInterval(updateServiceStatus, 3000); // 每3秒更新一次
    </script>

    <script>
        function updateSequenceList() {
            const sequenceList = document.getElementById('sequence-list');
            const loadingElement = document.getElementById('sequence-loading');
            
            // 显示加载状态
            loadingElement.style.display = 'block';
            
            // 获取所有序列
            fetch('/api/script/get-all')
                .then(response => response.json())
                .then(data => {
                    sequenceList.innerHTML = '';
                    
                    // 隐藏加载状态
                    loadingElement.style.display = 'none';
                    
                    // 检查响应是否成功
                    if (!data || !data.success) {
                        sequenceList.innerHTML = '<div class="error">' + (data ? data.message : '加载序列列表失败') + '</div>';
                        return;
                    }
                    
                    // 获取scripts数组
                    const scripts = data.scripts || [];
                    
                    // 检查是否有序列
                    if (scripts.length === 0) {
                        sequenceList.innerHTML = '<div class="no-sequences">暂无保存的序列</div>';
                        return;
                    }
                    
                    // 生成序列列表项
                    scripts.forEach(scriptItem => {
                        const sequenceItem = document.createElement('div');
                        sequenceItem.className = 'sequence-item';
                        sequenceItem.textContent = scriptItem.name;
                        
                        // 添加点击事件，执行序列
                        sequenceItem.addEventListener('click', function() {
                            executeNamedSequence(scriptItem.name);
                        });
                        
                        sequenceList.appendChild(sequenceItem);
                    });
                })
                .catch(error => {
                    console.error('加载序列列表失败:', error);
                    loadingElement.style.display = 'none';
                    sequenceList.innerHTML = '<div class="error">加载序列列表时发生错误</div>';
                });
        }
        // 执行指定名称的序列
        function executeNamedSequence(sequenceName) {
            const loadingOverlay = document.getElementById('loading-overlay');
            const loadingMessage = document.getElementById('loading-message');
            
            // 显示加载遮罩
            loadingOverlay.style.display = 'flex';
            loadingMessage.textContent = `正在执行序列 "${sequenceName}"，请稍候...`;
            
            // 调用API执行序列
            fetch(`/api/script/execute/${sequenceName}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                // 隐藏加载遮罩
                loadingOverlay.style.display = 'none';
                
                // 显示操作结果
                if (data.success) {
                    alert(`序列 "${sequenceName}" 执行成功！`);
                } else {
                    alert(`序列 "${sequenceName}" 执行失败: ${data.message || '未知错误'}`);
                }
            })
            .catch(error => {
                console.error('执行序列失败:', error);
                loadingOverlay.style.display = 'none';
                alert(`执行序列 "${sequenceName}" 时发生错误`);
            });
        }
        // 初始加载序列列表
        updateSequenceList();
        
        // 定期更新序列列表（每30秒）
        // setInterval(updateSequenceList, 30000);

        // ===== 配置编辑悬浮窗 (逻辑对齐 onlineConfigModify.html) =====
        let ceEditingFilePath = null;
        let ceEditingServiceId = null;
        // 工具自身 (service-server_self): 只给「重启自身 + 配置编辑」, 不开放
        // 上传/删除/回收站 —— 否则可删掉自己的源码与配置 (后端也拒: 该 id 不在服务表里)。
        let ceIsSelfService = false;

        function ceOnBackdropClick(event) {
            if (event.target === event.currentTarget) ceHideEditor();
        }

        function ceHideEditor() {
            document.getElementById('config-editor-overlay').style.display = 'none';
            ceEditingFilePath = null;
        }

        // 打开配置编辑悬浮窗: 加载左侧文件列表
        async function openConfigEditor(serviceId, serviceName, isSelf) {
            ceEditingServiceId = serviceId;
            ceEditingFilePath = null;
            ceIsSelfService = !!isSelf;
            document.getElementById('ce-title').textContent = '配置编辑: ' + (serviceName || serviceId);
            document.getElementById('ce-service-name').textContent = (serviceName || '配置文件');
            document.getElementById('ce-file-content').value = '';
            document.getElementById('ce-branch-files-container').innerHTML = '';
            document.getElementById('ce-branch-count').textContent = '0';
            document.getElementById('ce-upload-btn').style.display = ceIsSelfService ? 'none' : '';
            document.getElementById('ce-recycle-btn').style.display = ceIsSelfService ? 'none' : '';
            document.getElementById('config-editor-overlay').style.display = 'flex';
            ceValidateNow(); // 清掉上次残留的校验态 (此刻未选文件 → 回到中性提示)
            await ceLoadFileList(serviceId);
            ceLoadRecycle();
        }

        // 加载左侧配置文件列表
        async function ceLoadFileList(serviceId) {
            const listEl = document.getElementById('ce-file-list');
            listEl.innerHTML = '<div class="ce-file-empty">加载中...</div>';
            try {
                const resp = await fetch(`/api/config/files?serviceId=${encodeURIComponent(serviceId)}&ext=ini,json,lua`);
                const result = await resp.json();
                if (!result.success) {
                    listEl.innerHTML = `<div class="ce-file-empty">加载失败: ${result.message || ''}</div>`;
                    return;
                }
                const files = result.files || [];
                listEl.innerHTML = '';
                if (files.length === 0) {
                    listEl.innerHTML = '<div class="ce-file-empty">无配置文件</div>';
                    return;
                }
                files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'ce-file-item';
                    // 行 = 文件名 (点击打开) + 删除按钮 (file.path 即相对服务根的 relPath)
                    const row = document.createElement('div');
                    row.className = 'ce-file-row';
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'ce-file-name';
                    nameSpan.textContent = file.filename;
                    row.appendChild(nameSpan);
                    if (!ceIsSelfService) {
                        const del = document.createElement('button');
                        del.className = 'ce-file-del';
                        del.textContent = '✕';
                        del.title = '删除 ' + file.filename + ' (先进回收站, 可还原)';
                        del.onclick = (ev) => { ev.stopPropagation(); ceDeleteFile(file.path, file.filename); };
                        row.appendChild(del);
                    }
                    item.appendChild(row);
                    item.onclick = () => ceOpenFile(file.full_path, file.filename);
                    listEl.appendChild(item);
                });
            } catch (e) {
                listEl.innerHTML = `<div class="ce-file-empty">加载失败: ${e.message}</div>`;
            }
        }

        // 打开右侧文件内容
        async function ceOpenFile(filePath, fileName, newEncoding) {
            if (!filePath) return;
            const encodingToUse = newEncoding || document.getElementById('ce-encoding').value;
            try {
                const resp = await fetch(`/api/config/file/content?filePath=${encodeURIComponent(filePath)}&encoding=${encodeURIComponent(encodingToUse)}`);
                if (!resp.ok) {
                    const errTxt = await resp.text();
                    alert(`打开失败 (HTTP ${resp.status}): ${errTxt}`);
                    return;
                }
                const content = await resp.text();
                const ct = resp.headers.get('Content-Type');
                const actualEnc = ct ? ct.split('charset=')[1] : encodingToUse;
                ceEditingFilePath = filePath;
                document.getElementById('ce-file-content').value = content;
                document.getElementById('ce-encoding').value = actualEnc;
                ceValidateNow();          // 打开即校验一次, 不用等用户敲键
                ceLoadBranchFiles(filePath);
            } catch (e) {
                alert('打开文件失败: ' + e.message);
            }
        }

        // 保存
        async function ceSaveFile() {
            if (!ceEditingFilePath) { alert('未选择文件'); return; }
            const content = document.getElementById('ce-file-content').value;
            const encoding = document.getElementById('ce-encoding').value;
            try {
                const resp = await fetch('/api/config/file/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filePath: ceEditingFilePath, content, encoding })
                });
                const result = await resp.json();
                if (result.success) {
                    alert('文件保存成功');
                } else {
                    alert('保存失败: ' + result.message);
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        // 加载备份列表
        async function ceLoadBranchFiles(filePath) {
            try {
                const resp = await fetch(`/api/config/file/branches?filePath=${encodeURIComponent(filePath)}`);
                const result = await resp.json();
                const container = document.getElementById('ce-branch-files-container');
                container.innerHTML = '';
                const countSpan = document.getElementById('ce-branch-count');
                if (!result.success) {
                    if (countSpan) countSpan.textContent = '0';
                    return;
                }
                if (countSpan) countSpan.textContent = result.branch_files.length;
                const baseName = result.current_file.replace(/\.[^/.]+$/, '');
                result.branch_files.forEach(branchFile => {
                    const branchName = branchFile.substring(baseName.length + 1, branchFile.lastIndexOf('.'));
                    const escPath = filePath.replace(/\\/g, '\\\\');
                    const escBranch = branchName.replace(/\\/g, '\\\\');
                    const escFile = branchFile.replace(/\\/g, '\\\\');
                    const row = document.createElement('div');
                    row.className = 'ce-branch-row';
                    row.innerHTML = `
                        <span>${branchFile}</span>
                        <span>
                            <button onclick="ceSwitchToBranch('${escPath}', '${escBranch}')">切换</button>
                            <button class="del" onclick="ceDeleteBranch('${escPath}', '${escBranch}', '${escFile}')">删除</button>
                        </span>
                    `;
                    container.appendChild(row);
                });
                if (result.branch_files.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'ce-branch-empty';
                    empty.textContent = '无可用备份';
                    container.appendChild(empty);
                }
            } catch (e) {
                console.error('加载备份失败:', e);
            }
        }

        // 创建备份 (prompt 输入名)
        async function cePromptCreateBranch() {
            if (!ceEditingFilePath) { alert('请先选择文件'); return; }
            const name = prompt('输入新备份名称 (仅字母数字、下划线、连字符):');
            if (name === null) return;
            const trimmed = name.trim();
            if (!trimmed) { alert('备份名称不能为空'); return; }
            const content = document.getElementById('ce-file-content').value;
            try {
                const resp = await fetch('/api/config/file/create_branch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filePath: ceEditingFilePath, branchName: trimmed, content })
                });
                const result = await resp.json();
                if (result.success) {
                    alert(`备份 "${result.branch_file}" 创建成功`);
                    ceLoadBranchFiles(ceEditingFilePath);
                } else {
                    alert('创建备份失败: ' + result.message);
                }
            } catch (e) {
                alert('创建备份失败: ' + e.message);
            }
        }

        // 切换备份
        async function ceSwitchToBranch(filePath, branchName) {
            if (!branchName || !confirm(`确定切换到备份 "${branchName}" 吗？`)) return;
            try {
                const resp = await fetch('/api/config/file/switch_branch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filePath, branchName })
                });
                const result = await resp.json();
                if (result.success) {
                    alert(result.message);
                    const curEnc = document.getElementById('ce-encoding').value;
                    ceOpenFile(filePath, result.current_file, curEnc);
                } else {
                    alert('切换失败: ' + result.message);
                }
            } catch (e) {
                alert('切换失败: ' + e.message);
            }
        }

        // 删除备份
        async function ceDeleteBranch(filePath, branchName, branchFileName) {
            if (!confirm(`确定删除备份 "${branchFileName}" 吗？不可撤销。`)) return;
            const encPath = encodeURIComponent(filePath);
            const encBranch = encodeURIComponent(branchName);
            try {
                const resp = await fetch(`/api/config/file/remove_branch?filePath=${encPath}&branchName=${encBranch}`, { method: 'DELETE' });
                const result = await resp.json();
                if (result.success) {
                    alert(result.message);
                    ceLoadBranchFiles(filePath);
                } else {
                    alert('删除失败: ' + result.message);
                }
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // ===== 文件管理: 上传 / 删除 / 回收站还原 (规格 serviceserver_spec/09) =====

        function cePromptUpload() {
            if (ceIsSelfService) { alert('工具自身不支持上传 (只给配置编辑)'); return; }
            document.getElementById('ce-upload-input').click();
        }

        function ceOnUploadPicked(event) {
            const input = event.target;
            const file = input.files && input.files[0];
            input.value = ''; // 清空, 便于连续上传同名文件再次触发 change
            if (file) ceUploadFile(file);
        }

        // 上传到服务根目录 (relPath = 文件名)。同名覆盖会先滚一份备份进回收站。
        async function ceUploadFile(file) {
            if (!ceEditingServiceId) { alert('未选择服务'); return; }
            const relPath = file.name;
            const exists = [...document.querySelectorAll('#ce-file-list .ce-file-name')]
                .some(el => el.textContent === relPath);
            if (exists && !confirm(`"${relPath}" 已存在, 覆盖它吗？\n\n原文件会先进回收站, 可还原。`)) return;

            const fd = new FormData();
            fd.append('file', file, file.name);
            try {
                const resp = await fetch(
                    `/api/files/upload?serviceId=${encodeURIComponent(ceEditingServiceId)}&relPath=${encodeURIComponent(relPath)}`,
                    { method: 'POST', body: fd });
                const result = await resp.json().catch(() => ({}));
                if (resp.ok && result.success) {
                    // 先刷新再判定"可见性": 侧栏按 ini/json/lua 过滤, 其它扩展名上传成功后
                    // 列表里根本不出现 —— 只弹一句"成功"会让人以为上传没生效。
                    await ceLoadFileList(ceEditingServiceId);
                    ceLoadRecycle();
                    const visible = [...document.querySelectorAll('#ce-file-list .ce-file-name')]
                        .some(el => el.textContent === relPath);
                    let msg = result.message || '上传成功';
                    if (result.path) msg += `\n\n落位: ${result.path}`;
                    if (!visible) {
                        msg += `\n\n注意: ${relPath} 的扩展名不在左侧列表的 ini/json/lua 过滤范围内,`
                             + ` 所以列表里看不到它 —— 文件确实已经写进服务目录了。`;
                    }
                    alert(msg);
                } else {
                    alert('上传失败: ' + (result.message || ('HTTP ' + resp.status)));
                }
            } catch (e) {
                alert('上传失败: ' + e.message);
            }
        }

        // 删除文件: 后端先备份进回收站再删, 故可还原。
        async function ceDeleteFile(relPath, fileName) {
            if (!ceEditingServiceId) return;
            if (!confirm(`确定删除 "${fileName}" 吗？\n\n会先进回收站, 可在「回收站」还原。`)) return;
            try {
                const resp = await fetch('/api/files/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceId: ceEditingServiceId, relPath })
                });
                const result = await resp.json().catch(() => ({}));
                if (resp.ok && result.success) {
                    // 删的正是当前打开的文件 → 清空编辑器, 免得对着幽灵文件保存
                    const openedName = ceEditingFilePath ? ceEditingFilePath.replace(/.*[/\\]/, '') : null;
                    if (openedName && openedName === fileName) {
                        ceEditingFilePath = null;
                        document.getElementById('ce-file-content').value = '';
                        document.getElementById('ce-branch-files-container').innerHTML = '';
                        document.getElementById('ce-branch-count').textContent = '0';
                        ceValidateNow(); // 文件已删 -> 校验条回到中性
                    }
                    await ceLoadFileList(ceEditingServiceId);
                    ceLoadRecycle();
                } else {
                    alert('删除失败: ' + (result.message || ('HTTP ' + resp.status)));
                }
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        // 备份名后缀 = unix 纳秒 (20 位定长, backup.rs 命名) → 本地时间串
        function ceParseBackupTime(name) {
            const m = /\.(\d{20})$/.exec(name || '');
            if (!m) return '—';
            const d = new Date(Number(m[1]) / 1e6);
            if (isNaN(d.getTime())) return '—';
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} `
                + `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        function ceFmtSize(n) {
            if (typeof n !== 'number' || isNaN(n)) return '—';
            if (n < 1024) return n + ' B';
            if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
            return (n / 1024 / 1024).toFixed(2) + ' MB';
        }

        // 头部「回收站」按钮: 展开 / 收起折叠区并刷新。
        // (给回收站一个显式入口 —— 之前只有弹窗底部一行 collapsed summary, 太容易看不见)
        function ceToggleRecycle() {
            const d = document.getElementById('ce-recycle-details');
            if (!d) return;
            d.open = !d.open;
            if (d.open) {
                ceLoadRecycle();
                d.scrollIntoView({ block: 'nearest' });
            }
        }

        // 回收站: 当前服务的全部历史备份 (跨文件, 含已删除文件)。
        // 设计为只读: 行内只有「还原」, 不提供删除 —— 回收站内容不可删。
        async function ceLoadRecycle() {
            // 头部按钮与折叠区共用一份计数
            await ceLoadRecycleInner();
            const a = document.getElementById('ce-recycle-count');
            const b = document.getElementById('ce-recycle-btn-count');
            if (a && b) b.textContent = a.textContent;
        }

        async function ceLoadRecycleInner() {
            const listEl = document.getElementById('ce-recycle-list');
            const countEl = document.getElementById('ce-recycle-count');
            if (!listEl || !countEl) return;
            if (!ceEditingServiceId || ceIsSelfService) {
                countEl.textContent = '0';
                listEl.innerHTML = '<div class="ce-branch-empty">工具自身不支持回收站</div>';
                return;
            }
            listEl.innerHTML = '<div class="ce-branch-empty">加载中...</div>';
            try {
                const resp = await fetch(`/api/files/recycle?serviceId=${encodeURIComponent(ceEditingServiceId)}`);
                const result = await resp.json().catch(() => ({}));
                if (!resp.ok || !result.success) {
                    countEl.textContent = '0';
                    listEl.innerHTML = `<div class="ce-branch-empty">加载失败: ${result.message || ('HTTP ' + resp.status)}</div>`;
                    return;
                }
                const entries = result.entries || [];
                countEl.textContent = entries.length;
                listEl.innerHTML = '';
                if (entries.length === 0) {
                    listEl.innerHTML = '<div class="ce-branch-empty">回收站为空</div>';
                    return;
                }
                entries.forEach(e => {
                    const row = document.createElement('div');
                    row.className = 'ce-recycle-row';
                    const main = document.createElement('span');
                    main.className = 'ce-recycle-main';
                    const nameEl = document.createElement('span');
                    nameEl.className = 'ce-recycle-name';
                    nameEl.textContent = e.original;   // textContent: 文件名不参与 HTML 解析
                    nameEl.title = e.rel_path;
                    const metaEl = document.createElement('span');
                    metaEl.className = 'ce-recycle-meta';
                    metaEl.textContent = `${ceParseBackupTime(e.name)} · ${ceFmtSize(e.size)}`;
                    main.appendChild(nameEl);
                    main.appendChild(metaEl);
                    const btn = document.createElement('button');
                    btn.textContent = '还原';
                    btn.title = `还原 "${e.original}" 到服务目录 (当前同名文件会先备份)`;
                    btn.onclick = () => ceRestoreBackup(e.rel_path, e.original, e.name);
                    row.appendChild(main);
                    row.appendChild(btn);
                    listEl.appendChild(row);
                });
            } catch (e) {
                countEl.textContent = '0';
                listEl.innerHTML = `<div class="ce-branch-empty">加载失败: ${e.message}</div>`;
            }
        }

        // 从回收站还原指定备份 (不传 backupName 则由后端取最新一份)。
        async function ceRestoreBackup(relPath, original, backupName) {
            if (!ceEditingServiceId) return;
            if (!confirm(`确定把 "${original}" 还原为这个备份吗？\n\n备份: ${backupName}\n当前同名文件会先备份进回收站, 还原本身也可反悔。`)) return;
            try {
                const resp = await fetch('/api/files/restore', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serviceId: ceEditingServiceId, relPath, backupName })
                });
                const result = await resp.json().catch(() => ({}));
                if (resp.ok && result.success) {
                    alert(result.message || '还原成功');
                    await ceLoadFileList(ceEditingServiceId);
                    ceLoadRecycle();
                } else {
                    alert('还原失败: ' + (result.message || ('HTTP ' + resp.status)));
                }
            } catch (e) {
                alert('还原失败: ' + e.message);
            }
        }

        // ===== 格式校验 (只报真实语法错误; 浏览器的拼写检查已由 textarea 的 spellcheck=false 关掉) =====
        // json → JSON.parse (严格, 就是浏览器同一套解析器; 不会误报)
        // ini  → 逐行规则: 空行 / ;与# 注释 / [节] / key=value 或 key: value
        // lua  → 不做: 没有 Lua 解析器, 靠猜的校验必然误报, 比不校验更糟
        // 规则已对实盘语料验证: xzmo/xzms/zgdb 全部 ini 无一例外命中; zgdb 31 个 json 全部严格可解析。
        function ceKindOf(name) {
            const m = /\.([a-z0-9]+)$/i.exec(name || '');
            const ext = m ? m[1].toLowerCase() : '';
            if (ext === 'json') return 'json';
            if (ext === 'ini') return 'ini';
            return null;
        }

        // V8 的 JSON 报错有两种形态 (Chrome 145 实测):
        //  a) 带精确位置: "... in JSON at position 12 (line 3 column 1)" → 直接用, 能给到行列
        //  b) 只有上下文片段 (Unexpected token 一家): "Unexpected token '}', ...\"…\" is not valid JSON"
        //     —— 没有位置, 但那段片段是 V8 从原文里截出来的 → 可在原文反查定位到「出错附近」。
        //     不谎报行列: 精确行列只来自 a 类。
        function ceCheckJson(text) {
            try {
                JSON.parse(text);
                return { ok: true };
            } catch (e) {
                const msg = String((e && e.message) || e);
                let line = null, col = null, nearStart = null, nearEnd = null, m;
                if ((m = /\(line (\d+) column (\d+)\)/.exec(msg))) {
                    line = +m[1]; col = +m[2];
                } else if ((m = /position (\d+)/.exec(msg))) {
                    const pos = +m[1];
                    const before = text.slice(0, pos);
                    line = before.split('\n').length;
                    col = pos - before.lastIndexOf('\n');
                } else if ((m = /Unexpected token '[^']*', (?:\.\.\.)?"([\s\S]*)" is not valid JSON$/.exec(msg))) {
                    const at = text.indexOf(m[1]);
                    if (at >= 0) { nearStart = at; nearEnd = at + m[1].length; }
                }
                return { ok: false, line, col, msg, nearStart, nearEnd };
            }
        }

        function ceCheckIni(text) {
            const lines = text.split(/\r?\n/);
            for (let i = 0; i < lines.length; i++) {
                const t = lines[i].trim();
                if (t === '' || t.startsWith(';') || t.startsWith('#')) continue;
                if (t.startsWith('[')) {
                    if (!/^\[[^\]\r\n]+\]\s*$/.test(t)) {
                        return { ok: false, line: i + 1, col: 1, msg: '节名不合法 (应为 [名称]): ' + t.slice(0, 40) };
                    }
                    continue;
                }
                // key=value 或 key: value; 值里再出现 = / : 都允许, 只要求键非空
                if (!/^[^=]+=/.test(t) && !/^[^:]+:/.test(t)) {
                    return { ok: false, line: i + 1, col: 1, msg: '既不是 [节], 也不是 key=value: ' + t.slice(0, 40) };
                }
            }
            return { ok: true };
        }

        let ceValidateTimer = null;
        function ceScheduleValidate() {
            // 输入防抖: 别每敲一个键就把整篇重解析一遍
            if (ceValidateTimer) clearTimeout(ceValidateTimer);
            ceValidateTimer = setTimeout(ceValidateNow, 400);
        }

        function ceValidateNow() {
            const bar = document.getElementById('ce-validate');
            const txt = document.getElementById('ce-validate-text');
            const ta = document.getElementById('ce-file-content');
            if (!bar || !txt || !ta) return;
            const ed = document.getElementById('ce-editor');
            const paint = (cls, text, errLine) => {
                bar.className = 'ce-validate' + (cls ? ' ' + cls : '');
                txt.textContent = text;
                if (ed) ed.classList.toggle('invalid', cls === 'err'); // 描红挂在编辑区容器上
                bar.dataset.line = '';
                bar.dataset.near = '';
                bar.title = '';
                ceRenderGutter(errLine || null);
            };
            if (!ceEditingFilePath) { paint('', '格式校验: 打开文件后自动检测'); return; }
            const name = ceEditingFilePath.replace(/.*[/\\]/, '');
            const kind = ceKindOf(name);
            if (!kind) {
                const ext = (name.split('.').pop() || '').toLowerCase();
                paint('', `格式校验: ${ext ? '.' + ext : '无扩展名'} 不校验 (只校验 ini / json)`);
                return;
            }
            const r = (kind === 'json') ? ceCheckJson(ta.value) : ceCheckIni(ta.value);
            if (r.ok) { paint('ok', `✓ ${kind.toUpperCase()} 格式正确`); return; }
            let where = '', hint = '   (点这里跳到出错处)';
            if (r.line) {
                where = `第 ${r.line} 行${r.col ? ' 第 ' + r.col + ' 列' : ''}: `;
            } else if (r.nearStart != null) {
                where = '出错附近: ';
            } else {
                hint = ''; // 既没位置也没片段 → 只报错, 不假装能跳
            }
            const shown = r.msg.length > 140 ? r.msg.slice(0, 140) + '…' : r.msg;
            paint('err', `✗ ${kind.toUpperCase()} 格式错误 — ${where}${shown}${hint}`, r.line);
            bar.dataset.line = r.line || '';
            bar.dataset.near = (r.nearStart != null) ? (r.nearStart + ',' + r.nearEnd) : '';
            bar.title = r.msg; // 完整报错挂 title, 免得长消息把条撑爆
        }

        // 点校验条 → 选中出错行并滚到可视区中间。
        // textarea 没法给单行染色, "选中 + 滚动" 是最直观的定位手段;
        // 要行内红线/波浪线得换 CodeMirror 或 Monaco(整套编辑器), 属另一个量级。
        function ceGotoValidateError() {
            const bar = document.getElementById('ce-validate');
            const ta = document.getElementById('ce-file-content');
            if (!bar || !ta) return;
            const ln = bar.dataset.line ? parseInt(bar.dataset.line, 10) : 0;
            const nr = (bar.dataset.near || '').split(',').map(s => parseInt(s, 10));
            const hasNear = nr.length === 2 && !isNaN(nr[0]) && !isNaN(nr[1]) && nr[1] > nr[0];
            if (!ln && !hasNear) return;
            ta.focus();
            const lh = parseFloat(getComputedStyle(ta).lineHeight) || 20;
            if (ln) {
                // 精确行列: 选中整行
                const lines = ta.value.split('\n');
                let start = 0;
                for (let i = 0; i < ln - 1 && i < lines.length; i++) start += lines[i].length + 1;
                const end = start + ((lines[ln - 1] || '').length);
                ta.setSelectionRange(start, end);
                ta.scrollTop = Math.max(0, (ln - 1) * lh - ta.clientHeight / 2);
            } else {
                // 只有片段: 选中该片段 (V8 给的上下文, 不谎称是精确行)
                ta.setSelectionRange(nr[0], nr[1]);
                const lineNo = ta.value.slice(0, nr[0]).split('\n').length;
                ta.scrollTop = Math.max(0, (lineNo - 1) * lh - ta.clientHeight / 2);
            }
        }

        // 行号槽: 与正文同字体/同行高, 只随 scrollTop 平移。
        // 前提是 textarea 用 wrap="off" —— 软换行会让一个逻辑行占两个视觉行, 行号必然错位。
        let ceGutterCount = -1;
        function ceRenderGutter(errLine) {
            const ta = document.getElementById('ce-file-content');
            const g = document.getElementById('ce-gutter');
            if (!ta || !g) return;
            const n = ta.value.split('\n').length;
            if (n !== ceGutterCount) {
                ceGutterCount = n;
                const frag = document.createDocumentFragment();
                for (let i = 1; i <= n; i++) {
                    const d = document.createElement('div');
                    d.textContent = i;
                    frag.appendChild(d);
                }
                g.textContent = '';
                g.appendChild(frag);
            }
            // 出错行在行号槽里标红 (textarea 本体没法给单行染色, 行号槽可以)
            const prev = g.querySelector('.err-line');
            if (prev) prev.classList.remove('err-line');
            if (errLine && errLine >= 1 && g.children[errLine - 1]) {
                g.children[errLine - 1].classList.add('err-line');
            }
            g.scrollTop = ta.scrollTop;
        }

        document.getElementById('ce-file-content').addEventListener('input', ceScheduleValidate);
        document.getElementById('ce-file-content').addEventListener('input', function () { ceRenderGutter(); });
        document.getElementById('ce-file-content').addEventListener('scroll', function () {
            const g = document.getElementById('ce-gutter');
            if (g) g.scrollTop = this.scrollTop; // 行号跟着正文一起滚
        });
        document.getElementById('ce-validate').addEventListener('click', ceGotoValidateError);

        // 编码切换: 重新加载当前文件
        document.getElementById('ce-encoding').addEventListener('change', function () {
            if (ceEditingFilePath) {
                const curName = ceEditingFilePath.replace(/.*[/\\]/, '');
                ceOpenFile(ceEditingFilePath, curName, this.value);
            }
        });
    </script>
</body>
</html>
