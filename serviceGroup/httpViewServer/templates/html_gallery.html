<!DOCTYPE html>
<html>
<head>
    <title>{{ folder }} HTML页面库</title>
    <style>
    /* 基本样式 */
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f5f5f5;
    }
    
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 10px;
        background: white;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .file-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }
    
    .file-item {
        background: white;
        border-radius: 5px;
        padding: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        transition: transform 0.2s;
        cursor: pointer;
    }
    
    .file-item:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    
    .file-name {
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }
    
    .pagination {
        display: flex;
        justify-content: center;
        margin-top: 30px;
        gap: 10px;
    }
    
    .pagination a {
        padding: 10px 15px;
        background: white;
        text-decoration: none;
        color: #333;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .pagination a.active {
        background: #2196F3;
        color: white;
    }
    
    .back-button {
        padding: 10px 20px;
        background: #2196F3;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    </style>
</head>
<body>
    <div class="header">
        <h1>{{ folder }} HTML页面库</h1>
        <a href="javascript:void(0);" onclick="saveAndReturn()" class="back-button">← 返回上级</a>
    </div>
    
    <div class="file-list">
        {% for item in items %}
        <div class="file-item" onclick="viewFile('{{ item.name|urlencode }}')">
            <div class="file-name">{{ item.name }}</div>
            <div class="file-preview">点击查看HTML页面</div>
        </div>
        {% endfor %}
    </div>

    <script>
        // 返回上级目录
        function saveAndReturn() {
            // 解码当前路径（处理URL编码）
            const currentPath = decodeURIComponent('{{ folder }}');
            // 分割路径并过滤空段
            const pathSegments = currentPath.split('/').filter(Boolean);
            // 获取父级路径
            const parentPath = pathSegments.slice(0, -1).join('/');
            
            // 重新编码路径并跳转
            const encodedPath = parentPath ? encodeURIComponent(parentPath) : '';
            window.location.href = encodedPath 
                ? `/browse/${encodedPath}`
                : '/';
        }
        
        // 查看文件
        function viewFile(filename) {
            const folder = encodeURIComponent('{{ folder }}');
            window.location.href = `/html/${folder}/${filename}`;
        }
    </script>
</body>
</html>
