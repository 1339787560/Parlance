<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四川麻将复盘器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #0e2418; color: #eee; user-select: none; }

    /* 悬浮工具栏 (仿做牌器 .svc-bar pill) */
    .svc-bar {
      position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 200;
      display: flex; gap: 6px; align-items: center; flex-wrap: nowrap;
      background: rgba(20,40,30,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: calc(100vw - 16px); font-size: 12px;
    }
    .svc-bar label { display: flex; align-items: center; gap: 3px; color: #9ab; }
    .svc-bar input { width: 64px; padding: 3px 6px; background: #1a3a2a; color: #eee; border: 1px solid #2a5a3a; border-radius: 4px; font-size: 11px; }
    .svc-bar input[type=datetime-local] { width: 150px; }
    .svc-bar button { padding: 4px 10px; background: #2a5a3a; color: #eee; border: 1px solid #3a7a5a; border-radius: 999px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .svc-bar button:hover { background: #3a7a5a; }
    .svc-bar button.primary { background: #c8332e; border-color: #e8433e; }
    .svc-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
    .svc-bar .pill { color: #fc6; background: rgba(252,192,80,.12); padding: 3px 10px; border-radius: 999px; font-size: 11px; }

    /* 主区: padding-top 让位悬浮栏 */
    .app { display: flex; flex-direction: column; height: 100vh; padding-top: 56px; }
    .meta { padding: 3px 16px; font-size: 11px; color: #8aa; border-bottom: 1px solid rgba(255,255,255,.05); flex-shrink: 0; }

    /* 桌面 grid 3×3 (4 chair + center) */
    .table {
      flex: 1 1 auto; min-height: 0; position: relative;
      display: grid; grid-template-areas: ". top ." "left center right" ". bottom .";
      grid-template-columns: 1fr 2.2fr 1fr; grid-template-rows: auto 1fr auto;
      gap: 6px; padding: 8px;
    }
    .chair { background: rgba(255,255,255,.04); border-radius: 8px; padding: 6px 10px; min-width: 0; }
    .chair.top { grid-area: top; } .chair.bottom { grid-area: bottom; }
    .chair.left { grid-area: left; } .chair.right { grid-area: right; }
    .chair.active { outline: 2px solid #fc6; }

    .player-info { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 12px; }
    .name { font-weight: bold; color: #ffe; }
    .uid { color: #6a8a7a; font-size: 10px; }
    .que-chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; background: #3a2a1a; color: #fc6; }
    .que-chip.W { background: #1a3a5a; color: #9cf; }
    .que-chip.T { background: #1a5a3a; color: #9f9; }
    .que-chip.D { background: #5a1a1a; color: #f99; }
    .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; min-height: 30px; flex-wrap: wrap; }
    .label { font-size: 10px; color: #6a8a7a; width: 26px; flex-shrink: 0; }
    .hand-area, .meld-area, .hu-area { display: flex; flex-wrap: wrap; gap: 1px; align-items: center; }
    .hu-area { margin-left: 6px; }

    /* center 内部 3×3: 4 弃牌区 + 牌墙 */
    .center {
      grid-area: center; min-width: 0; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto 1fr auto;
      gap: 4px; align-items: center; justify-items: center; padding: 4px;
    }
    .disc { background: rgba(255,255,255,.03); border-radius: 6px; padding: 4px 6px; min-height: 30px; max-width: 100%; display: flex; flex-wrap: wrap; gap: 1px; justify-content: center; align-content: center; }
    .disc.label { background: transparent; color: #6a8a7a; font-size: 10px; min-height: auto; }
    .disc-top { grid-column: 2; grid-row: 1; }
    .disc-left { grid-column: 1; grid-row: 2; }
    .disc-right { grid-column: 3; grid-row: 2; }
    .disc-bottom { grid-column: 2; grid-row: 3; }
    .wall-box { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .wall { padding: 10px 16px; background: linear-gradient(180deg,#3a5a3a,#2a4a2a); border-radius: 8px; color: #ffe; font-size: 14px; font-weight: bold; border: 1px solid #4a6a4a; min-width: 96px; text-align: center; }
    .wall .num { color: #fc6; font-size: 18px; }
    .exchange { font-size: 10px; color: #fc6; max-width: 180px; text-align: center; line-height: 1.4; }

    /* 牌面 sprite */
    .tile {
      display: inline-block; width: 26px; height: 37px;
      background-image: url(/recorder/mj_color0.png); background-repeat: no-repeat;
      background-size: 233px 233px; vertical-align: middle; margin-right: 1px;
      border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .tile.sm { width: 16px; height: 23px; background-size: 143px 143px; box-shadow: 0 1px 1px rgba(0,0,0,.4); }
    .tile.zhong { background: #b33 !important; color: #fff; font-weight: bold; text-align: center; line-height: 37px; font-size: 16px; }
    .tile.sm.zhong { line-height: 23px; font-size: 11px; }

    /* 折叠日志 */
    .log-panel { flex-shrink: 0; background: #0a1a12; border-top: 1px solid rgba(255,255,255,.08); }
    .log-panel summary { padding: 6px 16px; cursor: pointer; font-size: 12px; color: #9ab; list-style: none; display: flex; align-items: center; gap: 8px; }
    .log-panel summary::-webkit-details-marker { display: none; }
    .log-panel summary::before { content: "▶"; font-size: 10px; transition: transform .15s; }
    .log-panel[open] summary::before { transform: rotate(90deg); }
    .log-panel[open] summary { border-bottom: 1px solid rgba(255,255,255,.05); }
    .steps { padding: 6px 16px; max-height: 26vh; overflow: auto; font-family: Consolas, monospace; font-size: 11px; }
    .step { padding: 1px 6px; cursor: pointer; border-radius: 2px; white-space: pre; }
    .step:hover { background: rgba(255,255,255,.08); }
    .step.active { background: #3a5a4a; }
    .step .t { color: #6a8a7a; } .step .ty { color: #fc6; } .step .body { color: #ddd; }
  </style>
</head>
<body>

  <div class="svc-bar">
    <label>房 <input id="f-room" placeholder="RoomID"></label>
    <label>桌 <input id="f-table" placeholder="TableNO"></label>
    <label>玩家 <input id="f-user" placeholder="UserID"></label>
    <label>从 <input id="f-t1" type="datetime-local"></label>
    <label>到 <input id="f-t2" type="datetime-local"></label>
    <button id="btn-list">列 record</button>
    <span class="sep"></span>
    <button id="btn-prev">◀</button>
    <span class="pill" id="step-info">步 -/-</span>
    <button id="btn-next">▶</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="btn-visible"> 显对手</label>
    <button id="btn-demo" class="primary">加载 demo</button>
  </div>

  <div class="app">
    <div class="meta" id="meta">未加载</div>

    <div class="table">
      <div class="chair top" data-chair="2">
        <div class="player-info"><span class="name">玩家2</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span></div>
        <div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div>
        <div class="row"><span class="label">手牌</span><div class="hand-area"></div></div>
      </div>
      <div class="chair left" data-chair="1">
        <div class="player-info"><span class="name">玩家1</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span></div>
        <div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div>
        <div class="row"><span class="label">手牌</span><div class="hand-area"></div></div>
      </div>
      <div class="chair right" data-chair="3">
        <div class="player-info"><span class="name">玩家3</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span></div>
        <div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div>
        <div class="row"><span class="label">手牌</span><div class="hand-area"></div></div>
      </div>
      <div class="chair bottom" data-chair="0">
        <div class="player-info"><span class="name">玩家0</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span></div>
        <div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div>
        <div class="row"><span class="label">手牌</span><div class="hand-area"></div></div>
      </div>

      <div class="center">
        <div class="disc disc-top" data-disc="2"></div>
        <div class="disc disc-left" data-disc="1"></div>
        <div class="wall-box">
          <div class="wall">墙余 <span class="num" id="wall-num">-</span></div>
          <div class="exchange" id="exchange"></div>
        </div>
        <div class="disc disc-right" data-disc="3"></div>
        <div class="disc disc-bottom" data-disc="0"></div>
      </div>
    </div>

    <details class="log-panel">
      <summary>对局日志（点击展开）</summary>
      <div class="steps" id="step-list"></div>
    </details>
  </div>

<script>
  // 川麻特化布局:
  //   玩家三段 meld(碰杠)|hand(手牌)|hu(胡牌右) + que chip + 桌面中心(4 弃牌区+牌墙+换三张)
  const rec = { header: {}, events: [], displayEvents: [] };
  const snaps = [];
  let curStep = -1, listBuilt = false;
  const showAll = () => document.getElementById('btn-visible').checked;

  // sprite 切片 (memory mj-cardface-sprite-tracker): 万 R0/条 R1/筒 R3, x=[5,118,235,345,462,573,687,804,916], y={W:7,T:153,D:447}
  const SPRITE_X = [5,118,235,345,462,573,687,804,916];
  const SPRITE_Y = { W: 7, T: 153, D: 447 };
  function tileHtml(card, sm) {
    if (card[1] === 'F') return `<span class="tile${sm?' sm':''} zhong">中</span>`;
    const scale = sm ? 0.14 : 0.228;
    const x = SPRITE_X[(+card[0]) - 1] * scale;
    const y = (SPRITE_Y[card[1]] || 0) * scale;
    const bg = 1024 * scale;
    return `<span class="tile${sm?' sm':''}" style="background-size:${bg.toFixed(0)}px ${bg.toFixed(0)}px;background-position:-${x.toFixed(0)}px -${y.toFixed(0)}px"></span>`;
  }
  function chunks(s) { const a = []; for (let i = 0; i + 1 < s.length; i += 2) a.push(s.slice(i, i + 2)); return a; }

  function parseRecord(txt) {
    const lines = txt.split(/\r?\n/);
    const header = {}; const events = [];
    for (const line of lines) {
      if (!line.trim()) continue;
      const m = line.match(/^(\d{2}:\d{2}:\d{2})\s+(\S+)\s*(.*)$/);
      if (m) { events.push({ time: m[1], type: m[2], rest: m[3].trim() }); continue; }
      const hm = line.match(/^(\w+)\s+(.*)$/);
      if (!hm) continue;
      const k = hm[1], v = hm[2];
      if (k === 'ChairNO' || k === 'Name' || k === 'Win_Loss_StandOff') (header[k] = header[k] || []).push(v);
      else header[k] = v;
    }
    rec.header = header; rec.events = events;
    rec.displayEvents = events.filter(e => !e.type.startsWith('Raw'));
    buildSnapshots();
  }

  function buildSnapshots() {
    const hands = [[],[],[],[]], que = ['','','',''], discards = [[],[],[],[]], melds=[[],[],[],[]], hu=[[],[],[],[]];
    const exchanges = [];
    const TOTAL = 114; // xzms 六红中 114 张
    const snap0 = { hands: hands.map(a=>a.slice()), que: que.slice(), discards: discards.map(a=>a.slice()), melds, hu, exchanges: [], ev: null };
    snaps.length = 0; snaps.push(snap0);
    for (const ev of rec.events) {
      const p = ev.rest.split(/\s+/);
      const c = p[0] !== '' ? parseInt(p[0], 10) : NaN;
      switch (ev.type) {
        case 'Deal': if (c>=0&&c<4) hands[c] = chunks(p[1] || ''); break;
        case 'Throw': if (c>=0&&c<4) { const i = hands[c].indexOf(p[1]); if (i>=0) hands[c].splice(i,1); discards[c].push(p[1]); } break;
        case 'Catch': if (c>=0&&c<4) hands[c].push(p[1]); break;
        case 'Que': if (c>=0&&c<4) que[c] = p[1] || ''; break;
        case 'Exchange': exchanges.push({ from: p[0], to: p[1], cards: chunks(p[2] || '') }); break;
      }
      const used = hands.reduce((s,a)=>s+a.length,0) + discards.reduce((s,a)=>s+a.length,0) + melds.reduce((s,a)=>s+a.length,0) + hu.reduce((s,a)=>s+a.length,0);
      snaps.push({ hands: hands.map(a=>a.slice()), que: que.slice(), discards: discards.map(a=>a.slice()), melds, hu, exchanges: exchanges.slice(), ev, wall: TOTAL - used });
    }
  }

  function renderMeta() {
    const h = rec.header;
    const uids = (h.ChairNO || []).map(s => s.split(/\s+/)[1]);
    document.getElementById('meta').textContent =
      `RoomID ${h.RoomID||'-'} | TableNO ${h.TableNO||'-'} | Flags ${h.Flags||'-'} | uid [${uids.join(', ')}] | Timestamp ${h.Timestamp||'-'}`;
    uids.forEach((uid, c) => { const el = document.querySelector(`.chair[data-chair="${c}"] .uid`); if (el) el.textContent = uid ? `uid ${uid}` : ''; });
  }

  function setActiveStep(idx) {
    document.querySelectorAll('.step.active').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.step[data-snap="${idx}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
    document.getElementById('step-info').textContent = `步 ${idx}/${snaps.length-1}`;
  }

  function renderSnap(idx) {
    if (idx < 0 || idx >= snaps.length) return;
    curStep = idx;
    const s = snaps[idx];
    const vis = showAll();
    for (let c = 0; c < 4; c++) {
      const chair = document.querySelector(`.chair[data-chair="${c}"]`);
      // 手牌: chair 0 (自己) 始终显; 其他看 showAll
      const showHand = c === 0 || vis;
      chair.querySelector('.hand-area').innerHTML = showHand ? s.hands[c].map(t => tileHtml(t, false)).join('') : '<span style="color:#6a8a7a;font-size:11px">隐</span>';
      const chip = chair.querySelector('.que-chip');
      const q = s.que[c];
      chip.textContent = q ? `缺 ${q}` : '缺 -';
      chip.className = 'que-chip' + (q ? ' '+q : '');
    }
    // 中心弃牌 + 牌墙 + 换三张
    for (let c = 0; c < 4; c++) {
      const dz = document.querySelector(`.disc[data-disc="${c}"]`);
      if (dz) dz.innerHTML = s.discards[c].map(t => tileHtml(t, true)).join('');
    }
    document.getElementById('wall-num').textContent = s.wall;
    const ex = s.exchanges;
    document.getElementById('exchange').innerHTML = ex.length
      ? ex.map(e => `${e.from}→${e.to}: ${e.cards.map(c=>c[1]==='F'?'中':c).join('')}`).join(' / ')
      : '';
    setActiveStep(idx);
  }

  function buildStepListOnce() {
    if (listBuilt) return;
    const list = document.getElementById('step-list');
    const idxOf = new Map();
    for (let i = 0; i < snaps.length; i++) if (snaps[i].ev) idxOf.set(snaps[i].ev, i);
    let html = '';
    for (const ev of rec.displayEvents) {
      const si = idxOf.get(ev);
      const esc = ev.rest.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[m]);
      html += `<div class="step" data-snap="${si}"><span class="t">${ev.time}</span> <span class="ty">${ev.type.padEnd(8)}</span> <span class="body">${esc}</span></div>`;
    }
    list.innerHTML = html;
    list.querySelectorAll('.step').forEach(el => el.addEventListener('click', () => renderSnap(parseInt(el.dataset.snap, 10))));
    listBuilt = true;
  }

  async function loadDemo() {
    try {
      const txt = await fetch('/recorder/demo').then(r => r.text());
      parseRecord(txt);
      listBuilt = false;
      renderMeta();
      buildStepListOnce();
      renderSnap(snaps.length - 1);
    } catch (e) { document.getElementById('meta').textContent = '加载失败: ' + e; }
  }

  document.getElementById('btn-prev').onclick = () => { if (curStep > 0) renderSnap(curStep - 1); };
  document.getElementById('btn-next').onclick = () => { if (curStep < snaps.length - 1) renderSnap(curStep + 1); };
  document.getElementById('btn-demo').onclick = loadDemo;
  document.getElementById('btn-visible').onchange = () => renderSnap(curStep);
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (curStep > 0) renderSnap(curStep - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (curStep < snaps.length - 1) renderSnap(curStep + 1); }
  });

  loadDemo();
</script>
</body>
</html>
