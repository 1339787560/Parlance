<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四川麻将复盘器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #0e2418; color: #eee; user-select: none; }

    .svc-bar {
      position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 200;
      display: flex; gap: 6px; align-items: center; flex-wrap: nowrap;
      background: rgba(20,40,30,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: calc(100vw - 16px); font-size: 12px;
    }
    .svc-bar label { display: flex; align-items: center; gap: 3px; color: #9ab; }
    .svc-bar input { width: 60px; padding: 3px 6px; background: #1a3a2a; color: #eee; border: 1px solid #2a5a3a; border-radius: 4px; font-size: 11px; }
    .svc-bar input[type=datetime-local] { width: 140px; }
    .svc-bar button { padding: 4px 10px; background: #2a5a3a; color: #eee; border: 1px solid #3a7a5a; border-radius: 999px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .svc-bar button:hover { background: #3a7a5a; }
    .svc-bar button.primary { background: #c8332e; border-color: #e8433e; }
    .svc-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
    .svc-bar .pill { color: #fc6; background: rgba(252,192,80,.12); padding: 3px 10px; border-radius: 999px; font-size: 11px; }

    .app { display: flex; flex-direction: column; height: 100vh; padding-top: 52px; }
    .meta { padding: 2px 16px; font-size: 11px; color: #8aa; border-bottom: 1px solid rgba(255,255,255,.05); flex-shrink: 0; }
    .meta b { color: #ffe; }

    .table {
      flex: 1 1 auto; min-height: 0; position: relative;
      display: grid;
      grid-template-areas: "tl top tr" "left center right" "bl bottom br";
      grid-template-columns: minmax(120px, auto) 1fr minmax(120px, auto);
      grid-template-rows: auto 1fr auto;
      gap: 4px; padding: 6px;
    }
    .chair { background: rgba(255,255,255,.04); border-radius: 8px; padding: 5px 8px; min-width: 0; position: relative; }
    .chair.pos-top { grid-area: top; } .chair.pos-bottom { grid-area: bottom; }
    .chair.pos-left { grid-area: left; } .chair.pos-right { grid-area: right; }
    .chair.active { outline: 2px solid #fc6; }

    .corner { font-size: 10px; color: #8aa; padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
    .corner.tl { grid-area: tl; align-items: flex-start; }
    .corner.tr { grid-area: tr; align-items: flex-end; text-align: right; }
    .corner.bl { grid-area: bl; align-items: flex-start; }
    .corner.br { grid-area: br; align-items: flex-end; }
    .corner .v { color: #ffe; font-size: 13px; }
    .corner .kbd { background: #1a3a2a; padding: 1px 5px; border-radius: 3px; border: 1px solid #2a5a3a; color: #fc6; }
    .persp-btns { display: flex; gap: 3px; margin-top: 2px; }
    .persp-btns button { width: 22px; height: 22px; padding: 0; font-size: 11px; background: #2a5a3a; color: #eee; border: 1px solid #3a7a5a; border-radius: 4px; cursor: pointer; }
    .persp-btns button.active { background: #c8332e; border-color: #e8433e; }

    .player-info { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 12px; }
    .name { font-weight: bold; color: #ffe; }
    .uid { color: #6a8a7a; font-size: 10px; }
    .que-chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; background: #3a2a1a; color: #fc6; transition: transform .2s; }
    .que-chip.W { background: #1a3a5a; color: #9cf; }
    .que-chip.T { background: #1a5a3a; color: #9f9; }
    .que-chip.D { background: #5a1a1a; color: #f99; }
    .que-chip.pulse { animation: pulse .6s ease-out 2; }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
    /* 携带损益 (大字 + 金/蓝) */
    .deposit { margin-left: auto; font-size: 18px; font-weight: bold; font-family: Consolas, monospace; }
    .deposit.pos { color: #fc6; text-shadow: 0 0 8px rgba(252,192,80,.5); }
    .deposit.neg { color: #6cf; text-shadow: 0 0 8px rgba(108,192,255,.5); }
    .deposit.zero { color: #6a8a7a; font-size: 13px; }

    .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; min-height: 28px; flex-wrap: wrap; }
    .label { font-size: 10px; color: #6a8a7a; width: 24px; flex-shrink: 0; }
    .hand-area, .meld-area, .hu-area { display: flex; flex-wrap: wrap; gap: 1px; align-items: center; }
    .hu-area { margin-left: 6px; }

    .center {
      grid-area: center; min-width: 0; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto 1fr auto;
      gap: 3px; align-items: center; justify-items: center; padding: 4px;
    }
    .disc { background: rgba(255,255,255,.03); border-radius: 6px; padding: 3px 5px; min-height: 26px; max-width: 100%; display: flex; flex-wrap: wrap; gap: 1px; justify-content: center; align-content: center; transition: background .2s; }
    .disc.exchange-zone { background: rgba(252,192,80,.1); box-shadow: 0 0 0 1px rgba(252,192,80,.3); }
    .disc.pos-top { grid-column: 2; grid-row: 1; }
    .disc.pos-left { grid-column: 1; grid-row: 2; }
    .disc.pos-right { grid-column: 3; grid-row: 2; }
    .disc.pos-bottom { grid-column: 2; grid-row: 3; }
    .wall-box { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; max-width: 240px; }
    .wall { padding: 6px 14px; background: linear-gradient(180deg,#3a5a3a,#2a4a2a); border-radius: 8px; color: #ffe; font-size: 12px; border: 1px solid #4a6a4a; min-width: 84px; text-align: center; }
    .wall .num { color: #fc6; font-size: 16px; font-weight: bold; }
    .exchange { font-size: 10px; color: #fc6; max-width: 220px; text-align: center; line-height: 1.5; }
    .phase-tag { background: #c8332e; color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: bold; }
    .direction { font-size: 22px; color: #fc6; line-height: 1; }

    /* 牌面 sprite (精确 cell bbox; 红中文字渲染) */
    .tile {
      display: inline-block; background-image: url(/recorder/mj_color0.png); background-repeat: no-repeat;
      vertical-align: middle; margin-right: 1px; border-radius: 3px;
      box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25);
      animation: tileIn .25s ease-out;
    }
    @keyframes tileIn { from { opacity: 0; transform: translateY(-8px) scale(.9); } to { opacity: 1; } }
    /* 红中: 红底白"中" (川麻无风花, sprite R2 字牌行不纯, 回退文字) */
    .tile.zhong {
      width: 28px; height: 39px; background: linear-gradient(180deg,#c33,#8a1a1a); color: #fff;
      font-weight: bold; text-align: center; line-height: 39px; font-size: 18px;
      border: 1px solid #e8433e;
    }
    .tile.sm.zhong { width: 17px; height: 24px; line-height: 24px; font-size: 11px; }
    /* 牌背 */
    .tile.back {
      width: 28px; height: 39px; margin-right: 1px; border-radius: 3px;
      background: linear-gradient(135deg, #5a1a2a 0%, #8a2a3a 50%, #5a1a2a 100%);
      border: 1px solid #a9445a;
      box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2);
      position: relative; animation: tileIn .25s ease-out;
    }
    .tile.back::after { content: "🀄"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; opacity: .5; }
    .tile.sm.back { width: 17px; height: 24px; }
    .tile.sm.back::after { font-size: 11px; }

    .log-panel { flex-shrink: 0; background: #0a1a12; border-top: 1px solid rgba(255,255,255,.08); }
    .log-panel summary { padding: 5px 16px; cursor: pointer; font-size: 12px; color: #9ab; list-style: none; display: flex; align-items: center; gap: 8px; }
    .log-panel summary::-webkit-details-marker { display: none; }
    .log-panel summary::before { content: "▶"; font-size: 10px; transition: transform .15s; }
    .log-panel[open] summary::before { transform: rotate(90deg); }
    .log-panel[open] summary { border-bottom: 1px solid rgba(255,255,255,.05); }
    .steps { padding: 5px 16px; max-height: 24vh; overflow: auto; font-family: Consolas, monospace; font-size: 11px; }
    .step { padding: 1px 6px; cursor: pointer; border-radius: 2px; white-space: pre; }
    .step:hover { background: rgba(255,255,255,.08); }
    .step.active { background: #3a5a4a; }
    .step.phase { color: #fc6; font-weight: bold; }
    .step .t { color: #6a8a7a; } .step .ty { color: #fc6; } .step .body { color: #ddd; }
  </style>
</head>
<body>

  <div class="svc-bar">
    <label>房 <input id="f-room" placeholder="RoomID"></label>
    <label>桌 <input id="f-table" placeholder="TableNO"></label>
    <label>玩家 <input id="f-user" placeholder="UserID"></label>
    <button id="btn-list">列 record</button>
    <span class="sep"></span>
    <button id="btn-prev">◀</button>
    <span class="pill" id="step-info">步 -/-</span>
    <button id="btn-next">▶</button>
    <span class="sep"></span>
    <label><input type="checkbox" id="btn-visible" checked> 显对手</label>
    <button id="btn-demo" class="primary">加载 demo</button>
  </div>

  <div class="app">
    <div class="meta" id="meta">未加载</div>

    <div class="table">
      <div class="corner tl">
        <div>房 <span class="v" id="c-room">-</span></div>
        <div>桌 <span class="v" id="c-table">-</span></div>
      </div>
      <div class="corner tr">
        <div>时间戳</div>
        <div class="v" id="c-ts">-</div>
      </div>
      <div class="corner bl">
        <div><span class="kbd">←</span> <span class="kbd">→</span> 切步</div>
        <div><span class="kbd">1</span>-<span class="kbd">4</span> 视角</div>
      </div>
      <div class="corner br">
        <div>视角 (底位)</div>
        <div class="persp-btns" id="persp-btns">
          <button data-p="0">0</button><button data-p="1">1</button>
          <button data-p="2">2</button><button data-p="3">3</button>
        </div>
      </div>

      <div class="chair" data-chair="0"><div class="player-info"><span class="name">玩家0</span><span class="que-chip" data-que>缺 -</span><span class="deposit zero" data-deposit>0</span></div><div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div><div class="row"><span class="label">手牌</span><div class="hand-area"></div></div></div>
      <div class="chair" data-chair="1"><div class="player-info"><span class="name">玩家1</span><span class="que-chip" data-que>缺 -</span><span class="deposit zero" data-deposit>0</span></div><div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div><div class="row"><span class="label">手牌</span><div class="hand-area"></div></div></div>
      <div class="chair" data-chair="2"><div class="player-info"><span class="name">玩家2</span><span class="que-chip" data-que>缺 -</span><span class="deposit zero" data-deposit>0</span></div><div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div><div class="row"><span class="label">手牌</span><div class="hand-area"></div></div></div>
      <div class="chair" data-chair="3"><div class="player-info"><span class="name">玩家3</span><span class="que-chip" data-que>缺 -</span><span class="deposit zero" data-deposit>0</span></div><div class="row"><span class="label">碰杠</span><div class="meld-area"></div><div class="hu-area"></div></div><div class="row"><span class="label">手牌</span><div class="hand-area"></div></div></div>

      <div class="center">
        <div class="disc" data-disc="0"></div>
        <div class="disc" data-disc="1"></div>
        <div class="disc" data-disc="2"></div>
        <div class="disc" data-disc="3"></div>
        <div class="wall-box">
          <div class="phase-tag" id="phase-tag" style="display:none">换三张</div>
          <div class="direction" id="direction" style="display:none">↻</div>
          <div class="wall">墙余 <span class="num" id="wall-num">-</span></div>
          <div class="exchange" id="exchange"></div>
        </div>
      </div>
    </div>

    <details class="log-panel">
      <summary>对局日志（点击展开）</summary>
      <div class="steps" id="step-list"></div>
    </details>
  </div>

<script>
  const rec = { header: {}, events: [], displayEvents: [] };
  const snaps = [];
  let curStep = -1, listBuilt = false, perspective = 0, prevQue = ['','','',''];

  // sprite 精确 cell bbox (PIL scan; 川麻只用 万 R0/条 R1/筒 R2, 红中 = 风字行 R3C4)
  // R3=风字行(东南西北中发白)非筒, memory mj-cardface-sprite-tracker 推断 R3=筒 错, 已校 R2=筒
  const ROWS_Y = [8, 153, 301, 448, 590, 745];
  const ROWS_H = [133, 136, 131, 132, 137, 120];
  const COLS_X = [6, 118, 237, 346, 465, 576, 687, 805, 916];
  const COLS_W = [102, 104, 96, 101, 94, 101, 103, 99, 102];
  const SUIT_ROW = { W: 0, T: 1, D: 2 };
  const ZHONG = { row: 3, col: 4 };  // 红中在风字行 col4 (RGB 177,113,112 红; col5 绿=发 col6 灰=白)
  const QUE_NAME = { W: '万', T: '条', D: '筒' };
  const SUIT_ORDER = { F: 0, W: 1, T: 2, D: 3 };

  function tileHtml(card, sm) {
    const scale = sm ? 0.16 : 0.28;
    let row, col;
    if (card[1] === 'F') { row = ZHONG.row; col = ZHONG.col; }
    else { row = SUIT_ROW[card[1]]; col = (+card[0]) - 1; }
    const x = COLS_X[col], y = ROWS_Y[row], w = COLS_W[col], h = ROWS_H[row];
    const bg = 1024 * scale;
    return `<span class="tile${sm?' sm':''}" style="width:${(w*scale).toFixed(0)}px;height:${(h*scale).toFixed(0)}px;background-size:${bg.toFixed(0)}px ${bg.toFixed(0)}px;background-position:-${(x*scale).toFixed(0)}px -${(y*scale).toFixed(0)}px"></span>`;
  }
  function backHtml(sm) { return `<span class="tile${sm?' sm':''} back"></span>`; }
  function chunks(s) { const a = []; for (let i = 0; i + 1 < s.length; i += 2) a.push(s.slice(i, i + 2)); return a; }
  function sortHand(a, b) {
    const sa = SUIT_ORDER[a[1]], sb = SUIT_ORDER[b[1]];
    if (sa !== sb) return sa - sb;
    return (+a[0]) - (+b[0]);
  }

  function parseRecord(txt) {
    const lines = txt.split(/\r?\n/);
    const header = {}, events = [];
    for (const line of lines) {
      if (!line.trim()) continue;
      const m = line.match(/^(\d{2}:\d{2}:\d{2})\s+(\S+)\s*(.*)$/);
      if (m) { events.push({ time: m[1], type: m[2], rest: m[3].trim() }); continue; }
      const hm = line.match(/^(\w+)\s+(.*)$/);
      if (!hm) continue;
      const k = hm[1], v = hm[2];
      if (k === 'ChairNO' || k === 'Name' || k === 'Win_Loss_StandOff') {
        // record 多局汇总时这些键会重复出现, 按 chair 字段索引存 (去重留最后), 避免 renderMeta forEach 越界
        const ci = parseInt(v.split(/\s+/)[0], 10);
        if (!Number.isNaN(ci)) { (header[k] = header[k] || [])[ci] = v; }
      }
      else header[k] = v;
    }
    rec.header = header; rec.events = events;
    rec.displayEvents = events.filter(e => !e.type.startsWith('Raw'));
    buildSnapshots();
  }

  function snap(hands, que, discards, melds, hu, exchanges, wall, deposit, depositInit, extra = {}) {
    return {
      hands: hands.map(a => a.slice()), que: que.slice(),
      discards: discards.map(a => a.slice()),
      melds: melds.map(a => a.slice()), hu: hu.map(a => a.slice()),
      exchanges: exchanges.slice(), wall,
      deposit: deposit.slice(), depositInit: depositInit.slice(),
      ...extra,
    };
  }
  const sumLen = a => a.reduce((s,x)=>s+x.length, 0);

  function buildSnapshots() {
    const hands = [[],[],[],[]], que = ['','','',''], discards=[[],[],[],[]], melds=[[],[],[],[]], hu=[[],[],[],[]], exchanges = [];
    const deposit = [null,null,null,null];
    const depositInit = [null,null,null,null];
    const TOTAL = 114;
    const evs = rec.events, n = evs.length;
    const wallNow = () => TOTAL - sumLen(hands) - sumLen(discards) - sumLen(melds) - sumLen(hu);
    snaps.length = 0;
    snaps.push(snap(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit));

    let i = 0;
    while (i < n) {
      const ev = evs[i];
      const t = ev.type;

      // 换三张 block: Exchange {receiver}{giver}{cards}
      if (t === 'Exchange') {
        const block = [];
        while (i < n && evs[i].type === 'Exchange') { block.push(evs[i]); i++; }
        const recv = {};
        for (const e of block) {
          const p = e.rest.split(/\s+/);
          recv[p[0]] = { from: p[1], cards: chunks(p[2] || '') };
        }
        // 方向判断: 全部 from==(receiver+1)%4 → 顺时针占位; from==(receiver+3)%4 → 逆
        let dir = '';
        const rs = Object.keys(recv);
        if (rs.length) {
          const r0 = +rs[0];
          const diff = (+recv[r0].from - r0 + 4) % 4;
          dir = diff === 1 ? '↻ 顺时针' : diff === 3 ? '↺ 逆时针' : '换';
        }
        snaps.push(snap(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit, { phase: '换三张·交换前', recv, dir }));
        for (const r in recv) for (const c of recv[r].cards) {
          const idx = hands[recv[r].from].indexOf(c);
          if (idx >= 0) hands[recv[r].from].splice(idx, 1);
        }
        for (const r in recv) hands[r].push(...recv[r].cards);
        for (const r in recv) exchanges.push({ receiver: r, from: recv[r].from, cards: recv[r].cards.slice() });
        snaps.push(snap(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit, { phase: '换三张·交换后', recv, dir }));
        continue;
      }

      // 定缺 block
      if (t === 'Que') {
        const block = [];
        while (i < n && evs[i].type === 'Que') { block.push(evs[i]); i++; }
        for (const e of block) { const p = e.rest.split(/\s+/); que[+p[0]] = p[1] || ''; }
        snaps.push(snap(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit, { phase: '定缺' }));
        continue;
      }

      // 结算 block: ScoreDiff / DepositDiff — 提取 DepositDiff 累计损益
      if (t === 'ScoreDiff' || t === 'DepositDiff') {
        const block = [];
        while (i < n && (evs[i].type === 'ScoreDiff' || evs[i].type === 'DepositDiff')) { block.push(evs[i]); i++; }
        for (const e of block) {
          if (e.type === 'DepositDiff') {
            const p = e.rest.split(/\s+/);
            const c = +p[0], val = +p[1];
            if (depositInit[c] === null) depositInit[c] = val;
            deposit[c] = val;
          }
        }
        snaps.push(snap(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit, { phase: '结算' }));
        continue;
      }

      // 常规事件
      const p = ev.rest.split(/\s+/);
      const c = p[0] !== '' ? parseInt(p[0], 10) : NaN;
      switch (t) {
        case 'Deal': if (c>=0&&c<4) hands[c] = chunks(p[1] || ''); break;
        case 'Throw': if (c>=0&&c<4) { const idx = hands[c].indexOf(p[1]); if (idx>=0) hands[c].splice(idx,1); discards[c].push(p[1]); } break;
        case 'Catch': if (c>=0&&c<4) hands[c].push(p[1]); break;
      }
      snaps.push(snap(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit, { ev }));
      i++;
    }
  }

  function posOf(chair) { return (chair - perspective + 4) % 4; }
  const POS_CLASS = ['pos-bottom', 'pos-left', 'pos-top', 'pos-right'];

  function applyLayout() {
    for (let c = 0; c < 4; c++) {
      const chair = document.querySelector(`.chair[data-chair="${c}"]`);
      chair.classList.remove(...POS_CLASS);
      chair.classList.add(POS_CLASS[posOf(c)]);
      const disc = document.querySelector(`.disc[data-disc="${c}"]`);
      disc.classList.remove(...POS_CLASS);
      disc.classList.add(POS_CLASS[posOf(c)]);
    }
    document.querySelectorAll('#persp-btns button').forEach(b => {
      b.classList.toggle('active', +b.dataset.p === perspective);
    });
  }

  function renderMeta() {
    const h = rec.header;
    document.getElementById('meta').innerHTML =
      `房 <b>${h.RoomID||'-'}</b> | 桌 <b>${h.TableNO||'-'}</b> | 时间戳 <b>${h.Timestamp||'-'}</b>`;
    document.getElementById('c-room').textContent = h.RoomID || '-';
    document.getElementById('c-table').textContent = h.TableNO || '-';
    document.getElementById('c-ts').textContent = h.Timestamp || '-';
    (h.ChairNO || []).forEach((s, c) => {
      const uid = s.split(/\s+/)[1];
      const el = document.querySelector(`.chair[data-chair="${c}"]`);
      let uidEl = el.querySelector('.uid');
      if (!uidEl) { uidEl = document.createElement('span'); uidEl.className = 'uid'; el.querySelector('.player-info').insertBefore(uidEl, el.querySelector('.que-chip')); }
      uidEl.textContent = uid ? `uid ${uid}` : '';
    });
  }

  function setActiveStep(idx) {
    document.querySelectorAll('.step.active').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.step[data-snap="${idx}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
    document.getElementById('step-info').textContent = `步 ${idx}/${snaps.length-1}`;
  }

  function renderSnap(idx) {
    if (idx < 0 || idx >= snaps.length) return;
    curStep = idx;
    const s = snaps[idx];
    const vis = document.getElementById('btn-visible').checked;
    const isExchangePhase = s.phase && s.phase.startsWith('换三张');

    for (let c = 0; c < 4; c++) {
      const chair = document.querySelector(`.chair[data-chair="${c}"]`);
      const showHand = c === perspective || vis;
      const sorted = s.hands[c].slice().sort(sortHand);
      const html = showHand ? sorted.map(t => tileHtml(t, false)).join('') : sorted.map(() => backHtml(false)).join('');
      chair.querySelector('.hand-area').innerHTML = html || '<span style="color:#6a8a7a;font-size:11px">-</span>';

      // 定缺 chip (变化时 pulse)
      const chip = chair.querySelector('.que-chip');
      const q = s.que[c];
      chip.textContent = q ? `缺 ${QUE_NAME[q]}` : '缺 -';
      chip.className = 'que-chip' + (q ? ' '+q : '');
      if (prevQue[c] !== q && q) { chip.classList.add('pulse'); setTimeout(() => chip.classList.remove('pulse'), 1200); }
      prevQue[c] = q;

      // 携带损益 (相对开局)
      const depEl = chair.querySelector('.deposit');
      const init = s.depositInit[c], cur = s.deposit[c];
      if (init !== null && cur !== null) {
        const delta = cur - init;
        depEl.textContent = (delta > 0 ? '+' : '') + delta;
        depEl.className = 'deposit ' + (delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'zero');
      } else {
        depEl.textContent = '0'; depEl.className = 'deposit zero';
      }
    }

    // 中心: 弃牌堆 或 换三张区
    for (let c = 0; c < 4; c++) {
      const dz = document.querySelector(`.disc[data-disc="${c}"]`);
      if (isExchangePhase && s.recv) {
        dz.classList.add('exchange-zone');
        let cards = null;
        if (s.phase.endsWith('交换前')) {
          // 该 chair 作为 giver 给出的
          for (const r in s.recv) if (s.recv[r].from == String(c)) { cards = s.recv[r].cards; break; }
        } else {
          // 该 chair 作为 receiver 收到的
          if (s.recv[c]) cards = s.recv[c].cards;
        }
        dz.innerHTML = cards ? cards.map(t => tileHtml(t, true)).join('') : '<span style="color:#6a8a7a;font-size:10px">-</span>';
      } else {
        dz.classList.remove('exchange-zone');
        dz.innerHTML = s.discards[c].map(t => tileHtml(t, true)).join('');
      }
    }

    document.getElementById('wall-num').textContent = s.wall;
    const exEl = document.getElementById('exchange');
    const dirEl = document.getElementById('direction');
    if (isExchangePhase) {
      dirEl.style.display = ''; dirEl.textContent = (s.dir || '').split(' ')[0] || '换';
      exEl.innerHTML = (s.dir || '') + '<br>' + Object.entries(s.recv).map(([r,g]) =>
        `${r}←${g.from}: ${g.cards.map(c => c[1]==='F'?'中':c).join('')}`).join(' / ');
    } else {
      dirEl.style.display = 'none';
      exEl.innerHTML = '';
    }

    const phaseTag = document.getElementById('phase-tag');
    if (s.phase) { phaseTag.style.display = ''; phaseTag.textContent = s.phase; }
    else phaseTag.style.display = 'none';

    setActiveStep(idx);
  }

  function buildStepListOnce() {
    if (listBuilt) return;
    const list = document.getElementById('step-list');
    let html = '';
    for (let i = 0; i < snaps.length; i++) {
      const s = snaps[i];
      if (s.phase) {
        html += `<div class="step phase" data-snap="${i}">★ ${s.phase}</div>`;
      } else if (s.ev) {
        const ev = s.ev;
        const esc = ev.rest.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[m]);
        html += `<div class="step" data-snap="${i}"><span class="t">${ev.time}</span> <span class="ty">${ev.type.padEnd(8)}</span> <span class="body">${esc}</span></div>`;
      }
    }
    list.innerHTML = html;
    list.querySelectorAll('.step').forEach(el => el.addEventListener('click', () => renderSnap(parseInt(el.dataset.snap, 10))));
    listBuilt = true;
  }

  async function loadDemo() {
    try {
      const txt = await fetch('/recorder/demo').then(r => r.text());
      parseRecord(txt);
      listBuilt = false;
      renderMeta();
      buildStepListOnce();
      renderSnap(snaps.length - 1);
    } catch (e) { document.getElementById('meta').textContent = '加载失败: ' + e; }
  }

  document.getElementById('btn-prev').onclick = () => { if (curStep > 0) renderSnap(curStep - 1); };
  document.getElementById('btn-next').onclick = () => { if (curStep < snaps.length - 1) renderSnap(curStep + 1); };
  document.getElementById('btn-demo').onclick = loadDemo;
  document.getElementById('btn-visible').onchange = () => renderSnap(curStep);
  document.querySelectorAll('#persp-btns button').forEach(b => {
    b.onclick = () => { perspective = +b.dataset.p; applyLayout(); renderSnap(curStep); };
  });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (curStep > 0) renderSnap(curStep - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (curStep < snaps.length - 1) renderSnap(curStep + 1); }
    else if (['1','2','3','4'].includes(e.key)) { perspective = +e.key - 1; applyLayout(); renderSnap(curStep); }
  });

  applyLayout();
  loadDemo();
</script>
</body>
</html>
