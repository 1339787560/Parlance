<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四川麻将复盘器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #0e2418; color: #eee; user-select: none; }

    /* 悬浮工具栏 (含视角) */
    .svc-bar {
      position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 200;
      display: flex; gap: 6px; align-items: center; flex-wrap: nowrap;
      background: rgba(20,40,30,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 6px 20px rgba(0,0,0,.4); max-width: calc(100vw - 16px); font-size: 12px;
    }
    .svc-bar button { padding: 4px 10px; background: #2a5a3a; color: #eee; border: 1px solid #3a7a5a; border-radius: 999px; cursor: pointer; font-size: 12px; white-space: nowrap; }
    .svc-bar button:hover { background: #3a7a5a; }
    .svc-bar button.primary { background: #c8332e; border-color: #e8433e; }
    .svc-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); }
    .svc-bar .pill { color: #fc6; background: rgba(252,192,80,.12); padding: 3px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; }
    .persp-btns { display: flex; gap: 3px; }
    .persp-btns button { width: 22px; height: 22px; padding: 0; font-size: 11px; border-radius: 4px; }
    .persp-btns button.active { background: #c8332e; border-color: #e8433e; }

    .app { display: flex; flex-direction: column; height: 100vh; padding-top: 42px; padding-bottom: 8px; }
    .meta { position: fixed; top: 4px; left: 10px; z-index: 150; padding: 4px 10px; background: rgba(20,40,30,.78); border: 1px solid rgba(255,255,255,.06); border-radius: 6px; font-size: 11px; color: #8aa; max-width: 42vw; }
    .meta b { color: #ffe; }

    /* 桌面: 左右列占满 3 行 (含四角), 中列 top/center/bottom */
    .table {
      flex: 1 1 auto; min-height: 0; position: relative;
      display: grid;
      grid-template-areas: "left top right" "left center right" "left bottom right";
      grid-template-columns: minmax(108px, 0.6fr) 2.8fr minmax(108px, 0.6fr);
      grid-template-rows: auto 1fr auto;
      gap: 1px; padding: 2px;
    }
    .chair { background: rgba(255,255,255,.04); border-radius: 8px; padding: 4px 4px; min-width: 0; position: relative; display: flex; flex-direction: column; }
    .chair.pos-top { grid-area: top; } .chair.pos-bottom { grid-area: bottom; }
    .chair.pos-left { grid-area: left; } .chair.pos-right { grid-area: right; }
    .chair.pos-left, .chair.pos-right { justify-content: space-between; }
    .chair.active { outline: 2px solid #fc6; }

    .player-info { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 12px; flex-wrap: wrap; }
    .name { font-weight: bold; color: #ffe; }
    .uid { color: #6a8a7a; font-size: 10px; }
    .que-chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10px; background: #3a2a1a; color: #fc6; }
    .que-chip.W { background: #1a3a5a; color: #9cf; }
    .que-chip.T { background: #1a5a3a; color: #9f9; }
    .que-chip.D { background: #5a1a1a; color: #f99; }
    .que-chip.pulse { animation: pulse .6s ease-out 2; }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
    .deposit { margin-left: auto; font-size: 20px; font-weight: bold; font-family: Consolas, monospace; display: none; }
    .deposit.show { display: inline-block; }
    .deposit.pos { color: #fc6; text-shadow: 0 0 8px rgba(252,192,80,.5); }
    .deposit.neg { color: #6cf; text-shadow: 0 0 8px rgba(108,192,255,.5); }
    .deposit.zero { color: #6a8a7a; font-size: 14px; }

    /* 玩家牌区: 碰杠(左) | 手牌(右对齐 gap0) | 抓牌(右 半张间隔 1张) 同行; 胡牌另起 */
    .play-row { display: flex; align-items: center; gap: 0; margin: 2px 0; flex-wrap: nowrap; min-height: 48px; }
    .meld-area { display: flex; flex-wrap: nowrap; gap: 0; align-items: center; justify-content: flex-start; }
    .meld-group { display: flex; gap: 0; padding: 1px 3px; background: rgba(255,255,255,.06); border-radius: 3px; margin-right: 5px; }
    .hand-area { display: flex; flex-wrap: nowrap; gap: 0; align-items: center; justify-content: flex-end; flex: 1; min-width: 0; }
    .catch-area { display: flex; align-items: center; justify-content: flex-end; margin-left: 14px; min-width: 30px; }
    .hu-area { display: flex; flex-wrap: wrap; gap: 1px; align-items: center; width: 100%; margin-top: 4px; min-height: 0; }
    /* 左右玩家: 手牌横向 (与上下方位一致), 胡牌在手牌下方另起 */

    /* 中心: 墙余 + 4 弃牌区沿方位 */
    .center {
      grid-area: center; min-width: 0; min-height: 0;
      display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto 1fr auto;
      gap: 1px; align-items: center; justify-items: stretch; padding: 2px;
    }
    .disc { background: transparent; padding: 2px; min-height: 30px; opacity: .5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; transition: opacity .2s; }
    .disc-row { display: flex; gap: 0; justify-content: center; }
    .disc.exchange-zone { background: rgba(252,192,80,.1); box-shadow: 0 0 0 1px rgba(252,192,80,.3); }
    .disc.pos-top { grid-column: 2; grid-row: 1; }
    .disc.pos-left { grid-column: 1; grid-row: 2; }
    .disc.pos-right { grid-column: 3; grid-row: 2; }
    .disc.pos-bottom { grid-column: 2; grid-row: 3; }
    .wall-box { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; max-width: 240px; justify-self: center; }
    .wall { padding: 6px 14px; background: linear-gradient(180deg,#3a5a3a,#2a4a2a); border-radius: 8px; color: #ffe; font-size: 12px; border: 1px solid #4a6a4a; min-width: 84px; text-align: center; }
    .wall .num { color: #fc6; font-size: 16px; font-weight: bold; }
    .exchange { font-size: 10px; color: #fc6; max-width: 220px; text-align: center; line-height: 1.5; }
    .phase-tag { background: #c8332e; color: #fff; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: bold; }
    .direction { font-size: 22px; color: #fc6; line-height: 1; }

    /* 牌面 sprite (无入场动画, 单步不抖; catch/throw 高亮) */
    .tile { display: inline-block; background-image: url(/recorder/mj_color0.png); background-repeat: no-repeat; vertical-align: middle; margin-right: 1px; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.25); }
    .tile.catch-hl { box-shadow: 0 0 0 3px #fc6, 0 0 14px rgba(252,192,80,.9); border-radius: 4px; }
    .tile.throw-hl { box-shadow: 0 0 0 3px #f66, 0 0 12px rgba(255,80,80,.8); border-radius: 4px; }
    .tile.back { width: 40px; height: 56px; margin-right: 2px; border-radius: 4px; background: linear-gradient(135deg, #5a1a2a 0%, #8a2a3a 50%, #5a1a2a 100%); border: 1px solid #a9445a; box-shadow: 0 1px 2px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2); position: relative; }
    .tile.back::after { content: "🀄"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; opacity: .5; }
    .tile.sm.back { width: 24px; height: 34px; }
    .tile.sm.back::after { font-size: 14px; }
    /* 左右弃牌: 统一横排左到右 (与上下方位一致), 不旋转 */
    .disc.pos-left, .disc.pos-right { flex-direction: column; }

    /* 对局日志: 高层级浮动窗 (折叠/展开均浮在牌桌上方) */
    .log-panel { position: fixed; bottom: 10px; right: 10px; z-index: 250; width: 380px; max-width: 50vw; background: rgba(10,26,18,.96); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.6); backdrop-filter: blur(8px); }
    .log-panel summary { padding: 6px 12px; cursor: pointer; font-size: 12px; color: #9ab; list-style: none; display: flex; align-items: center; gap: 8px; }
    .log-panel summary::-webkit-details-marker { display: none; }
    .log-panel summary::before { content: "▶"; font-size: 10px; transition: transform .15s; }
    .log-panel[open] summary::before { transform: rotate(90deg); }
    .log-panel[open] summary { border-bottom: 1px solid rgba(255,255,255,.05); }
    .steps { padding: 5px 16px; max-height: 24vh; overflow: auto; font-family: Consolas, monospace; font-size: 11px; }
    .step { padding: 1px 6px; cursor: pointer; border-radius: 2px; white-space: pre; }
    .step:hover { background: rgba(255,255,255,.08); }
    .step.active { background: #3a5a4a; }
    .step.phase { color: #fc6; font-weight: bold; }
    .step .t { color: #6a8a7a; } .step .ty { color: #fc6; } .step .body { color: #ddd; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 300; backdrop-filter: blur(4px); }
    .modal.hidden { display: none; }
    .modal-content { background: #1a3a2a; padding: 16px 20px; border-radius: 12px; max-width: 560px; width: 90%; max-height: 70vh; overflow: auto; border: 1px solid #3a5a4a; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
    .modal-content h3 { margin: 0 0 12px; color: #fc6; font-size: 14px; }
    .round-item { padding: 8px 12px; cursor: pointer; border-radius: 6px; font-size: 12px; color: #ddd; display: flex; gap: 12px; align-items: center; }
    .round-item:hover { background: rgba(255,255,255,.08); }
    .round-item.active { background: #3a5a4a; color: #ffe; }
    .round-item .ri-no { color: #fc6; font-weight: bold; min-width: 36px; }
    .modal-close { float: right; cursor: pointer; color: #9ab; font-size: 16px; }
  </style>
</head>
<body>

  <div class="svc-bar">
    <button id="btn-rounds" class="pill">对局 -/-</button>
    <span class="sep"></span>
    <button id="btn-list">列 record</button>
    <span class="sep"></span>
    <button id="btn-reset">⏮</button>
    <button id="btn-prev">◀</button>
    <span class="pill" id="step-info">步 -/-</span>
    <button id="btn-next">▶</button>
    <span class="sep"></span>
    <span class="persp-btns" id="persp-btns" title="视角 (底位玩家)">
      <button data-p="0">0</button><button data-p="1">1</button><button data-p="2">2</button><button data-p="3">3</button>
    </span>
    <span class="sep"></span>
    <button id="btn-demo" class="primary">加载 demo</button>
  </div>

  <div class="app">
    <div class="meta" id="meta">未加载</div>

    <div class="table">
      <div class="chair" data-chair="0"><div class="player-info"><span class="name">玩家0</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span><span class="deposit" data-deposit>0</span></div><div class="play-row"><div class="meld-area"></div><div class="hand-area"></div><div class="catch-area"></div></div><div class="hu-area"></div></div>
      <div class="chair" data-chair="1"><div class="player-info"><span class="name">玩家1</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span><span class="deposit" data-deposit>0</span></div><div class="play-row"><div class="meld-area"></div><div class="hand-area"></div><div class="catch-area"></div></div><div class="hu-area"></div></div>
      <div class="chair" data-chair="2"><div class="player-info"><span class="name">玩家2</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span><span class="deposit" data-deposit>0</span></div><div class="play-row"><div class="meld-area"></div><div class="hand-area"></div><div class="catch-area"></div></div><div class="hu-area"></div></div>
      <div class="chair" data-chair="3"><div class="player-info"><span class="name">玩家3</span><span class="uid"></span><span class="que-chip" data-que>缺 -</span><span class="deposit" data-deposit>0</span></div><div class="play-row"><div class="meld-area"></div><div class="hand-area"></div><div class="catch-area"></div></div><div class="hu-area"></div></div>

      <div class="center">
        <div class="disc" data-disc="0"></div>
        <div class="disc" data-disc="1"></div>
        <div class="disc" data-disc="2"></div>
        <div class="disc" data-disc="3"></div>
        <div class="wall-box">
          <div class="phase-tag" id="phase-tag" style="display:none">换三张</div>
          <div class="direction" id="direction" style="display:none">↻</div>
          <div class="wall">墙余 <span class="num" id="wall-num">-</span></div>
          <div class="exchange" id="exchange"></div>
        </div>
      </div>
    </div>

    <details class="log-panel">
      <summary>对局日志（点击展开，全量消息）</summary>
      <div class="steps" id="step-list"></div>
    </details>
  </div>

  <div class="modal hidden" id="rounds-modal">
    <div class="modal-content">
      <span class="modal-close" id="modal-close">×</span>
      <h3>选择对局（时间 / 房间 / 桌 / RoomID）</h3>
      <div id="rounds-list"></div>
    </div>
  </div>

<script>
  const rec = { header: {}, rounds: [] };
  let curRound = 0, curStep = -1, listBuilt = false, perspective = 0, prevQue = ['','','',''];
  const STORE_KEY = 'recorder_state_v1';

  const ROWS_Y = [8, 153, 301, 448, 590, 745];
  const ROWS_H = [133, 136, 131, 132, 137, 120];
  const COLS_X = [6, 118, 237, 346, 465, 576, 687, 805, 916];
  const COLS_W = [102, 104, 96, 101, 94, 101, 103, 99, 102];
  const SUIT_ROW = { W: 0, T: 1, D: 2 };
  const ZHONG = { row: 3, col: 4 };
  const QUE_NAME = { W: '万', T: '条', D: '筒' };
  const SUIT_ORDER = { F: 0, W: 1, T: 2, D: 3 };

  function tileHtml(card, sm, extraCls = '') {
    const scale = sm ? 0.32 : 0.4;
    let row, col;
    if (card[1] === 'F') { row = ZHONG.row; col = ZHONG.col; }
    else { row = SUIT_ROW[card[1]]; col = (+card[0]) - 1; }
    const x = COLS_X[col], y = ROWS_Y[row], w = COLS_W[col], h = ROWS_H[row];
    const bg = 1024 * scale;
    return `<span class="tile${sm?' sm':''}${extraCls?' '+extraCls:''}" style="width:${(w*scale).toFixed(0)}px;height:${(h*scale).toFixed(0)}px;background-size:${bg.toFixed(0)}px ${bg.toFixed(0)}px;background-position:-${(x*scale).toFixed(0)}px -${(y*scale).toFixed(0)}px"></span>`;
  }
  function backHtml(sm) { return `<span class="tile${sm?' sm':''} back"></span>`; }
  // 弃牌按 5/7/9/11/13/15 等差行错落排布
  function renderDiscRows(cards, throwHl) {
    const rowSizes = [5, 7, 9, 11, 13, 15];
    let html = '', idx = 0;
    for (const n of rowSizes) {
      if (idx >= cards.length) break;
      const slice = cards.slice(idx, idx + n);
      idx += n;
      html += `<div class="disc-row">${slice.map(t => tileHtml(t, true, t === throwHl ? 'throw-hl' : '')).join('')}</div>`;
    }
    return html;
  }
  function chunks(s) { const a = []; for (let i = 0; i + 1 < s.length; i += 2) a.push(s.slice(i, i + 2)); return a; }
  function sortHand(a, b) {
    const sa = SUIT_ORDER[a[1]], sb = SUIT_ORDER[b[1]];
    if (sa !== sb) return sa - sb;
    return (+a[0]) - (+b[0]);
  }
  function parseTimeToSec(t) { const [h,m,s] = t.split(':').map(Number); return h*3600+m*60+s; }
  function pad(n) { return String(n).padStart(2,'0'); }
  function fmtTime(unixTs, offset=0) {
    if (!unixTs) return '-';
    const d = new Date((unixTs + offset) * 1000);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  function parseRecord(txt) {
    const lines = txt.split(/\r?\n/);
    const header = {}, events = [];
    for (const line of lines) {
      if (!line.trim()) continue;
      const m = line.match(/^(\d{2}:\d{2}:\d{2})\s+(\S+)\s*(.*)$/);
      if (m) { events.push({ time: m[1], type: m[2], rest: m[3].trim() }); continue; }
      const hm = line.match(/^(\w+)\s+(.*)$/);
      if (!hm) continue;
      const k = hm[1], v = hm[2];
      if (k === 'ChairNO' || k === 'Name' || k === 'Win_Loss_StandOff') {
        const ci = parseInt(v.split(/\s+/)[0], 10);
        if (!Number.isNaN(ci)) (header[k] = header[k] || [])[ci] = v;
      } else header[k] = v;
    }
    rec.header = header;
    rec.rounds = splitRounds(events);
    curRound = 0;
  }

  function splitRounds(events) {
    const rounds = []; let cur = null;
    for (const ev of events) {
      if (ev.type === 'Cards') { cur = { events: [], startSec: parseTimeToSec(ev.time), snaps: [] }; rounds.push(cur); }
      if (cur) cur.events.push(ev);
    }
    if (!rounds.length && events.length) rounds.push({ events, startSec: 0, snaps: [] });
    for (const r of rounds) buildSnapshots(r);
    return rounds;
  }

  function snapOf(hands, que, discards, melds, hu, exchanges, wall, deposit, depositInit, extra = {}) {
    return { hands: hands.map(a=>a.slice()), que: que.slice(), discards: discards.map(a=>a.slice()),
      melds: melds.map(a=>a.slice()), hu: hu.map(a=>a.slice()), exchanges: exchanges.slice(),
      wall, deposit: deposit.slice(), depositInit: depositInit.slice(), ...extra };
  }
  const sumLen = a => a.reduce((s,x)=>s+x.length, 0);

  function buildSnapshots(round) {
    const hands = [[],[],[],[]], que = ['','','',''], discards=[[],[],[],[]], melds=[[],[],[],[]], hu=[[],[],[],[]], exchanges = [];
    const deposit = [null,null,null,null], depositInit = [null,null,null,null];
    const TOTAL = 114;
    const evs = round.events, n = evs.length;
    const wallNow = () => TOTAL - sumLen(hands) - sumLen(discards) - sumLen(melds) - sumLen(hu);
    const S = (extra = {}) => snapOf(hands, que, discards, melds, hu, exchanges, wallNow(), deposit, depositInit, extra);
    round.snaps.length = 0;
    round.snaps.push(S());
    const isSettle = tp => tp === 'ScoreDiff' || tp === 'DepositDiff' || tp === 'RawScoreDiff' || tp === 'RawDepositDiff';
    let i = 0;
    while (i < n) {
      const ev = evs[i], t = ev.type;
      if (t.startsWith('Raw')) { i++; continue; }
      if (t === 'Cards') {
        while (i < n) {
          const et = evs[i].type;
          if (et === 'Deal') { const pp = evs[i].rest.split(/\s+/); const cc = parseInt(pp[0],10); if (cc>=0&&cc<4) hands[cc] = chunks(pp[1]||''); }
          else if (et==='Exchange'||et==='Que'||et==='Throw'||et==='Catch'||isSettle(et)) break;
          i++;
        }
        round.snaps.push(S({ phase: '发牌' })); continue;
      }
      if (t === 'Exchange') {
        const recv = {};
        while (i < n && (evs[i].type==='Exchange'||evs[i].type==='RawExchange')) {
          if (evs[i].type==='Exchange') { const pp = evs[i].rest.split(/\s+/); recv[pp[0]] = { from: pp[1], cards: chunks(pp[2]||'') }; }
          i++;
        }
        let dir = ''; const rs = Object.keys(recv);
        if (rs.length) { const diff = (+recv[rs[0]].from - +rs[0] + 4) % 4; dir = diff===1?'↻ 顺时针':diff===3?'↺ 逆时针':'换'; }
        round.snaps.push(S({ phase: '换三张·亮牌', recv, dir }));
        for (const r in recv) for (const c of recv[r].cards) { const idx = hands[recv[r].from].indexOf(c); if (idx>=0) hands[recv[r].from].splice(idx,1); }
        for (const r in recv) hands[r].push(...recv[r].cards);
        for (const r in recv) exchanges.push({ receiver: r, from: recv[r].from, cards: recv[r].cards.slice() });
        round.snaps.push(S({ phase: '换三张·入牌', recv, dir }));
        continue;
      }
      if (t === 'Que') {
        while (i < n && (evs[i].type==='Que'||evs[i].type==='RawQue')) {
          if (evs[i].type==='Que') { const pp = evs[i].rest.split(/\s+/); que[+pp[0]] = pp[1]||''; }
          i++;
        }
        round.snaps.push(S({ phase: '定缺' })); continue;
      }
      if (t === 'ScoreDiff' || t === 'DepositDiff') {
        while (i < n && isSettle(evs[i].type)) {
          if (evs[i].type==='DepositDiff') { const pp = evs[i].rest.split(/\s+/); const cc=+pp[0], val=+pp[1]; if (depositInit[cc]===null) depositInit[cc]=val; deposit[cc]=val; }
          i++;
        }
        round.snaps.push(S({ phase: '结算' })); continue;
      }
      const p = ev.rest.split(/\s+/);
      const c = p[0] !== '' ? parseInt(p[0], 10) : NaN;
      if (t === 'Throw') { if (c>=0&&c<4) { const idx = hands[c].indexOf(p[1]); if (idx>=0) hands[c].splice(idx,1); discards[c].push(p[1]); } }
      else if (t === 'Catch') { if (c>=0&&c<4) hands[c].push(p[1]); }
      round.snaps.push(S({ ev, lastCatch: t==='Catch' ? { chair: c, card: p[1] } : null, lastThrow: t==='Throw' ? { chair: c, card: p[1] } : null }));
      i++;
    }
  }

  function curRoundObj() { return rec.rounds[curRound]; }
  function curSnaps() { return curRoundObj().snaps; }
  function posOf(chair) { return (chair - perspective + 4) % 4; }
  const POS_CLASS = ['pos-bottom', 'pos-left', 'pos-top', 'pos-right'];

  function applyLayout() {
    for (let c = 0; c < 4; c++) {
      const chair = document.querySelector(`.chair[data-chair="${c}"]`);
      chair.classList.remove(...POS_CLASS);
      chair.classList.add(POS_CLASS[posOf(c)]);
      const disc = document.querySelector(`.disc[data-disc="${c}"]`);
      disc.classList.remove(...POS_CLASS);
      disc.classList.add(POS_CLASS[posOf(c)]);
    }
    document.querySelectorAll('#persp-btns button').forEach(b => b.classList.toggle('active', +b.dataset.p === perspective));
  }

  function renderMeta() {
    const h = rec.header;
    (h.ChairNO || []).forEach((s, c) => { if (c>=4) return; const uid = s.split(/\s+/)[1]; const el = document.querySelector(`.chair[data-chair="${c}"] .uid`); if (el) el.textContent = uid ? `uid ${uid}` : ''; });
    document.getElementById('btn-rounds').textContent = rec.rounds.length ? `对局 ${curRound+1}/${rec.rounds.length}` : '对局 -/-';
  }

  function renderCurrentTime() {
    const ts = +rec.header.Timestamp || 0;
    const r = curRoundObj();
    const snap = curSnaps()[curStep];
    let offset = r ? r.startSec : 0;
    if (snap && snap.ev) offset += parseTimeToSec(snap.ev.time);
    const t = fmtTime(ts, offset);
    document.getElementById('meta').innerHTML = `房 <b>${rec.header.RoomID||'-'}</b> | 桌 <b>${rec.header.TableNO||'-'}</b> | 标志 <b>${rec.header.Flags||'-'}</b> | <b>${t}</b> | 局 <b>${curRound+1}/${rec.rounds.length}</b>`;
  }

  function setActiveStep(idx) {
    document.querySelectorAll('.step.active').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.step[data-snap="${idx}"]`);
    if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
    document.getElementById('step-info').textContent = `步 ${idx}/${curSnaps().length-1}`;
  }

  function renderSnap(idx) {
    const snaps = curSnaps();
    if (idx < 0 || idx >= snaps.length) return;
    if (!listBuilt) buildStepListOnce();
    curStep = idx;
    const s = snaps[idx];
    const vis = true;
    const isExchange = s.phase && s.phase.startsWith('换三张');
    const isResult = s.phase === '结算';

    // 抓牌/打牌高亮: 仅当本步 ev 是 Catch/Throw (非 phase)
    const catchInfo = s.ev && s.lastCatch ? s.lastCatch : null;
    const throwInfo = s.ev && s.lastThrow ? s.lastThrow : null;

    for (let c = 0; c < 4; c++) {
      const chair = document.querySelector(`.chair[data-chair="${c}"]`);
      const showHand = c === perspective || vis;
      // 抓牌分离: 本步 catch 的牌移到抓牌区, 手牌排除该牌
      let handCards = s.hands[c].slice().sort(sortHand);
      let catchCard = null;
      if (catchInfo && catchInfo.chair === c) {
        catchCard = catchInfo.card;
        const idx = handCards.indexOf(catchCard);
        if (idx >= 0) handCards.splice(idx, 1);
      }
      chair.querySelector('.hand-area').innerHTML = showHand ? handCards.map(t => tileHtml(t, false)).join('') : handCards.map(() => backHtml(false)).join('');
      chair.querySelector('.catch-area').innerHTML = (showHand && catchCard) ? tileHtml(catchCard, false, 'catch-hl') : '';

      const chip = chair.querySelector('.que-chip');
      const q = s.que[c];
      chip.textContent = q ? `缺 ${QUE_NAME[q]}` : '缺 -';
      chip.className = 'que-chip' + (q ? ' '+q : '');
      if (prevQue[c] !== q && q) { chip.classList.add('pulse'); setTimeout(() => chip.classList.remove('pulse'), 1200); }
      prevQue[c] = q;

      const depEl = chair.querySelector('.deposit');
      if (isResult) {
        const init = s.depositInit[c], cur = s.deposit[c];
        if (init !== null && cur !== null) { const delta = cur - init; depEl.textContent = (delta>0?'+':'')+delta; depEl.className = 'deposit show ' + (delta>0?'pos':delta<0?'neg':'zero'); }
        else { depEl.textContent='0'; depEl.className='deposit show zero'; }
      } else depEl.className = 'deposit';

      // 胡牌区 (前方 = player-info 下, 手牌上)
      const huEl = chair.querySelector('.hu-area');
      huEl.innerHTML = (s.hu[c] || []).map(t => tileHtml(t, false)).join('');
    }

    // 弃牌区: 末张 throw 高亮
    for (let c = 0; c < 4; c++) {
      const dz = document.querySelector(`.disc[data-disc="${c}"]`);
      if (isExchange && s.recv) {
        dz.classList.add('exchange-zone');
        let cards = null;
        if (s.phase.endsWith('亮牌')) { for (const r in s.recv) if (s.recv[r].from == String(c)) { cards = s.recv[r].cards; break; } }
        else { if (s.recv[c]) cards = s.recv[c].cards; }
        dz.innerHTML = cards ? cards.map(t => tileHtml(t, true)).join('') : '';
      } else {
        dz.classList.remove('exchange-zone');
        const ds = s.discards[c];
        const throwHl = throwInfo && throwInfo.chair === c ? throwInfo.card : null;
        dz.innerHTML = renderDiscRows(ds, throwHl);
      }
    }

    document.getElementById('wall-num').textContent = s.wall;
    const exEl = document.getElementById('exchange');
    const dirEl = document.getElementById('direction');
    if (isExchange) {
      dirEl.style.display = ''; dirEl.textContent = (s.dir || '').split(' ')[0] || '换';
      exEl.innerHTML = (s.dir||'') + '<br>' + Object.entries(s.recv).map(([r,g]) => `${r}←${g.from}: ${g.cards.map(c=>c[1]==='F'?'中':c).join('')}`).join(' / ');
    } else { dirEl.style.display = 'none'; exEl.innerHTML = ''; }

    const phaseTag = document.getElementById('phase-tag');
    if (s.phase) { phaseTag.style.display = ''; phaseTag.textContent = s.phase; } else phaseTag.style.display = 'none';

    setActiveStep(idx);
    renderCurrentTime();
    saveState();
  }

  function buildStepListOnce() {
    if (listBuilt) return;
    const list = document.getElementById('step-list');
    const snaps = curSnaps();
    let html = '';
    for (let i = 0; i < snaps.length; i++) {
      const s = snaps[i];
      if (s.phase) html += `<div class="step phase" data-snap="${i}">★ ${s.phase}</div>`;
      else if (s.ev) {
        const ev = s.ev, esc = ev.rest.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'})[m]);
        html += `<div class="step" data-snap="${i}"><span class="t">${ev.time}</span> <span class="ty">${ev.type.padEnd(8)}</span> <span class="body">${esc}</span></div>`;
      }
    }
    list.innerHTML = html;
    list.querySelectorAll('.step').forEach(el => el.addEventListener('click', () => renderSnap(parseInt(el.dataset.snap, 10))));
    listBuilt = true;
  }

  function setRound(i) {
    if (i < 0 || i >= rec.rounds.length) return;
    curRound = i; listBuilt = false; prevQue = ['','','',''];
    renderMeta(); renderRoundsList();
    renderSnap(curSnaps().length - 1);
  }

  function renderRoundsList() {
    const list = document.getElementById('rounds-list');
    const ts = +rec.header.Timestamp || 0;
    const rid = rec.header.RoomID || '-', tno = rec.header.TableNO || '-';
    list.innerHTML = rec.rounds.map((r, i) => `<div class="round-item${i===curRound?' active':''}" data-round="${i}"><span class="ri-no">局 ${i+1}</span><span>${fmtTime(ts, r.startSec)}</span><span>房 ${rid}</span><span>桌 ${tno}</span></div>`).join('');
    list.querySelectorAll('.round-item').forEach(el => el.onclick = () => { document.getElementById('rounds-modal').classList.add('hidden'); setRound(+el.dataset.round); });
  }

  function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ curRound, curStep, perspective })); } catch {} }
  function restoreState() {
    let s = {}; try { s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch {}
    if (s.perspective !== undefined) { perspective = s.perspective; applyLayout(); }
    if (s.curRound !== undefined && s.curRound < rec.rounds.length) curRound = s.curRound;
    listBuilt = false; prevQue = ['','','',''];
    renderMeta(); renderRoundsList();
    const snaps = curSnaps();
    const target = (s.curStep !== undefined && s.curStep >= 0 && s.curStep < snaps.length) ? s.curStep : snaps.length - 1;
    renderSnap(target);
  }

  async function loadDemo() {
    try { const txt = await fetch('/recorder/demo').then(r => r.text()); parseRecord(txt); restoreState(); }
    catch (e) { document.getElementById('meta').textContent = '加载失败: ' + e; }
  }

  document.getElementById('btn-prev').onclick = () => { if (curStep > 0) renderSnap(curStep - 1); };
  document.getElementById('btn-next').onclick = () => { if (curStep < curSnaps().length - 1) renderSnap(curStep + 1); };
  document.getElementById('btn-reset').onclick = () => renderSnap(0);
  document.getElementById('btn-demo').onclick = () => loadDemo();
  document.getElementById('btn-rounds').onclick = () => { renderRoundsList(); document.getElementById('rounds-modal').classList.remove('hidden'); };
  document.getElementById('modal-close').onclick = () => document.getElementById('rounds-modal').classList.add('hidden');
  document.getElementById('rounds-modal').onclick = (e) => { if (e.target.id === 'rounds-modal') e.currentTarget.classList.add('hidden'); };
  document.querySelectorAll('#persp-btns button').forEach(b => b.onclick = () => { perspective = +b.dataset.p; applyLayout(); renderSnap(curStep); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (curStep > 0) renderSnap(curStep - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (curStep < curSnaps().length - 1) renderSnap(curStep + 1); }
    else if (['1','2','3','4'].includes(e.key)) { perspective = +e.key - 1; applyLayout(); renderSnap(curStep); }
  });

  applyLayout();
  loadDemo();
</script>
</body>
</html>
