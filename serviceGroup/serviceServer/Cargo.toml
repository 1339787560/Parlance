[package]
name = "service-server"
version = "0.1.0"
edition = "2021"
description = "Rust 重写 serviceServer: 服务管理 + 配置编辑 (迁入 infoServer 服务组)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false }

[dev-dependencies]
tempfile = "3"
rstest = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Services"] }
