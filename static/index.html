<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LAN InfoShare · 兰亭信传</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Chinese Classical Design System ────────────────────────────────── */
  :root {
    --cn-paper:       #F4E8D3;   /* 宣纸黄 — page background */
    --cn-bubble:      #FDFBF7;   /* 信笺白 — message bubble */
    --cn-ink:         #2C251F;   /* 浓墨 — primary text */
    --cn-ink-light:   #5C4B3C;   /* 淡墨 — secondary text */
    --cn-ink-faint:   #8B7355;   /* 枯木褐 — borders, subtle text */
    --cn-red:         #B32A26;   /* 朱砂红 — primary accent */
    --cn-red-hover:   #8A1F1B;   /* 朱砂深 — hover state */
    --cn-red-light:   rgba(179, 42, 38, 0.08); /* 朱砂晕 — tint */
    --cn-gold:        #C39A5B;   /* 暗金 — decorative accents */
    --cn-wood:        #D4C4A9;   /* 檀木色 — soft borders */
    --cn-overlay:     rgba(44, 37, 31, 0.5); /* 墨色遮罩 */
  }

  html, body {
    height: 100%;
    font-family: 'Kaiti SC', 'STKaiti', 'AR PL UKai CN', 'KaiTi', 'Noto Serif SC', 'Source Han Serif SC', serif;
    background: var(--cn-paper);
    color: var(--cn-ink);
    letter-spacing: 0.8px;
    line-height: 1.8;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    display: flex; flex-direction: column;
    max-width: 1600px; width: 92%; margin: 0 auto;
    /* Subtle paper texture via CSS */
    background-image:
      repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        color-mix(in srgb, var(--cn-ink-faint) 5%, transparent) 3px,
        color-mix(in srgb, var(--cn-ink-faint) 5%, transparent) 4px
      ),
      repeating-linear-gradient(
        90deg, transparent, transparent 3px,
        color-mix(in srgb, var(--cn-ink-faint) 3%, transparent) 3px,
        color-mix(in srgb, var(--cn-ink-faint) 3%, transparent) 4px
      ),
      linear-gradient(180deg, var(--cn-paper), color-mix(in srgb, var(--cn-paper) 85%, var(--cn-ink) 2%));
  }

  /* ── Header: 牌匾风格 ────────────────────────────────────────────────── */
  .header {
    padding: 14px 20px;
    background: linear-gradient(135deg, var(--cn-paper) 0%, color-mix(in srgb, var(--cn-paper) 90%, var(--cn-ink) 5%) 100%);
    border-bottom: 3px solid var(--cn-red);
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--cn-ink) 10%, transparent);
  }
  .header h1 {
    font-size: 20px; font-weight: 400; letter-spacing: 4px; flex: 1;
    color: var(--cn-ink); text-shadow: 1px 1px 0 rgba(195, 154, 91, 0.15);
  }
  .server-url {
    font-size: 12px; color: var(--cn-ink-light);
    letter-spacing: 1px;
  }
  .sse-status {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    border: 1px solid var(--cn-ink-faint);
  }
  .sse-status.connected {
    background: #4a7c59; border-color: #3a6a49;
    box-shadow: 0 0 6px rgba(74, 124, 89, 0.3);
  }
  .sse-status.disconnected {
    background: var(--cn-red); border-color: var(--cn-red-hover);
  }

  /* ── Messages area ───────────────────────────────────────────────────── */
  .msg-area {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg-area:empty::after {
    content: '暂无消息，发送第一条吧';
    color: var(--cn-ink-faint); text-align: center;
    padding: 60px 20px; font-size: 15px;
    letter-spacing: 2px;
  }

  /* ── Message bubble: 信笺 ─────────────────────────────────────────────── */
  .msg {
    max-width: 75%;
    padding: 18px 24px;
    background: var(--cn-bubble);
    border: 1px solid var(--cn-wood);
    border-radius: 3px;
    position: relative;
    line-height: 1.8;
    box-shadow: 1px 2px 4px rgba(92, 75, 60, 0.06);
    transition: box-shadow 0.2s;
  }
  .msg:hover { box-shadow: 2px 3px 8px color-mix(in srgb, var(--cn-ink) 15%, transparent); }
  .msg.self {
    align-self: flex-end;
    border-left: 3px solid var(--cn-red);
    background: linear-gradient(135deg, var(--cn-bubble), color-mix(in srgb, var(--cn-bubble) 90%, var(--cn-paper) 20%));
  }
  .msg.other {
    align-self: flex-start;
    border-left: 3px solid var(--cn-gold);
  }

  .msg-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 8px;
  }

  /* 朱文印章 — IP badge */
  .msg-ip {
    font-family: 'SimSun', 'Songti SC', 'Noto Serif SC', serif;
    font-size: 13px; font-weight: 500; letter-spacing: 1px;
    color: var(--cn-red);
    border: 1px solid var(--cn-red);
    padding: 2px 10px;
    border-radius: 2px;
    display: inline-block;
  }

  .msg-time {
    font-size: 13px; color: var(--cn-ink-faint); white-space: nowrap;
    letter-spacing: 0.5px;
  }

  .msg-content {
    font-size: 20px; word-break: break-word; white-space: pre-wrap;
    color: var(--cn-ink);
    line-height: 1.9;
  }

  /* ── File message ────────────────────────────────────────────────────── */
  .msg-file {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 0; flex-wrap: wrap;
  }
  .msg-file-icon {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--cn-wood);
    border-radius: 3px;
    background: rgba(212, 196, 169, 0.15);
    color: var(--cn-red);
  }
  .msg-file-info { flex: 1; min-width: 0; }
  .msg-file-name { font-size: 16px; font-weight: 500; word-break: break-all; }
  .msg-file-size { font-size: 13px; color: var(--cn-ink-light); margin-top: 2px; }

  .btn-download {
    padding: 6px 20px;
    border: 1px solid var(--cn-red);
    background: transparent; color: var(--cn-red);
    cursor: pointer; font-size: 14px; letter-spacing: 1px;
    border-radius: 2px;
    font-family: inherit;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .btn-download:hover {
    background: var(--cn-red); color: var(--cn-bubble);
  }

  /* ── Input area ──────────────────────────────────────────────────────── */
  .input-area {
    padding: 12px 16px;
    background: linear-gradient(0deg, color-mix(in srgb, var(--cn-paper) 90%, var(--cn-ink) 5%), var(--cn-paper));
    border-top: 1px solid var(--cn-wood);
    display: flex; gap: 10px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1;
    background: var(--cn-bubble);
    border: 1px solid var(--cn-wood);
    border-radius: 3px;
    padding: 12px 16px;
    color: var(--cn-ink);
    font-size: 16px; font-family: inherit; letter-spacing: 0.5px;
    resize: none; min-height: 48px; max-height: 140px; outline: none;
    line-height: 1.7;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-area textarea:focus {
    border-color: var(--cn-gold);
    box-shadow: 0 0 0 2px rgba(195, 154, 91, 0.15);
  }
  .input-area textarea::placeholder { color: var(--cn-ink-faint); }

  .input-actions { display: flex; gap: 6px; }

  .btn-icon {
    width: 40px; height: 40px;
    border: 1px solid var(--cn-wood);
    background: var(--cn-bubble);
    color: var(--cn-ink-light);
    cursor: pointer;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
  }
  .btn-icon:hover {
    border-color: var(--cn-red);
    color: var(--cn-red);
    background: var(--cn-red-light);
  }
  .btn-icon svg { width: 20px; height: 20px; }

  /* 朱砂印章 — send button */
  .btn-send {
    padding: 0 24px; height: 40px;
    border: none;
    background: var(--cn-red);
    color: var(--cn-bubble);
    cursor: pointer;
    font-size: 15px; font-family: inherit; letter-spacing: 3px;
    border-radius: 2px;
    transition: background 0.25s, box-shadow 0.25s;
    box-shadow: 1px 2px 4px rgba(179, 42, 38, 0.2);
  }
  .btn-send:hover {
    background: var(--cn-red-hover);
    box-shadow: 2px 3px 6px rgba(179, 42, 38, 0.3);
  }

  /* ── Zip modal ───────────────────────────────────────────────────────── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: var(--cn-overlay); z-index: 100;
    align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--cn-bubble);
    border: 1px solid var(--cn-wood);
    border-radius: 4px;
    padding: 28px; width: 90%; max-width: 480px; max-height: 80vh; overflow-y: auto;
    box-shadow: 4px 6px 20px rgba(44, 37, 31, 0.15);
  }
  .modal h2 {
    font-size: 18px; font-weight: 400; letter-spacing: 3px;
    color: var(--cn-ink); margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--cn-wood);
  }
  .modal input[type="text"] {
    width: 100%; padding: 10px 14px;
    border: 1px solid var(--cn-wood); border-radius: 3px;
    background: var(--cn-paper); color: var(--cn-ink);
    font-size: 14px; font-family: inherit; letter-spacing: 0.5px;
    outline: none; margin-bottom: 14px;
    transition: border-color 0.2s;
  }
  .modal input[type="text"]:focus { border-color: var(--cn-gold); }
  .modal input[type="text"]::placeholder { color: var(--cn-ink-faint); }

  .drop-zone {
    border: 1.5px dashed var(--cn-wood);
    border-radius: 3px; padding: 32px 20px;
    text-align: center; cursor: pointer;
    transition: all 0.3s; margin-bottom: 14px;
    background: rgba(212, 196, 169, 0.08);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--cn-red);
    background: var(--cn-red-light);
  }
  .drop-zone p { color: var(--cn-ink-faint); font-size: 14px; letter-spacing: 1px; }

  .file-list { margin-bottom: 14px; }
  .file-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--cn-paper);
    border: 1px solid var(--cn-wood);
    border-radius: 2px; margin-bottom: 4px; font-size: 13px;
  }
  .file-item .name { flex: 1; word-break: break-all; }
  .file-item .size { color: var(--cn-ink-light); font-size: 11px; white-space: nowrap; }
  .file-item .remove { cursor: pointer; color: var(--cn-red); font-size: 14px; }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 8px 22px;
    border-radius: 2px; border: none; cursor: pointer;
    font-size: 14px; font-family: inherit; letter-spacing: 1px;
    transition: all 0.2s;
  }
  .btn-cancel {
    background: transparent;
    color: var(--cn-ink-light);
    border: 1px solid var(--cn-wood) !important;
  }
  .btn-cancel:hover { border-color: var(--cn-ink-faint) !important; color: var(--cn-ink); }
  .btn-upload { background: var(--cn-red); color: var(--cn-bubble); }
  .btn-upload:hover { background: var(--cn-red-hover); }
  .btn-upload:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Toast ───────────────────────────────────────────────────────────── */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: var(--cn-ink);
    color: var(--cn-paper);
    padding: 10px 24px;
    border-radius: 2px;
    font-size: 13px; letter-spacing: 1px; font-family: inherit;
    z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ── Mobile ──────────────────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .msg { max-width: 92%; padding: 12px 14px; }
    .modal { width: 95%; padding: 20px; }
    .header h1 { font-size: 17px; letter-spacing: 2px; }
  }

  /* ── Classical scrollbar ─────────────────────────────────────────────── */
  .msg-area::-webkit-scrollbar { width: 5px; }
  .msg-area::-webkit-scrollbar-track { background: transparent; }
  .msg-area::-webkit-scrollbar-thumb {
    background: var(--cn-wood);
    border-radius: 2px;
  }
  .msg-area::-webkit-scrollbar-thumb:hover { background: var(--cn-ink-faint); }

  /* ── Date separator ──────────────────────────────────────────────────── */
  .date-sep {
    display: flex; align-items: center; gap: 16px;
    padding: 8px 0; align-self: center; width: 80%;
  }
  .date-sep::before, .date-sep::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--cn-wood), transparent);
  }
  .date-sep span {
    font-size: 11px; color: var(--cn-ink-faint);
    letter-spacing: 2px; white-space: nowrap;
    font-family: 'SimSun', 'Songti SC', serif;
  }

  /* ── Upload progress overlay ─────────────────────────────────────────── */
  .msg-file-progress {
    margin-top: 4px; height: 3px; border-radius: 1px;
    background: var(--cn-wood); overflow: hidden;
  }
  .msg-file-progress-bar {
    height: 100%; background: var(--cn-red);
  }

  /* ── Theme system ────────────────────────────────────────────────── */
  .theme-select {
    padding: 4px 8px;
    border: 1px solid var(--cn-wood);
    background: var(--cn-bubble);
    color: var(--cn-ink);
    cursor: pointer;
    border-radius: 3px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 0.5px;
    line-height: 1.4;
    outline: none;
  }
  .theme-select:hover,
  .theme-select:focus {
    border-color: var(--cn-red);
  }

  /* Default theme (clean/modern placeholder) */
  html[data-theme="default"] {
    --cn-paper:       #f5f5f5;
    --cn-bubble:      #ffffff;
    --cn-ink:         #1a1a1a;
    --cn-ink-light:   #555555;
    --cn-ink-faint:   #999999;
    --cn-red:         #1a73e8;
    --cn-red-hover:   #1557b0;
    --cn-red-light:   rgba(26, 115, 232, 0.08);
    --cn-gold:        #5f6368;
    --cn-wood:        #dadce0;
    --cn-overlay:     rgba(0, 0, 0, 0.4);
  }
  /* Red theme (classic Chinese) — matches the default variables */
  html[data-theme="red"] {
    --cn-paper:       #F4E8D3;
    --cn-bubble:      #FDFBF7;
    --cn-ink:         #2C251F;
    --cn-ink-light:   #5C4B3C;
    --cn-ink-faint:   #8B7355;
    --cn-red:         #B32A26;
    --cn-red-hover:   #8A1F1B;
    --cn-red-light:   rgba(179, 42, 38, 0.08);
    --cn-gold:        #C39A5B;
    --cn-wood:        #D4C4A9;
    --cn-overlay:     rgba(44, 37, 31, 0.5);
  }

  /* Kokomi theme (Sangonomiya Kokomi — 心海/珊瑚宫) */
  html[data-theme="kokomi"] {
    --cn-paper:       #E1F0FF;
    --cn-bubble:      rgba(255, 255, 255, 0.65);
    --cn-ink:         #2A4365;
    --cn-ink-light:   #718096;
    --cn-ink-faint:   #A0AEC0;
    --cn-red:         #F29CB2;
    --cn-red-hover:   #E0859E;
    --cn-red-light:   rgba(242, 156, 178, 0.15);
    --cn-gold:        #8CB9D6;
    --cn-wood:        rgba(255, 255, 255, 0.8);
    --cn-overlay:     rgba(42, 67, 101, 0.5);
  }

  /* ── Kokomi 主题专属样式（毛玻璃、圆角、渐变背景） ────────── */
  html[data-theme="kokomi"] {
    background-image:
      linear-gradient(135deg, rgba(225, 240, 255, 0.55), rgba(252, 232, 240, 0.55)),
      url('/style/kokomi/kokomi.png');
    background-size: cover;
    background-attachment: fixed;
  }
  html[data-theme="kokomi"] body {
    background: none;
    font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  html[data-theme="kokomi"] .header {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 2px 10px rgba(242, 156, 178, 0.1);
  }
  /* ── 心海聊天框配色：深海静谧 × 真珠泡影 ──────────────────── */

  /* [我方] 真珠泡影：天蓝→樱花紫渐变 + 珍珠光泽 */
  html[data-theme="kokomi"] .msg.self {
    background: linear-gradient(135deg, rgba(224, 242, 254, 0.85) 0%, rgba(245, 214, 235, 0.85) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 18px 18px 4px 18px;
    color: #2F2643;
    box-shadow:
      0 4px 12px rgba(177, 159, 251, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    position: relative;
  }
  /* 底部羽衣飘带：珊瑚紫→樱花粉渐变 */
  html[data-theme="kokomi"] .msg.self::after {
    content: "";
    position: absolute;
    bottom: -1px;
    right: 20px;
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, #B19FFB, #F5D6EB);
    border-radius: 0 0 4px 4px;
  }

  /* [对方] 深海静谧：深海蓝毛玻璃 + 水光银边 + 珊瑚紫荧光 */
  html[data-theme="kokomi"] .msg.other {
    background: rgba(16, 28, 48, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(220, 227, 236, 0.5);
    border-radius: 18px 18px 18px 4px;
    color: #E2E8F0;
    box-shadow:
      0 4px 15px rgba(142, 124, 195, 0.2),
      inset 0 0 10px rgba(142, 124, 195, 0.15);
    position: relative;
  }
  /* 顶部水流装饰线：银色→珊瑚紫渐变 */
  html[data-theme="kokomi"] .msg.other::before {
    content: "";
    position: absolute;
    top: 0;
    left: 20px;
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, #DCE3EC, #8E7CC3);
  }

  /* 我方气泡文本颜色 */
  html[data-theme="kokomi"] .msg.self .msg-content,
  html[data-theme="kokomi"] .msg.self .msg-header {
    color: #2F2643;
  }
  html[data-theme="kokomi"] .msg.self .msg-time {
    color: #9A8BAD;
  }
  html[data-theme="kokomi"] .msg.self .msg-file-name {
    color: #2F2643;
  }

  /* 对方深色气泡文本颜色 */
  html[data-theme="kokomi"] .msg.other .msg-content,
  html[data-theme="kokomi"] .msg.other .msg-header {
    color: #E2E8F0;
  }
  html[data-theme="kokomi"] .msg.other .msg-time {
    color: #8E9AAF;
  }
  html[data-theme="kokomi"] .msg.other .msg-file-name {
    color: #E2E8F0;
  }
  html[data-theme="kokomi"] .msg.other .msg-file-size {
    color: #8E9AAF;
  }

  /* IP 标签 — 我方（浅底） */
  html[data-theme="kokomi"] .msg.self .msg-ip {
    background: rgba(47, 38, 67, 0.08);
    border-left: 3px solid #B19FFB;
    color: #2F2643;
    border-radius: 2px;
    font-weight: 700;
    padding: 2px 8px;
    border-top: none; border-right: none; border-bottom: none;
  }
  /* IP 标签 — 对方（深底） */
  html[data-theme="kokomi"] .msg.other .msg-ip {
    background: rgba(226, 232, 240, 0.1);
    border-left: 3px solid #8E7CC3;
    color: #E2E8F0;
    border-radius: 2px;
    font-weight: 700;
    padding: 2px 8px;
    border-top: none; border-right: none; border-bottom: none;
  }

  /* 对方深色气泡的下载按钮：水光银色 */
  html[data-theme="kokomi"] .msg.other .btn-download {
    background: transparent;
    color: #DCE3EC;
    border: 1px solid rgba(220, 227, 236, 0.5);
    border-radius: 20px;
    padding: 6px 16px;
  }
  html[data-theme="kokomi"] .msg.other .btn-download:hover {
    background: rgba(142, 124, 195, 0.3);
    border-color: #8E7CC3;
    color: #E2E8F0;
    box-shadow: 0 0 10px rgba(142, 124, 195, 0.3);
  }

  /* 我方气泡的下载按钮保持原来的蓝粉渐变 */
  html[data-theme="kokomi"] .msg.self .btn-download {
    background: linear-gradient(135deg, #8CB9D6, #F29CB2);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 6px 16px;
    box-shadow: 0 4px 10px rgba(242, 156, 178, 0.3);
  }
  html[data-theme="kokomi"] .msg.self .btn-download:hover {
    box-shadow: 0 6px 15px rgba(242, 156, 178, 0.5);
    filter: brightness(1.1);
  }
  html[data-theme="kokomi"] .input-area {
    background: transparent;
    padding: 15px 16px;
    border-top: none;
  }
  html[data-theme="kokomi"] .input-area textarea {
    background: rgba(255, 255, 255, 0.65);

  /* Firefly / SAM theme (流萤·萨姆) */
  html[data-theme="firefly"] {
    --cn-paper:       #E5F3F1;
    --cn-bubble:      rgba(221, 244, 240, 0.75);
    --cn-ink:         #16463C;
    --cn-ink-light:   #8E8D9F;
    --cn-ink-faint:   rgba(140, 209, 197, 0.6);
    --cn-red:         #FF5E3A;
    --cn-red-hover:   #E04A2A;
    --cn-red-light:   rgba(255, 94, 58, 0.12);
    --cn-gold:        #FFBF00;
    --cn-wood:        rgba(200, 205, 212, 0.8);
    --cn-overlay:     rgba(22, 70, 60, 0.5);
  }

  /* ── Firefly 主题专属样式 ──────────────────────────────────── */
  html[data-theme="firefly"] {
    background-image:
      linear-gradient(135deg, rgba(229, 243, 241, 0.55), rgba(236, 233, 242, 0.55), rgba(245, 235, 240, 0.55)),
      url('/style/firefly/firefly.png');
    background-size: cover;
    background-attachment: fixed;
  }
  html[data-theme="firefly"] body {
    background: none;
    font-family: 'PingFang SC', 'MiSans', 'Microsoft YaHei', sans-serif;
  }
  html[data-theme="firefly"] .header {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 2px solid var(--cn-ink-faint);
    box-shadow: inset 0 2px 0 #E8DFF5;
  }
  /* ── 流萤衣服配色聊天框 ────────────────────────────────── */

  /* [通用] 我方气泡：渐变长裙款（浅薄荷绿→淡黄 + 金色刺绣滚边） */
  html[data-theme="firefly"] .msg.self {
    background: linear-gradient(135deg, #CBEFE7 0%, #E8F5D8 100%);
    border: 1px solid #D4B26F;
    border-radius: 16px 2px 16px 16px;
    color: #12332B;
    box-shadow:
      0 4px 12px rgba(212, 178, 111, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
    position: relative;
  }
  /* 粉色发带饰条（右上角） */
  html[data-theme="firefly"] .msg.self::before {
    content: "";
    position: absolute;
    top: 0;
    right: 15px;
    width: 30px;
    height: 3px;
    background: #F2B0C1;
    border-radius: 0 0 4px 4px;
  }

  /* [对方] 深色外套款：黛黑炭灰 + 金丝刺绣 + 粉紫微光 */
  html[data-theme="firefly"] .msg.other {
    background: linear-gradient(135deg, #252835 0%, #1A1C24 100%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 2px 16px 16px 16px;
    color: #F3F4F6;
    box-shadow:
      0 4px 15px rgba(232, 223, 245, 0.08),
      inset 0 0 8px rgba(232, 223, 245, 0.1);
    position: relative;
  }
  /* 金色刺绣饰条（左上角） */
  html[data-theme="firefly"] .msg.other::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15px;
    width: 30px;
    height: 3px;
    background: #E5C17B;
    border-radius: 0 0 4px 4px;
  }

  /* 我方气泡内的文本颜色从渐变继承，使用深色文字 */
  html[data-theme="firefly"] .msg.self .msg-content,
  html[data-theme="firefly"] .msg.self .msg-header,
  html[data-theme="firefly"] .msg.self .msg-file-name {
    color: #12332B;
  }
  html[data-theme="firefly"] .msg.self .msg-time {
    color: #7A9E8B;
  }

  /* 对方深色气泡内的文本强制象牙白 */
  html[data-theme="firefly"] .msg.other .msg-content,
  html[data-theme="firefly"] .msg.other .msg-header,
  html[data-theme="firefly"] .msg.other .msg-file-name {
    color: #F3F4F6;
  }
  html[data-theme="firefly"] .msg.other .msg-time {
    color: #9A9BB0;
  }
  html[data-theme="firefly"] .msg.other .msg-file-size {
    color: #B0B1C5;
  }

  /* 对方深色气泡的下载按钮：金丝色 */
  html[data-theme="firefly"] .msg.other .btn-download {
    background: transparent;
    color: #E5C17B;
    border: 1px solid #E5C17B;
  }
  html[data-theme="firefly"] .msg.other .btn-download:hover {
    background: #4AA391;
    color: #FFF;
    border-color: #4AA391;
    box-shadow: 0 0 10px rgba(74, 163, 145, 0.4);
  }

  /* IP 标签 — 我方浅色底用深绿 */
  html[data-theme="firefly"] .msg.self .msg-ip {
    background: rgba(18, 51, 43, 0.08);
    border-left: 3px solid #4AA391;
    color: #12332B;
    border-radius: 2px;
    font-weight: 700;
    padding: 2px 8px;
    border-top: none; border-right: none; border-bottom: none;
  }
  /* IP 标签 — 对方深色底用浅色 */
  html[data-theme="firefly"] .msg.other .msg-ip {
    background: rgba(243, 244, 246, 0.1);
    border-left: 3px solid #E5C17B;
    color: #F3F4F6;
    border-radius: 2px;
    font-weight: 700;
    padding: 2px 8px;
    border-top: none; border-right: none; border-bottom: none;
  }
  html[data-theme="firefly"] .input-area {
    background: transparent;
    border-top: 1px solid rgba(22, 70, 60, 0.1);
  }
  html[data-theme="firefly"] .input-area textarea {
    background: rgba(255, 255, 255, 0.8);
    border: 1px solid var(--cn-ink-faint);
    border-radius: 8px;
    color: var(--cn-ink);
  }
  html[data-theme="firefly"] .input-area textarea:focus {
    background: #FFF;
    border-color: var(--cn-gold);
    box-shadow: 0 0 8px rgba(255, 191, 0, 0.2);
  }
  html[data-theme="firefly"] .btn-download {
    background: transparent;
    color: var(--cn-ink);
    border: 1.5px solid var(--cn-ink);
    border-radius: 4px;
  }
  html[data-theme="firefly"] .btn-download:hover {
    background: linear-gradient(135deg, var(--cn-red), var(--cn-gold));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(255, 94, 58, 0.5);
  }
  html[data-theme="firefly"] .btn-send {
    background: linear-gradient(135deg, var(--cn-red), var(--cn-gold));
    border-radius: 4px;
    transform: skewX(-6deg);
    box-shadow: 0 0 12px rgba(255, 94, 58, 0.5);
  }
  html[data-theme="firefly"] .btn-send span {
    display: block;
    transform: skewX(6deg);
  }
  html[data-theme="firefly"] .btn-send:hover {
    filter: brightness(1.15);
    background: linear-gradient(135deg, var(--cn-red), var(--cn-gold));
    box-shadow: 0 0 18px rgba(255, 94, 58, 0.8);
  }
  html[data-theme="firefly"] .btn-icon {
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.6);
  }
  html[data-theme="firefly"] .btn-icon:hover {
    background: linear-gradient(135deg, var(--cn-red), var(--cn-gold));
    color: #fff;
    border-color: transparent;
  }
  html[data-theme="firefly"] #pageTitle {
    background: linear-gradient(135deg, var(--cn-red), var(--cn-gold));
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ── Kokomi 水泡浮动动画 ──────────────────────────────────── */
  @keyframes koko-bubble-fast {
    0%   { transform: translateY(0) scale(1);   opacity: 0; }
    8%   { opacity: 0.7; }
    80%  { opacity: 0.3; }
    100% { transform: translateY(-105vh) scale(0.3); opacity: 0; }
  }
  @keyframes koko-bubble-slow {
    0%   { transform: translateY(0) scale(1);   opacity: 0; }
    8%   { opacity: 0.55; }
    75%  { opacity: 0.25; }
    100% { transform: translateY(-105vh) scale(0.2); opacity: 0; }
  }
  @keyframes koko-bubble-drift {
    0%   { transform: translateY(0) translateX(0) scale(1);   opacity: 0; }
    10%  { opacity: 0.5; }
    70%  { opacity: 0.2; }
    100% { transform: translateY(-105vh) translateX(30px) scale(0.15); opacity: 0; }
  }
  html[data-theme="kokomi"] .bubble-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  html[data-theme="kokomi"] .bubble-g {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
  }
  /* 组1：左侧小气泡群 — 快速上浮 */
  html[data-theme="kokomi"] .bubble-fast {
    width: 14px; height: 14px;
    left: 5%;
    bottom: -15px;
    background: rgba(255, 255, 255, 0.22);
    animation: koko-bubble-fast 11s linear 0s infinite;
    box-shadow:
       0  80px  0 -2px rgba(255,255,255,0.10),
     250 180px  0 -5px rgba(255,255,255,0.07),
     100 320px  0 -1px rgba(255,255,255,0.12),
     300 450px  0 -4px rgba(255,255,255,0.06),
     180 600px  0 -3px rgba(177,159,251,0.09),
      50 780px  0 -2px rgba(255,255,255,0.08),
     200 920px  0 -6px rgba(255,255,255,0.05);
  }
  /* 组2：右侧大气泡群 — 慢速上浮 */
  html[data-theme="kokomi"] .bubble-slow {
    width: 22px; height: 22px;
    left: 75%;
    bottom: -25px;
    background: rgba(255, 255, 255, 0.15);
    animation: koko-bubble-slow 18s linear 2s infinite;
    box-shadow:
       0 120px  0 -6px rgba(255,255,255,0.08),
    -180 280px  0 -3px rgba(177,159,251,0.10),
     150 400px  0 -8px rgba(255,255,255,0.06),
     -80 580px  0 -4px rgba(255,255,255,0.09),
     100 750px  0 -2px rgba(242,156,178,0.07),
     -50 900px  0 -7px rgba(255,255,255,0.05),
     200 1050px 0 -5px rgba(177,159,251,0.06);
  }
  /* 组3：中部飘移气泡群 — 横向漂移 */
  html[data-theme="kokomi"] .bubble-drift {
    width: 10px; height: 10px;
    left: 40%;
    bottom: -10px;
    background: rgba(255, 255, 255, 0.18);
    animation: koko-bubble-drift 22s linear 5s infinite;
    box-shadow:
       0  60px  0 -3px rgba(255,255,255,0.08),
     120 200px  0 -2px rgba(255,255,255,0.06),
     -80 350px  0 -4px rgba(177,159,251,0.07),
      60 500px  0 -1px rgba(255,255,255,0.10),
    -100 650px  0 -5px rgba(255,255,255,0.05),
     150 800px  0 -2px rgba(242,156,178,0.08);
  }
  /* 组4：散布微小泡 — 最慢 */
  html[data-theme="kokomi"] .bubble-tiny {
    width: 6px; height: 6px;
    left: 15%;
    bottom: -8px;
    background: rgba(255, 255, 255, 0.10);
    animation: koko-bubble-slow 25s linear 8s infinite;
    box-shadow:
       0  90px  0 -1px rgba(255,255,255,0.06),
     300 220px  0 -2px rgba(255,255,255,0.05),
     180 380px  0 -1px rgba(177,159,251,0.07),
     400 520px  0 -3px rgba(255,255,255,0.04),
      80 680px  0 -1px rgba(255,255,255,0.06),
     250 850px  0 -2px rgba(242,156,178,0.05);
  }
  /* 气泡层不遮挡交互 */
  html[data-theme="kokomi"] .header,
  html[data-theme="kokomi"] .msg-area,
  html[data-theme="kokomi"] .input-area {
    position: relative;
    z-index: 1;
  }
  html[data-theme="kokomi"] .modal-overlay {
    z-index: 100;
  }

  /* ── Firefly 火焰呼吸脉动动画 ──────────────────────────────── */
  @keyframes firefly-pulse {
    0%, 100% {
      box-shadow:
        0 0 8px  rgba(255, 94, 58, 0.3),
        0 0 0px  rgba(255, 191, 0, 0);
      transform: skewX(-6deg) scale(1);
    }
    50% {
      box-shadow:
        0 0 20px rgba(255, 94, 58, 0.8),
        0 0 40px rgba(255, 191, 0, 0.4);
      transform: skewX(-6deg) scale(1.06);
    }
  }
  html[data-theme="firefly"] .btn-send {
    animation: firefly-pulse 2s ease-in-out infinite;
  }
  /* 悬停期间暂停脉动，悬停效果更醒目 */
  html[data-theme="firefly"] .btn-send:hover {
    animation: none;
    filter: brightness(1.2);
    box-shadow:
      0 0 30px rgba(255, 94, 58, 0.9),
      0 0 60px rgba(255, 191, 0, 0.5);
  }

  /* ── Furina 芙宁娜 · 欧庇克莱歌剧院 ────────────────────────── */
  html[data-theme="furina"] {
    --cn-paper:       #120B0B;
    --cn-bubble:      #1C1212;
    --cn-ink:         #E2E8F0;
    --cn-ink-light:   #9CA3AF;
    --cn-ink-faint:   #6B7280;
    --cn-red:         #D9B36C;
    --cn-red-hover:   #C4A058;
    --cn-red-light:   rgba(217, 179, 108, 0.12);

      linear-gradient(135deg, rgba(18, 11, 11, 0.45), rgba(18, 11, 11, 0.25)),

  html[data-theme="furina"] .header {

    border-bottom: 1px solid rgba(255, 235, 190, 0.12);
    box-shadow: 0 0 30px rgba(255, 235, 190, 0.03);

  html[data-theme="furina"] .header h1 { color: var(--cn-ink); text-shadow: none; }

  /* [我方·白芙] 浅蓝白渐变 + 金色镶边 + 星轨 */

    background: linear-gradient(135deg, #F0F6FC 0%, #DCE8F5 100%);
    border: 1.5px solid #D9B36C;
    border-radius: 16px 16px 2px 16px;
    color: #1A335B;
    box-shadow: 0 4px 15px rgba(59, 98, 155, 0.15), inset 0 1px 0 #FFFFFF;
    position: relative;
  }
  html[data-theme="furina"] .msg.self::before {
    content: "✦";
    position: absolute;
    top: -8px;
    right: 15px;
    color: #D9B36C;
    font-size: 14px;
    text-shadow: 0 0 5px rgba(217, 179, 108, 0.8);
  }

  /* [对方·黑芙] 水质感礼服蓝 + 银白冷光 + 蕾丝袜边 */
  html[data-theme="furina"] .msg.other {
    background: linear-gradient(135deg, rgba(42, 82, 132, 0.85) 0%, rgba(30, 52, 85, 0.88) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(234, 236, 239, 0.3);
    border-radius: 16px 16px 16px 2px;
    color: #EAECEF;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), inset 0 0 8px rgba(234, 236, 239, 0.08);
    position: relative;
  }
  html[data-theme="furina"] .msg.other::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background-image: repeating-linear-gradient(45deg,
      rgba(234, 236, 239, 0.2) 0px, rgba(234, 236, 239, 0.2) 1px,
      transparent 1px, transparent 4px);
    border-top: 1px dashed rgba(234, 236, 239, 0.3);
  }

  /* 白芙文本 */ html[data-theme="furina"] .msg.self .msg-content,
  html[data-theme="furina"] .msg.self .msg-header { color: #1A335B; }
  html[data-theme="furina"] .msg.self .msg-time { color: #7A8FA5; }
  html[data-theme="furina"] .msg.self .msg-file-name { color: #1A335B; }
  /* 黑芙文本 */ html[data-theme="furina"] .msg.other .msg-content,
  html[data-theme="furina"] .msg.other .msg-header { color: #EAECEF; }
  html[data-theme="furina"] .msg.other .msg-time { color: #8E9AAF; }
  html[data-theme="furina"] .msg.other .msg-file-name { color: #EAECEF; }
  html[data-theme="furina"] .msg.other .msg-file-size { color: #8E9AAF; }

  /* IP 标签 */ html[data-theme="furina"] .msg.self .msg-ip {
    background: rgba(26, 51, 91, 0.08); border-left: 3px solid #D9B36C;
    color: #1A335B; border-radius: 2px; font-weight: 700;
    padding: 2px 8px; border-top: none; border-right: none; border-bottom: none;
  }
  html[data-theme="furina"] .msg.other .msg-ip {
    background: rgba(234, 236, 239, 0.08); border-left: 3px solid #D9B36C;
    color: #EAECEF; border-radius: 2px; font-weight: 700;
    padding: 2px 8px; border-top: none; border-right: none; border-bottom: none;

  /* 发送按钮 */ html[data-theme="furina"] .btn-send {
    background: #1C2E4A; color: #E6C57E;
    border: 1px solid #D9B36C; border-radius: 4px; box-shadow: none;

  html[data-theme="furina"] .btn-send:hover {
    background: #D9B36C; color: #120B0B;
    box-shadow: 0 0 15px rgba(217, 179, 108, 0.6); transform: scale(1.02);

  html[data-theme="furina"] .input-area { background: transparent; border-top: 1px solid rgba(255, 235, 190, 0.08); }

    background: rgba(20, 15, 15, 0.7); backdrop-filter: blur(6px);

  html[data-theme="furina"] .input-area textarea:focus {

  html[data-theme="furina"] .btn-download {

  html[data-theme="furina"] .btn-download:hover {

  /* User features */
  .name-input { width: 90px; padding: 3px 6px; border: 1px solid var(--cn-wood); background: var(--cn-bubble); color: var(--cn-ink); border-radius: 2px; font-size: 11px; font-family: inherit; outline: none; }
  .name-input:focus { border-color: var(--cn-red); }
  .btn-name-set { padding: 3px 6px; border: 1px solid var(--cn-wood); background: transparent; color: var(--cn-ink-light); cursor: pointer; border-radius: 2px; font-size: 11px; font-family: inherit; line-height: 1; }
  .btn-name-set:hover { border-color: var(--cn-red); color: var(--cn-red); }
  .btn-recall { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: none; background: transparent; color: var(--cn-ink-faint); cursor: pointer; opacity: 0; transition: opacity 0.15s; font-size: 12px; line-height: 20px; text-align: center; padding: 0; border-radius: 2px; z-index: 2; }
  .msg:hover .btn-recall { opacity: 0.6; }
  .btn-recall:hover { opacity: 1 !important; color: var(--cn-red); }
  .btn-clear { padding: 3px 6px; border: 1px solid var(--cn-wood); background: transparent; color: var(--cn-ink-faint); cursor: pointer; border-radius: 2px; font-size: 11px; font-family: inherit; line-height: 1; }
  .btn-clear:hover { border-color: var(--cn-red); color: var(--cn-red); }
  .btn-clear.confirming { background: var(--cn-red); color: var(--cn-bubble); border-color: var(--cn-red); }
  .filter-tag { padding: 2px 8px; border: 1px solid var(--cn-wood); background: transparent; color: var(--cn-ink-light); cursor: pointer; border-radius: 2px; font-size: 11px; font-family: inherit; white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .filter-tag:hover { border-color: var(--cn-red); color: var(--cn-red); }
  .filter-tag.active { background: var(--cn-red-light); border-color: var(--cn-red); color: var(--cn-red); }
</style>
</head>
<body>

<div class="bubble-layer" aria-hidden="true">
  <div class="bubble-g bubble-fast"></div>
  <div class="bubble-g bubble-slow"></div>
  <div class="bubble-g bubble-drift"></div>
  <div class="bubble-g bubble-tiny"></div>
</div>

<div class="header">
  <h1>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--cn-red)" stroke-width="1.5" stroke-linecap="round" style="vertical-align:-4px;margin-right:4px">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 7h18"/>
      <line x1="8" y1="11" x2="16" y2="11"/>
      <line x1="8" y1="15" x2="14" y2="15"/>
    </svg>
    <span id="pageTitle">兰亭信传</span>
  </h1>
  <span class="server-url" id="serverUrl"></span>
  <span class="sse-status disconnected" id="sseStatus" title="连接状态"></span>
  <select class="theme-select" id="themeSelect" title="切换样式">
    <option value="red">兰亭信传</option>
    <option value="default">简约配色</option>
    <option value="kokomi">珊瑚宫心海</option>
    <option value="firefly">流萤·萨姆</option>
    <option value="furina">芙宁娜·歌剧院</option>
  </select>
  <input class="name-input" id="nameInput" placeholder="昵称" maxlength="30" title="设置昵称">
  <button class="btn-name-set" id="btnSetName">设置</button>
  <select class="theme-select" id="filterSelect" style="max-width:100px" title="筛选用户">
    <option value="">全部</option>
  </select>
  <button class="btn-clear" id="btnClear">清空</button>
</div>

<div class="msg-area" id="msgArea" role="log" aria-live="polite">
  <div style="text-align:center;color:var(--cn-ink-faint);padding:40px;font-size:14px;" id="loadingMsg">正在加载...</div>
</div>

<div class="input-area">
  <div class="input-actions">
    <button class="btn-icon" id="btnZip" title="打包上传">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="14" rx="1"/>
        <path d="M3 7 L5 4 L19 4 L21 7"/>
        <line x1="12" y1="4" x2="12" y2="7"/>
        <circle cx="12" cy="14" r="2"/>
      </svg>
    </button>
  </div>
  <textarea id="msgInput" rows="1" placeholder="输入消息，或粘贴文件..." maxlength="50000"></textarea>
  <button class="btn-send" id="btnSend"><span>发送</span></button>
</div>

<!-- Clear confirmation modal -->
<div class="modal-overlay" id="clearModal">
  <div class="modal" style="text-align:center">
    <h2>清空所有消息</h2>
    <p style="color:var(--cn-ink);font-size:15px;margin:16px 0 8px;line-height:1.6">确定清空所有聊天记录和上传的文件？</p>
    <p style="color:var(--cn-ink-light);font-size:13px;margin:0 0 20px">此操作不可恢复！</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-cancel" id="clearModalCancel">取消</button>
      <button class="btn-upload" id="clearModalConfirm" style="background:var(--cn-red)">确认清空</button>
    </div>
  </div>
</div>

<!-- ZIP upload modal -->
<div class="modal-overlay" id="zipModal">
  <div class="modal">
    <h2>打包上传</h2>
    <input type="text" id="zipName" placeholder="压缩包名称（默认：files）" value="">
    <div class="drop-zone" id="dropZone">
      <p>拖拽文件至此处，或点击选择</p>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnZipCancel">取消</button>
      <button class="btn-upload" id="btnZipUpload" disabled>上传打包</button>
    </div>
  </div>
</div>

<!-- Hidden file input (zip modal) -->
<input type="file" id="zipFileInput" style="display:none" multiple>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────────────────────
  const MSG_API = '/api/messages';
  const EVT_API = '/api/events';
  const DL_API = '/api/download';
  let selectedFiles = [];
  let loadingHistory = false;
  let allLoaded = false;

  // ── DOM refs ────────────────────────────────────────────────────────────
  const msgArea = document.getElementById('msgArea');
  const msgInput = document.getElementById('msgInput');
  const btnSend = document.getElementById('btnSend');
  const btnZip = document.getElementById('btnZip');
  const themeSelect = document.getElementById('themeSelect');
  const pageTitle = document.getElementById('pageTitle');
  const nameInput = document.getElementById('nameInput');
  const btnSetName = document.getElementById('btnSetName');
  const btnClear = document.getElementById('btnClear');
  const filterSelect = document.getElementById('filterSelect');
  let currentFilter = '';
  const messageCache = {};  // id -> original msg data for rerender
  const zipModal = document.getElementById('zipModal');
  const zipName = document.getElementById('zipName');
  const dropZone = document.getElementById('dropZone');
  const fileList = document.getElementById('fileList');
  const btnZipCancel = document.getElementById('btnZipCancel');
  const btnZipUpload = document.getElementById('btnZipUpload');
  const zipFileInput = document.getElementById('zipFileInput');
  const sseStatus = document.getElementById('sseStatus');
  const serverUrl = document.getElementById('serverUrl');
  const toast = document.getElementById('toast');

  serverUrl.textContent = window.location.host;

  // ── Helpers ────────────────────────────────────────────────────────────
  function formatTime(t) {
    if (!t) return '';
    const d = new Date(t.replace(' ', 'T'));
    if (isNaN(d.getTime())) return t;
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }

  function formatSize(bytes) {
    if (!bytes || bytes === 0) return '';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0; let s = bytes;
    while (s >= 1024 && i < units.length-1) { s /= 1024; i++; }
    return s.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
  }

  function getMsgClass(selfIp, msgIp) {
    if (!msgIp) return 'other';
    return selfIp === msgIp ? 'self' : 'other';
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function scrollToBottom(smooth) {
    requestAnimationFrame(() => {
      msgArea.scrollTo({ top: msgArea.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    });
  }

  function showToast(msg, duration) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), duration || 2500);
  }

  async function fetchJSON(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) { const t = await r.text().catch(() => ''); throw new Error(t || `HTTP ${r.status}`); }
    return r.json();
  }

  function getSelfIp() {
    // Best-effort: use the IP the server sees
    return localStorage.getItem('self_ip') || '';
  }

  function formatDate(t) {
    if (!t) return '';
    const d = new Date(t.replace(' ', 'T'));
    if (isNaN(d.getTime())) return '';
    const today = new Date();
    const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return '今日';
    if (d.toDateString() === yesterday.toDateString()) return '昨日';
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  let lastRenderedDate = '';

  // ── Render message ─────────────────────────────────────────────────────
  function renderMsg(msg, prepend) {
    // Dedup: skip if already rendered
    if (document.querySelector('[data-id="' + msg.id + '"]')) return;
    const selfIp = getSelfIp();
    const cls = getMsgClass(selfIp, msg.device_ip);
    const div = document.createElement('div');
    div.className = `msg ${cls}`;
    div.dataset.id = msg.id;
    div.dataset.ip = msg.device_ip;

    let icon = '';
    let bodyHtml = '';

    switch (msg.message_type) {
      case 'text':
        bodyHtml = `<div class="msg-content">${escapeHtml(msg.content)}</div>`;
        break;
      case 'file':
        icon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="14" y2="12"/><line x1="8" y1="16" x2="15" y2="16"/></svg>';
        bodyHtml = `
          <div class="msg-file">
            <span class="msg-file-icon">${icon}</span>
            <div class="msg-file-info">
              <div class="msg-file-name">${escapeHtml(msg.file_name)}</div>
              <div class="msg-file-size">${formatSize(msg.file_size)}</div>
            </div>
            <button class="btn-download" data-id="${msg.id}">下载</button>
          </div>`;
        break;
      case 'zip':
        icon = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="7" width="18" height="14" rx="1"/><path d="M3 7 L5 4 L19 4 L21 7"/><line x1="12" y1="4" x2="12" y2="7"/><circle cx="12" cy="14" r="2"/></svg>';
        bodyHtml = `
          <div class="msg-file">
            <span class="msg-file-icon">${icon}</span>
            <div class="msg-file-info">
              <div class="msg-file-name">${escapeHtml(msg.file_name)}</div>
              <div class="msg-file-size">${formatSize(msg.file_size)} · ${escapeHtml(msg.content || '')}</div>
            </div>
            <button class="btn-download" data-id="${msg.id}">下载</button>
          </div>`;
        break;
      default:
        bodyHtml = `<div class="msg-content">${escapeHtml(msg.content)}</div>`;
    }

    messageCache[msg.id] = msg;
    const showName = localStorage.getItem('show_name') !== 'false';
    const displayName = profileCache[msg.device_ip] || '';
    const displayText = showName && displayName ? escapeHtml(displayName) : escapeHtml(msg.device_ip);
    const isSelf = selfIp === msg.device_ip;
    div.innerHTML = `
      <div class="msg-header">
        <span class="msg-ip clickable" data-ip="${escapeHtml(msg.device_ip)}" title="点击筛选此人">${displayText}</span>
        <span class="msg-time">${formatTime(msg.created_at)}</span>
      </div>
      ${isSelf ? '<button class="btn-recall" data-id="' + msg.id + '" title="撤回">\u2716</button>' : ''}
      ${bodyHtml}`;
    // Recall handler
    const recallBtn = div.querySelector('.btn-recall');
    if (recallBtn) {
      recallBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm('撤回这条消息？')) return;
        try {
          await fetch('/api/messages/' + msg.id, { method: 'DELETE' });
        } catch (_) { showToast('撤回失败'); }
      });
    }
    // Click IP to toggle name/IP display
    const ipSpan = div.querySelector('.msg-ip');
    ipSpan.addEventListener('click', () => {
      const cur = localStorage.getItem('show_name');
      localStorage.setItem('show_name', cur === 'false' ? 'true' : 'false');
      showToast('已切换为: ' + (cur === 'false' ? '昵称' : 'IP地址'));
      rerenderMessages();
    });

    // Download handler
    div.querySelector('.btn-download')?.addEventListener('click', (e) => {
      e.stopPropagation();
      downloadFile(msg.id, msg.file_name);
    });

    if (prepend) {
      msgArea.insertBefore(div, msgArea.firstChild);
    } else {
      // Insert date separator if day changed
      const msgDate = formatDate(msg.created_at);
      if (msgDate && msgDate !== lastRenderedDate) {
        const sep = document.createElement('div');
        sep.className = 'date-sep';
        sep.innerHTML = `<span>${escapeHtml(msgDate)}</span>`;
        msgArea.appendChild(sep);
        lastRenderedDate = msgDate;
      }
      msgArea.appendChild(div);
    }
    return div;
  }

  // ── Resumable download ─────────────────────────────────────────────────
  function downloadFile(msgId, filename) {
    // Use backend streaming with Range support — browser handles resume natively
    const a = document.createElement('a');
    a.href = `${DL_API}/${msgId}`;
    a.download = filename || 'download';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // ── Load messages ──────────────────────────────────────────────────────
  async function loadMessages(beforeId) {
    if (loadingHistory || allLoaded) return;
    loadingHistory = true;

    try {
      const params = new URLSearchParams({ limit: '50' });
      if (beforeId) params.set('before_id', beforeId);
      const msgs = await fetchJSON(`${MSG_API}?${params}`);

      const loadingEl = document.getElementById('loadingMsg');
      if (loadingEl) loadingEl.remove();

      if (msgs.length === 0) {
        allLoaded = true;
        return;
      }

      if (beforeId) {
        // History load: iterate newest-first so prepend keeps ascending order
        for (let i = msgs.length - 1; i >= 0; i--) {
          renderMsg(msgs[i], true);
        }
        // Keep scroll position near top for history loading
        const firstNew = msgArea.querySelector('[data-id]');
        if (firstNew) firstNew.scrollIntoView({ block: 'start' });
      } else {
        // Initial load: append in ascending order (oldest → newest), no animation
        for (const msg of msgs) {
          renderMsg(msg, false);
        }
        scrollToBottom(false);
      }
    } catch (e) {
      console.error('Failed to load messages:', e);
      showToast('加载消息失败');
    } finally {
      loadingHistory = false;
    }
  }

  // ── Send message ───────────────────────────────────────────────────────
  async function sendText(text) {
    if (!text.trim()) return;
    const fd = new FormData();
    fd.set('content', text.trim());
    fd.set('sender', '');
    try {
      await fetchJSON(MSG_API + '/text', { method: 'POST', body: fd });
      msgInput.value = '';
      msgInput.style.height = 'auto';
    } catch (e) {
      showToast('发送失败: ' + e.message);
    }
  }

  async function sendFile(file) {
    const fd = new FormData();
    fd.set('file', file);
    fd.set('sender', '');
    try {
      await fetchJSON(MSG_API + '/file', { method: 'POST', body: fd });
    } catch (e) {
      showToast('上传失败: ' + e.message);
    }
  }

  async function sendZip(files, name) {
    const fd = new FormData();
    fd.set('zip_name', name || 'files');
    fd.set('sender', '');
    for (const f of files) {
      fd.append('files', f);
    }
    try {
      await fetchJSON(MSG_API + '/zip', { method: 'POST', body: fd });
      showToast(`共 ${files.length} 个文件，打包发送成功`);
    } catch (e) {
      showToast('打包上传失败: ' + e.message);
    }
  }

  // ── SSE ────────────────────────────────────────────────────────────────
  function connectSSE() {
    const evtSrc = new EventSource(EVT_API);
    evtSrc.onopen = () => {
      sseStatus.className = 'sse-status connected';
    };

    evtSrc.addEventListener('new_message', (e) => {
      try {
        const msg = JSON.parse(e.data);
        renderMsg(msg, false);
        scrollToBottom(false);

        // Save self IP on first message from us
        if (!getSelfIp() && msg.device_ip) {
          localStorage.setItem('self_ip', msg.device_ip);
        }
      } catch (err) {
        console.error('SSE parse error:', err);
      }
    });

    evtSrc.addEventListener('profile_update', (e) => {
      try { refreshUsers(); } catch (_) {}
    });
    evtSrc.addEventListener('message_deleted', (e) => {
      try {
        const data = JSON.parse(e.data);
        const el = msgArea.querySelector('[data-id="' + data.id + '"]');
        if (el) el.remove();
      } catch (_) {}
    });
    evtSrc.addEventListener('messages_cleared', () => {
      msgArea.innerHTML = '';
      allLoaded = false;
      loadingHistory = false;
      lastRenderedDate = '';
      for (const k in messageCache) delete messageCache[k];
    });
    evtSrc.onerror = () => {
      sseStatus.className = 'sse-status disconnected';
      // EventSource auto-reconnects
    };
  }

  // ── History scroll (infinite scroll up) ────────────────────────────────
  msgArea.addEventListener('scroll', () => {
    if (msgArea.scrollTop < 50) {
      const firstMsg = msgArea.querySelector('[data-id]');
      if (firstMsg) {
        loadMessages(parseInt(firstMsg.dataset.id));
      }
    }
  });

  // ── Text input ─────────────────────────────────────────────────────────
  msgInput.addEventListener('input', () => {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
  });

  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText(msgInput.value);
    }
  });

  btnSend.addEventListener('click', () => sendText(msgInput.value));

  // ── Clipboard paste ────────────────────────────────────────────────────
  msgInput.addEventListener('paste', async (e) => {
    const items = e.clipboardData.items;
    let hasFile = false;
    for (const item of items) {
      if (item.kind === 'file') {
        hasFile = true;
        const file = item.getAsFile();
        if (file) {
          e.preventDefault();
          await sendFile(file);
          showToast(`已粘贴文件: ${file.name}`);
        }
      }
    }
  });

  // ── ZIP modal ──────────────────────────────────────────────────────────
  let zipFiles = [];

  btnZip.addEventListener('click', () => {
    zipFiles = [];
    updateZipFileList();
    zipName.value = '';
    zipModal.classList.add('open');
  });

  function closeZipModal() {
    zipModal.classList.remove('open');
    zipFiles = [];
    updateZipFileList();
  }

  btnZipCancel.addEventListener('click', closeZipModal);

  // Drop zone — drag & drop
  dropZone.addEventListener('click', () => zipFileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      for (const f of files) zipFiles.push(f);
      updateZipFileList();
    }
  });

  // File input for zip modal
  zipFileInput.addEventListener('change', () => {
    const files = zipFileInput.files;
    if (files && files.length > 0) {
      for (const f of files) zipFiles.push(f);
      updateZipFileList();
    }
    zipFileInput.value = '';
  });

  function updateZipFileList() {
    const list = document.getElementById('fileList');
    list.innerHTML = '';
    for (let i = 0; i < zipFiles.length; i++) {
      const f = zipFiles[i];
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <span class="name">${escapeHtml(f.name)}</span>
        <span class="size">${formatSize(f.size)}</span>
        <span class="remove" data-idx="${i}">✕</span>`;
      item.querySelector('.remove').addEventListener('click', () => {
        zipFiles.splice(i, 1);
        updateZipFileList();
      });
      list.appendChild(item);
    }
    btnZipUpload.disabled = zipFiles.length === 0;
  }

  btnZipUpload.addEventListener('click', async () => {
    if (zipFiles.length === 0) return;
    btnZipUpload.disabled = true;
    btnZipUpload.textContent = '打包中...';
    try {
      const name = zipName.value.trim() || 'files';
      await sendZip(zipFiles, name);
      closeZipModal();
    } finally {
      btnZipUpload.disabled = false;
      btnZipUpload.textContent = '上传打包';
    }
  });

  // Close modal on overlay click
  zipModal.addEventListener('click', (e) => {
    if (e.target === zipModal) closeZipModal();
  });

  // ── Also drag-drop files onto page for single file upload ──────────────
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    const files = e.dataTransfer.files;
    if (!files || files.length === 0) return;
    if (files.length === 1) {
      sendFile(files[0]);
    } else {
      // Multiple files → open ZIP modal
      zipFiles = Array.from(files);
      zipName.value = 'files';
      zipModal.classList.add('open');
      updateZipFileList();
    }
  });

  // ── Theme switching ───────────────────────────────────────────────────
  const THEMES = ['red', 'default', 'kokomi', 'firefly', 'furina'];
  const THEME_NAMES = ['兰亭信传', '简约配色', '珊瑚宫心海', '流萤·萨姆', '芙宁娜·歌剧院'];

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeSelect.value = theme;
    const idx = THEMES.indexOf(theme);
    if (idx >= 0) pageTitle.textContent = THEME_NAMES[idx];
  }

  async function saveThemeToServer(theme) {
    try {
      const fd = new FormData();
      fd.set('theme', theme);
      await fetch('/api/theme', { method: 'POST', body: fd });
    } catch (_) { /* offline-safe */ }
  }

  async function setTheme(theme) {
    applyTheme(theme);
    localStorage.setItem('chat_theme', theme);
    await saveThemeToServer(theme);
  }

  themeSelect.addEventListener('change', async () => {
    await setTheme(themeSelect.value);
    showToast('已切换为: ' + (THEME_NAMES[THEMES.indexOf(themeSelect.value)] || themeSelect.value));
  });

  // Restore saved theme — instant from local cache, then authoritative from server
  async function restoreTheme() {
    const localTheme = localStorage.getItem('chat_theme');
    if (localTheme && THEMES.includes(localTheme)) {
      applyTheme(localTheme);
    } else {
      applyTheme('red');
    }
    try {
      const r = await fetchJSON('/api/theme');
      if (r.theme && THEMES.includes(r.theme)) {
        applyTheme(r.theme);
        localStorage.setItem('chat_theme', r.theme);
      }
    } catch (_) { /* offline, stay with local cache */ }
  }

  restoreTheme();

  // ── User features ──────────────────────────────────────────────────────
  let profileCache = {};

  // Load user's own profile
  async function loadProfile() {
    try {
      const r = await fetchJSON('/api/profile');
      if (r.display_name) {
        nameInput.value = r.display_name;
      }
      profileCache[r.ip] = r.display_name;
      localStorage.setItem('self_ip', r.ip);
    } catch (_) {}
  }

  btnSetName.addEventListener('click', async () => {
    const name = nameInput.value.trim();
    if (!name) return;
    try {
      const fd = new FormData();
      fd.set('display_name', name);
      await fetch('/api/profile', { method: 'POST', body: fd });
      showToast('昵称已设置为: ' + name);
      // Refresh user list and re-render
      await refreshUsers();
      rerenderMessages();
    } catch (_) { showToast('设置失败'); }
  });
  nameInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btnSetName.click();
  });

  // Name/IP toggle: click the displayed name/IP in any message
  document.addEventListener('click', (e) => {
    const ipSpan = e.target.closest('.msg-ip');
    if (!ipSpan || e.target.closest('.btn-recall')) return;
    // Already handled by per-msg click above, but we also support global toggle
    // via Shift+click on any IP
    if (e.shiftKey) {
      const cur = localStorage.getItem('show_name');
      localStorage.setItem('show_name', cur === 'true' ? 'false' : 'true');
      showToast('已切换显示: ' + (cur === 'true' ? 'IP地址' : '昵称'));
      rerenderMessages();
    }
  });

  // Refresh user list
  async function refreshUsers() {
    try {
      const users = await fetchJSON('/api/users');
      profileCache = {};
      // Preserve current selection
      const prevVal = filterSelect.value;
      filterSelect.innerHTML = '<option value="">全部</option>';
      for (const u of users) {
        profileCache[u.device_ip] = u.display_name || '';
        const opt = document.createElement('option');
        opt.value = u.device_ip;
        opt.textContent = u.display_name || u.device_ip;
        filterSelect.appendChild(opt);
      }
      if (prevVal && [...filterSelect.options].some(o => o.value === prevVal)) {
        filterSelect.value = prevVal;
      }
    } catch (_) {}
  }

  filterSelect.addEventListener('change', () => {
    const ip = filterSelect.value;
    if (currentFilter === ip) return;
    currentFilter = ip;
    if (!ip) {
      allLoaded = false;
      msgArea.innerHTML = '';
      lastRenderedDate = '';
      loadMessages();
    } else {
      allLoaded = false;
      msgArea.innerHTML = '';
      lastRenderedDate = '';
      loadingHistory = false;
      const params = new URLSearchParams({ limit: '100', sender_ip: ip });
      fetchJSON(MSG_API + '?' + params).then(msgs => {
        for (const msg of msgs) renderMsg(msg, false);
        scrollToBottom(false);
      }).catch(() => showToast('加载失败'));
    }
  });

  function setFilter(ip) {
    currentFilter = ip;
    filterSelect.value = ip || '';
    if (ip) {
      allLoaded = false;
      msgArea.innerHTML = '';
      lastRenderedDate = '';
      loadingHistory = false;
      const params = new URLSearchParams({ limit: '100', sender_ip: ip });
      fetchJSON(MSG_API + '?' + params).then(msgs => {
        for (const msg of msgs) renderMsg(msg, false);
        scrollToBottom(false);
      }).catch(() => showToast('加载失败'));
    } else {
      allLoaded = false;
      msgArea.innerHTML = '';
      lastRenderedDate = '';
      loadMessages();
    }
  }

  function clearFilter() {
    setFilter('');
  }



  // Rerender all visible messages (for name/IP toggle)
  function rerenderMessages() {
    const ids = [];
    msgArea.querySelectorAll('[data-id]').forEach(el => {
      ids.push(parseInt(el.dataset.id));
    });
    msgArea.innerHTML = '';
    lastRenderedDate = '';
    for (const id of ids) {
      const msg = messageCache[id];
      if (msg) renderMsg(msg, false);
    }
    scrollToBottom(false);
  }

  // Clear all messages
  const clearModal = document.getElementById('clearModal');
  const clearModalCancel = document.getElementById('clearModalCancel');
  const clearModalConfirm = document.getElementById('clearModalConfirm');
  
  btnClear.addEventListener('click', () => {
    clearModal.classList.add('open');
  });
  clearModalCancel.addEventListener('click', () => {
    clearModal.classList.remove('open');
  });
  clearModal.addEventListener('click', (e) => {
    if (e.target === clearModal) clearModal.classList.remove('open');
  });
  clearModalConfirm.addEventListener('click', async () => {
    clearModal.classList.remove('open');
    try {
      await fetch('/api/messages?confirm=true', { method: 'DELETE' });
      showToast('已清空所有消息和文件');
    } catch (_) { showToast('清空失败'); }
  });

  // ── Init ───────────────────────────────────────────────────────────────
  async function init() {
    await loadProfile();
    await refreshUsers();
    await loadMessages();
    connectSSE();
  }

  init();
})();
</script>
</body>
</html>
