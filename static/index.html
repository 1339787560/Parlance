<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>LAN InfoShare · 兰亭信传</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>


<div class="bubble-layer" aria-hidden="true">
  <div class="bubble-g bubble-fast"></div>
  <div class="bubble-g bubble-slow"></div>
  <div class="bubble-g bubble-drift"></div>
  <div class="bubble-g bubble-tiny"></div>
</div>

<div class="header">
  <h1>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--cn-red)" stroke-width="1.5" stroke-linecap="round" style="vertical-align:-4px;margin-right:4px">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 7h18"/>
      <line x1="8" y1="11" x2="16" y2="11"/>
      <line x1="8" y1="15" x2="14" y2="15"/>
    </svg>
    <span id="pageTitle">兰亭信传</span>
  </h1>
  <span class="server-url" id="serverUrl"></span>
  <span class="sse-status disconnected" id="sseStatus" title="连接状态"></span>
  <select class="theme-select" id="themeSelect" title="切换样式">
    <option value="red">兰亭信传</option>
    <option value="default">简约配色</option>
    <option value="kokomi">珊瑚宫心海</option>
    <option value="firefly">流萤·萨姆</option>
    <option value="furina">芙宁娜·歌剧院</option>
    <option value="hysilens">海瑟音·深境</option>
    <option value="geniusclub">天才俱乐部</option>
    <option value="silverwolf">狼尊 LV.999</option>
  </select>
  <input class="name-input" id="nameInput" placeholder="昵称" maxlength="30" title="设置昵称">
  <button class="btn-name-set" id="btnSetName">设置</button>
  <select class="theme-select" id="filterSelect" style="max-width:100px" title="筛选用户">
    <option value="">全部</option>
  </select>
  <button class="btn-clear" id="btnClear">清空</button>
</div>

<div class="msg-area" id="msgArea" role="log" aria-live="polite">
  <div style="text-align:center;color:var(--cn-ink-faint);padding:40px;font-size:14px;" id="loadingMsg">正在加载...</div>
</div>

<div class="input-area">
  <div class="input-actions">
    <button class="btn-icon" id="btnUploadPanel" title="上传管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span class="upload-badge" id="uploadBadge" style="display:none"></span>
    </button>
  </div>
  <textarea id="msgInput" rows="1" placeholder="输入消息，或粘贴文件..." maxlength="50000"></textarea>
  <button class="btn-send" id="btnSend"><span>发送</span></button>
</div>

<!-- Clear confirmation modal -->
<div class="modal-overlay" id="clearModal">
  <div class="modal" style="text-align:center">
    <h2>清空所有消息</h2>
    <p style="color:var(--cn-ink);font-size:15px;margin:16px 0 8px;line-height:1.6">确定清空所有聊天记录和上传的文件？</p>
    <p style="color:var(--cn-ink-light);font-size:13px;margin:0 0 20px">此操作不可恢复！</p>
    <div class="modal-actions" style="justify-content:center">
      <button class="btn-cancel" id="clearModalCancel">取消</button>
      <button class="btn-upload" id="clearModalConfirm" style="background:var(--cn-red)">确认清空</button>
    </div>
  </div>
</div>

<!-- Upload manager modal: left history + right detail/action panel.
     Closing the modal never stops background uploads. -->
<div class="modal-overlay upload-panel-overlay" id="uploadPanel">
  <div class="upload-modal" onclick="event.stopPropagation()">
    <div class="upload-panel-header">
      <h3>上传管理</h3>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn-speed-test" id="btnSpeedTest" title="15 秒压测">压测</button>
        <button class="upload-panel-close" id="btnUploadClose" title="关闭">&#10005;</button>
      </div>
    </div>
    <div class="speed-test-result" id="speedTestResult" style="display:none"></div>
    <div class="speed-test-result stress-test-result" id="stressTestResult" style="display:none"></div>
    <div class="upload-panel-body">
      <div class="upload-list" id="uploadList"></div>
      <div class="upload-detail" id="uploadDetail"></div>
      <div class="upload-detail upload-action-panel" id="uploadActionPanel" style="display:none">
        <h3>上传文件</h3>
        <input type="text" id="zipName" placeholder="压缩包名称（仅上传打包有效，默认：files）" value="">
        <div class="drop-zone" id="dropZone">
          <p>拖拽文件至此处，或点击选择</p>
        </div>
        <div class="file-list" id="fileList"></div>
        <!-- Progress section -->
        <div class="progress-section" id="progressSection" style="display:none">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-info" id="progressInfo">准备上传...</div>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="btnZipCancel">清空</button>
          <button class="btn-upload" id="btnDirectUpload">直接上传</button>
          <button class="btn-upload" id="btnZipUpload">上传打包</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Hidden file inputs (upload action + resume picker) -->
<input type="file" id="zipFileInput" style="display:none" multiple>
<input type="file" id="resumeFileInput" style="display:none">

<!-- Toast -->
<div class="toast" id="toast"></div>
<script src="/static/shader-runner.js"></script>
<script src="/static/script.js?v=18"></script>
</body>
</html>
