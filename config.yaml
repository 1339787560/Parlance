# flask 程序一定要用 DEBUG OFF。

server:
  host: 0.0.0.0
  port: 5001
  upload_dir: ./uploads
  max_upload_size: 1073741824  # 1GB
  zip_chunk_size: 67108864     # 64MB chunks for streaming zip

database:
  path: ./data/chat.db

# Managed services - launched as subprocesses
# Fields: name, command, args, cwd, env, auto_restart, health_check, tags, enabled, managed, port
#   managed=true (default): killed on parent exit via Job Object
#   managed=false: fire-and-forget, survives parent exit
#   port=<number>: auto-free port before start (kill occupying process)
services:
  - name: http-photo-server
    command: python
    args: ["C:\\codelib\\HttpPhotoServer\\src\\main.py", "--port", "5000"]
    cwd: C:\codelib\HttpPhotoServer\src
    port: 5000
    auto_restart: true
    tags: [media, gallery]
    enabled: true

  - name: statistic-server
    command_mac: ./.venv/bin/python
    command_win: python
    args: ["proxy_server.py", "--port", "5002"]
    cwd: ./serviceGroup/statisticServer
    port: 5002
    auto_restart: true
    tags: [statistics, proxy]
    enabled: true

  - name: debug-relay
    command_mac: ./.venv/bin/python
    command_win: python
    args: ["debug_relay.py", "--port", "5003", "--src", "D:\\Codlib\\douque\\xzmx\\ClientEngineGame\\trunk\\assets"]
    cwd: ./serviceGroup/debugRelay
    port: 5003
    auto_restart: true
    tags: [debug, game, cocos]
    enabled: true

  - name: wechatgame-static
    command: python
    args: ["-m", "http.server", "8003", "--bind", "192.168.41.158"]
    cwd: D:\Codlib\douque\xzmx\ClientEngineGame\trunk\build\wechatgame001
    port: 8003
    auto_restart: true
    tags: [static, wechatgame, cocos]
    enabled: true
