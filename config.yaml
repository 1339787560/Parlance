server:
  host: 0.0.0.0
  port: 5001
  upload_dir: ./uploads
  max_upload_size: 1073741824  # 1GB
  zip_chunk_size: 67108864     # 64MB chunks for streaming zip

database:
  path: ./data/chat.db

# Managed services - launched as subprocesses, killed on main shutdown
# Extensible fields: name, command, args, cwd, env, auto_restart, health_check, tags, enabled
services:
  - name: statistic-server
    command: python
    args: ["proxy_server.py", "--port", "5002"]
    cwd: ./serviceGroup/statisticServer
    auto_restart: true
    tags: [statistics, proxy]
    enabled: true
