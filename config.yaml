# flask 程序一定要用 DEBUG OFF。

server:
  host: 0.0.0.0
  port: 5001
  upload_dir: ./uploads
  max_upload_size: 1073741824  # 1GB
  zip_chunk_size: 67108864     # 64MB chunks for streaming zip

database:
  path: ./data/chat.db

# Managed services - launched as subprocesses
# Fields: name, command, args, cwd, env, auto_restart, health_check, tags, enabled, managed, port
#   managed=true (default): killed on parent exit via Job Object
#   managed=false: fire-and-forget, survives parent exit
#   port=<number>: auto-free port before start (kill occupying process)
services:
  - name: http-photo-server
    command: python
    args: ["C:\\codelib\\HttpPhotoServer\\src\\main.py", "--port", "5000"]
    cwd: C:\codelib\HttpPhotoServer\src
    port: 5000
    auto_restart: false
    tags: [media, gallery]
    enabled: true

  - name: statistic-server
    command: python
    args: ["proxy_server.py", "--port", "5002"]
    cwd: ./serviceGroup/statisticServer
    port: 5002
    auto_restart: true
    tags: [statistics, proxy]
    enabled: true

  - name: ds4codex
    command: ds4codex
    args: ["run", "--port", "5003"]
    port: 5003
    auto_restart: true
    tags: [proxy, deepseek, codex]
    enabled: true
    # 项目来源: https://github.com/seqyuan/ds4codex  作者: 苑赞 (seqyuan)
    # 作用: 协议翻译代理，让 Codex 通过 Responses API 使用 DeepSeek 模型
    # 设置 API Key 方式（任选一）：
    # 1) 在 env 中加入 DS4CODEX_API_KEY=sk-xxx
    # 2) 或设环境变量 DEEPSEEK_API_KEY
    # 3) 或通过 args 传 --api-key sk-xxx
